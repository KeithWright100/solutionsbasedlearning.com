<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KS3 Geography Quizzes — SBL</title>
<meta name="description" content="Quick KS3 geography quizzes on tropical storms, map skills and population, plus a Geography Helper for quiz hints — part of the Interactive KS3 Geography Games hub.">

<style>

*{
box-sizing:border-box;
font-family:'Segoe UI',Arial,sans-serif;
}

body{
margin:0;
padding:25px;
background:linear-gradient(180deg,#eaf1f8,#eef6ff);
color:#15263c;
line-height:1.5;
}

.sr-only{
position:absolute !important;
width:1px !important;
height:1px !important;
padding:0 !important;
margin:-1px !important;
overflow:hidden !important;
clip:rect(0,0,0,0) !important;
white-space:nowrap !important;
border:0 !important;
}

.topnav{
max-width:1100px;
margin:0 auto 14px;
font-size:16px;
}
.topnav a{
color:#1565c0;
text-decoration:none;
font-weight:bold;
}
.topnav a:hover{ text-decoration:underline; }

h1{
text-align:center;
color:#1565c0;
margin-bottom:8px;
font-size:clamp(1.6rem,4vw,2.4rem);
}

.subtitle{
text-align:center;
font-size:18px;
max-width:760px;
margin:0 auto 26px;
}

.wrap{
max-width:1000px;
margin:0 auto 80px;
}

/* ---------- quiz picker ---------- */

.quiz-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:18px;
margin-bottom:10px;
}

.quiz-card{
background:#ffffff;
border:1px solid #d7e2ef;
border-radius:14px;
padding:22px 22px 20px;
box-shadow:0 10px 24px rgba(21,38,60,0.08);
text-align:center;
}
.quiz-card .quiz-emoji{ font-size:34px; margin-bottom:8px; }
.quiz-card h2{ font-size:18px; margin:0 0 6px; color:#15263c; }
.quiz-card p{ font-size:14px; color:#4a5c6d; margin:0 0 16px; }

.btn{
appearance:none;
border:none;
border-radius:10px;
padding:11px 20px;
font-size:15px;
font-weight:700;
cursor:pointer;
color:#fff;
background:#1565c0;
transition:transform 0.15s ease, opacity 0.15s ease;
}
.btn:hover{ transform:translateY(-2px); }
.btn:disabled{ opacity:0.5; cursor:default; transform:none; }
.btn.secondary{ background:#5a6b7c; }
.btn.ghost{ background:transparent; color:#1565c0; border:2px solid #1565c0; padding:9px 18px; }

/* ---------- active quiz ---------- */

.quiz-panel{
display:none;
background:#ffffff;
border:1px solid #d7e2ef;
border-radius:14px;
padding:26px 26px 22px;
box-shadow:0 10px 26px rgba(21,38,60,0.08);
margin-top:22px;
}
.quiz-panel.is-active{ display:block; }

.quiz-panel-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-bottom:6px;
flex-wrap:wrap;
}
.quiz-panel-head h2{ margin:0; font-size:20px; color:#15263c; }
.quiz-progress{ font-size:13px; font-weight:700; color:#1565c0; }

.quiz-question{ font-size:17px; font-weight:700; margin:18px 0 14px; }

.quiz-options{
display:flex;
flex-direction:column;
gap:10px;
margin-bottom:16px;
}
.quiz-option{
appearance:none;
text-align:left;
border:2px solid #c7d4e2;
background:#f7fafd;
color:#15263c;
border-radius:10px;
padding:12px 16px;
font-size:15px;
cursor:pointer;
transition:border-color 0.15s ease, background 0.15s ease;
}
.quiz-option:hover{ border-color:#1565c0; }
.quiz-option.is-correct{ border-color:#0f9d58; background:#e8f8ee; color:#0f6b3c; font-weight:700; }
.quiz-option.is-wrong{ border-color:#c62828; background:#fdecea; color:#8a1f1f; font-weight:700; }
.quiz-option:disabled{ cursor:default; }

.quiz-feedback{
font-size:14.5px;
padding:12px 14px;
border-radius:10px;
margin-bottom:14px;
}
.quiz-feedback.correct{ background:#e8f8ee; color:#0f6b3c; }
.quiz-feedback.wrong{ background:#fdecea; color:#8a1f1f; }

.quiz-result{ text-align:center; padding:10px 0; }
.quiz-result .score{ font-size:32px; font-weight:800; color:#1565c0; margin-bottom:6px; }
.quiz-result p{ margin:0 0 18px; color:#4a5c6d; }

/* ---------- geography helper chat ---------- */

/* Note: the site-wide feedback widget (sbl-feedback-widget.js) plants
   its own launcher button at bottom-RIGHT with an extremely high
   z-index (999999) on every page. The Geography Helper lives at
   bottom-LEFT instead so the two never overlap or hide each other. */
#helperToggle{
position:fixed;
left:22px;
bottom:22px;
height:66px;
padding:0 26px 0 22px;
border-radius:999px;
background:#1565c0;
color:#fff;
border:none;
font-size:18px;
font-weight:800;
font-family:inherit;
cursor:pointer;
box-shadow:0 12px 28px rgba(21,38,60,0.32);
z-index:900000;
display:inline-flex;
align-items:center;
gap:11px;
white-space:nowrap;
}
#helperToggle .helper-toggle-icon{ font-size:26px; line-height:1; }
#helperToggle:hover{ transform:translateY(-2px); }

#helperPanel{
position:fixed;
left:22px;
bottom:106px;
width:320px;
max-width:calc(100vw - 44px);
max-height:70vh;
background:#ffffff;
border:1px solid #d7e2ef;
border-radius:16px;
box-shadow:0 20px 50px rgba(21,38,60,0.28);
display:none;
flex-direction:column;
overflow:hidden;
z-index:900000;
transition:width 0.2s ease, max-height 0.2s ease;
}
#helperPanel.is-open{ display:flex; }
#helperPanel.is-expanded{
width:640px;
max-width:calc(100vw - 44px);
max-height:92vh;
}

.helper-head{
background:#1565c0;
color:#fff;
padding:14px 16px;
font-weight:800;
font-size:15px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}
.helper-head-actions{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
.helper-head-actions button{
background:none;
border:none;
color:#fff;
font-size:16px;
cursor:pointer;
line-height:1;
padding:4px;
border-radius:6px;
}
.helper-head-actions button:hover{ background:rgba(255,255,255,0.18); }
#helperClose{ font-size:20px; }

#helperMessages{
flex:1;
overflow-y:auto;
padding:14px 14px 6px;
display:flex;
flex-direction:column;
gap:10px;
min-height:180px;
max-height:44vh;
}
#helperPanel.is-expanded #helperMessages{ max-height:70vh; min-height:340px; }

.helper-msg.typing{ font-style:italic; color:#5a6b7c; }
.helper-msg-image{ display:block; max-width:100%; margin-top:8px; border-radius:8px; }
.helper-msg{
max-width:85%;
padding:9px 12px;
border-radius:12px;
font-size:13.5px;
line-height:1.4;
}
.helper-msg.bot{
background:#eef3fa;
color:#15263c;
align-self:flex-start;
border-bottom-left-radius:4px;
}
.helper-msg.user{
background:#1565c0;
color:#fff;
align-self:flex-end;
border-bottom-right-radius:4px;
}

.helper-input-row{
display:flex;
gap:8px;
padding:12px;
border-top:1px solid #e5ecf3;
}
.helper-input-row input{
flex:1;
border:1px solid #c7d4e2;
border-radius:999px;
padding:9px 14px;
font-size:14px;
font-family:inherit;
}
.helper-input-row button{
border:none;
background:#1565c0;
color:#fff;
border-radius:999px;
width:38px;
height:38px;
font-size:16px;
cursor:pointer;
flex-shrink:0;
}

.helper-suggestions{
display:flex;
flex-wrap:wrap;
gap:6px;
padding:0 14px 12px;
}
.helper-suggestions button{
appearance:none;
border:1px solid #c7d4e2;
background:#f7fafd;
color:#1565c0;
border-radius:999px;
padding:5px 11px;
font-size:12px;
cursor:pointer;
}
.helper-suggestions button:hover{ border-color:#1565c0; }

@media (max-width:600px){
  .quiz-panel{ padding:20px 18px; }
  #helperPanel{ right:12px; left:12px; width:auto; bottom:98px; }
  #helperPanel.is-expanded{ max-height:88vh; }
  #helperToggle{ left:16px; bottom:16px; }
}

</style>
</head>
<body>

<div class="topnav"><a href="/geography/games">&larr; Back to Interactive KS3 Geography Games</a></div>

<div class="wrap">
  <h1>KS3 Geography Quizzes</h1>
  <p class="subtitle">Pick a topic and test yourself. Stuck on a term? Tap the Geography Helper in the corner for a quick hint.</p>

  <div class="quiz-grid" id="quizPicker"></div>

  <div class="quiz-panel" id="quizPanel">
    <div class="quiz-panel-head">
      <h2 id="quizPanelTitle"></h2>
      <span class="quiz-progress" id="quizProgress"></span>
    </div>
    <div id="quizBody"></div>
  </div>
</div>

<button type="button" id="helperToggle" aria-label="Open Geography Helper"><span class="helper-toggle-icon">&#127757;</span> Geography Helper</button>
<div id="helperPanel" aria-live="polite">
  <div class="helper-head">
    <span>&#127757; Geography Helper</span>
    <div class="helper-head-actions">
      <button type="button" id="helperExpand" aria-label="Expand Geography Helper">&#10530;</button>
      <button type="button" id="helperClose" aria-label="Close Geography Helper">&times;</button>
    </div>
  </div>
  <div id="helperMessages"></div>
  <div class="helper-suggestions" id="helperSuggestions"></div>
  <div class="helper-input-row">
    <input type="text" id="helperInput" placeholder="Ask any geography question..." maxlength="300">
    <button type="button" id="helperSend" aria-label="Send">&#10148;</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ==================== QUIZ DATA ==================== */

  var QUIZZES = [
    {
      id: 'storms',
      emoji: '🌀',
      title: 'Tropical Storms',
      blurb: 'Formation, structure and impacts.',
      questions: [
        {
          q: 'What forms at the centre of a tropical storm, where the weather is calm?',
          options: ['The eye', 'The eyewall', 'The spiral rain band', 'The storm surge'],
          correct: 0,
          explain: 'The eye is the calm centre. The eyewall around it has the strongest winds and heaviest rain.'
        },
        {
          q: 'Tropical storms form over ocean water that is at least how warm?',
          options: ['10°C', '18°C', '27°C', '40°C'],
          correct: 2,
          explain: 'Sea temperatures of 26-27°C or higher provide the energy (heat and moisture) a tropical storm needs to form.'
        },
        {
          q: 'Which of these is a PRIMARY effect of a tropical storm?',
          options: ['Disease spreading afterwards', 'Damage to buildings from high winds', 'Shortage of clean water', 'The cost of rebuilding'],
          correct: 1,
          explain: 'Primary effects happen immediately, caused directly by the storm itself — like wind damage. The others are secondary effects that follow afterwards.'
        },
        {
          q: 'Why do wealthier countries usually have fewer deaths from tropical storms than poorer countries?',
          options: ['They get fewer storms', 'Storms are weaker near wealthy countries', 'They can afford warning systems, strong buildings and emergency services', 'They are always further from the coast'],
          correct: 2,
          explain: 'Wealth affects how well a country can prepare for and respond to a hazard — through warning systems, building design, and emergency services.'
        },
        {
          q: 'What is a storm surge?',
          options: ['A sudden rise in sea level pushed onshore by the storm', 'A very strong gust of wind', 'The path the storm travels along', 'A type of tropical storm found only in Asia'],
          correct: 0,
          explain: 'A storm surge is a wall of sea water pushed ashore by the storm’s winds and low pressure — it causes major coastal flooding.'
        }
      ]
    },
    {
      id: 'mapskills',
      emoji: '🧭',
      title: 'Map &amp; Location Skills',
      blurb: 'Compass points, scale and grid references.',
      questions: [
        {
          q: 'If you are facing North and turn 90° clockwise, which direction do you now face?',
          options: ['South', 'East', 'West', 'North-West'],
          correct: 1,
          explain: 'Clockwise from North goes N → E → S → W. A 90° clockwise turn from North faces East.'
        },
        {
          q: 'On an Ordnance Survey-style grid reference, which set of digits do you read FIRST?',
          options: ['The northing (vertical, up the side)', 'The easting (horizontal, along the bottom)', 'Whichever is larger', 'It doesn’t matter'],
          correct: 1,
          explain: 'Remember "along the corridor, up the stairs" — read the easting (horizontal) first, then the northing (vertical).'
        },
        {
          q: 'A map has a scale of 1:50,000. How much real distance does 1cm on the map represent?',
          options: ['50 m', '500 m', '5 km', '50 km'],
          correct: 1,
          explain: '1:50,000 means 1cm on the map = 50,000cm in real life = 500m.'
        },
        {
          q: 'What do contour lines on a map show?',
          options: ['Roads and paths', 'Height above sea level', 'Rivers and lakes', 'Country borders'],
          correct: 1,
          explain: 'Contour lines join points of equal height. Lines close together show steep slopes; lines far apart show gentle slopes.'
        },
        {
          q: 'Which continent is entirely south of the Equator?',
          options: ['Africa', 'South America', 'Australia', 'Antarctica'],
          correct: 3,
          explain: 'Antarctica lies entirely south of the Equator. Africa and South America are crossed by it, and Australia is south of it but not the only correct type of answer here — Antarctica is fully south.'
        }
      ]
    },
    {
      id: 'population',
      emoji: '👥',
      title: 'Population &amp; Places',
      blurb: 'Key vocabulary for describing places and people.',
      questions: [
        {
          q: 'What does "population density" measure?',
          options: ['The total number of people in a country', 'The number of people per square kilometre', 'How fast a population is growing', 'The average age of a population'],
          correct: 1,
          explain: 'Population density = number of people ÷ area. It tells us how crowded or spread out a population is.'
        },
        {
          q: 'What is "urbanisation"?',
          options: ['Building new farms in the countryside', 'The growing proportion of people living in towns and cities', 'A type of natural disaster', 'The process of a city becoming smaller'],
          correct: 1,
          explain: 'Urbanisation is the increase in the proportion of a population living in urban areas rather than rural areas.'
        },
        {
          q: 'A country with a low GDP per person, often with a young, fast-growing population, is usually described as:',
          options: ['A HIC (High Income Country)', 'A LIC (Low Income Country)', 'A NEE (Newly Emerging Economy)', 'A landlocked country'],
          correct: 1,
          explain: 'LICs (Low Income Countries) tend to have lower average incomes and often have younger, faster-growing populations than HICs.'
        },
        {
          q: 'What does "life expectancy" mean?',
          options: ['The number of children a person has', 'The average age a person is expected to live to', 'How long someone has lived so far', 'The retirement age in a country'],
          correct: 1,
          explain: 'Life expectancy is the average number of years a person born in a place today is expected to live.'
        },
        {
          q: 'Which of these would most likely INCREASE the birth rate of a country?',
          options: ['Better access to education for girls', 'Improved contraception and family planning', 'A strong cultural preference for large families', 'Rising costs of raising children'],
          correct: 2,
          explain: 'A cultural preference for large families tends to raise birth rates. The other options are all factors that typically lower birth rates.'
        }
      ]
    }
  ];

  /* ==================== GEOGRAPHY HELPER (AI-backed) ====================
     Open-ended geography Q&A. Reuses the same /api/mark-ppq serverless
     function (and the "SBL PPQ Marker" bot behind it) as the IB
     Style Questions marking feature elsewhere on the site, but framed
     as an answer-a-question prompt rather than a mark-this-answer one
     — see buildHelperPrompt() below. Because this page has no login,
     a soft per-visit question cap (MAX_HELPER_QUESTIONS) is applied
     purely to limit runaway usage of the shared marking service. */

  var HELPER_SUGGESTIONS = [{ label: 'e.g. What is a delta?', value: 'What is a delta?' }];

  var HELPER_GREETING = 'Hi! I’m the Geography Helper. Ask me any geography question — not just from these quizzes.';
  var MAX_HELPER_QUESTIONS = 20;
  var HELPER_LIMIT_MESSAGE = 'You’ve asked lots of questions this visit — nice work! Please check back a bit later, or ask your teacher in the meantime.';

  function buildHelperPrompt(studentQuestion) {
    return {
      question: 'You are the "Geography Helper", a friendly chatbot for KS3 (Year 7-9, ages 11-14) students on a geography quizzes page. ' +
        'The student has typed a free-form geography question of their own (it appears as STUDENT ANSWER below, even though it is a QUESTION, not an answer — that is just the shape of this system). ' +
        'STRICT LENGTH LIMIT: your entire reply must be no more than 2 short sentences and about 35 words in total. This is a hard limit, not a target — a longer reply is a failure, even if accurate. ' +
        'Write like you are quickly explaining it out loud to an 11-year-old who is standing in front of you, not writing a paragraph or an essay. One plain idea, in plain words. ' +
        'Never use bullet points, numbered lists, multiple paragraphs, sub-points, or more than one example. ' +
        'Do NOT mark or grade anything. Do NOT give a mark, a score, or a score out of any number. Do NOT use exam-style section headings such as "MARK AWARDED", "WHY THIS MARK", "WHAT WAS DONE WELL" or similar, and do not add a follow-up question of your own — just the short answer itself. ' +
        'If the question is not about geography, say so in one short friendly sentence and suggest a geography topic instead.',
      maxMark: 1,
      markingGuidance: 'This is not an exam question. There is no mark scheme and no score. The single most important rule is brevity: 2 sentences maximum, around 35 words maximum, no exceptions.'
    };
  }

  // Hard backstop in case the bot ignores the length instruction above.
  // Keeps at most the first 2 sentences and ~260 characters, so a reply
  // never balloons into an exam-style essay regardless of what the
  // underlying marking bot returns.
  function trimHelperAnswer(text) {
    if (!text) return text;
    var sentences = text.match(/[^.!?]+[.!?]+(\s|$)/g);
    var trimmed = sentences ? sentences.slice(0, 2).join('').trim() : text;
    if (trimmed.length > 260) trimmed = trimmed.slice(0, 257).trim() + '…';
    return trimmed;
  }

  /* ==================== GEOGRAPHY HELPER — curated photos ====================
     Keitth is supplying real photos for these topics (Mount Ruapehu case
     study) over time. Each entry's `image` path is where that photo
     should be saved — once a file actually exists there, it will start
     appearing automatically next to any matching answer. Until then,
     the onerror handler on the <img> (see renderHelperAnswer) hides a
     missing photo silently rather than showing a broken image icon, so
     it's safe to ship this ahead of having every photo in hand.

     Order matters: the FIRST matching entry wins, so more specific
     topics (e.g. "lahar") are listed before generic ones ("volcano"). */

  var HELPER_IMAGE_FOLDER = '/images/geography-helper/ruapehu/';

  var HELPER_IMAGES = [
    { keys: ['lahar'], file: 'lahar.jpg', alt: 'A lahar — a fast-moving volcanic mudflow' },
    { keys: ['magma', 'magama'], file: 'magma.jpg', alt: 'Magma — molten rock beneath the surface' },
    { keys: ['subduction'], file: 'subduction.jpg', alt: 'A subduction zone at a destructive plate boundary' },
    { keys: ['destructive plate boundary', 'destructive boundary'], file: 'destructive-plate-boundary.jpg', alt: 'A simple diagram of a destructive plate boundary' },
    { keys: ['landslide', 'landslides'], file: 'landslide.jpg', alt: 'A landslide' },
    { keys: ['glacier', 'glaciers'], file: 'glacier.jpg', alt: 'A glacier' },
    { keys: ['lava'], file: 'lava.jpg', alt: 'Lava from a volcanic eruption' },
    { keys: ['volcanic ash', ' ash '], file: 'ash.jpg', alt: 'Volcanic ash' },
    { keys: ['stratovolcano', 'strato volcano', 'erupting'], file: 'stratovolcano-erupting.jpg', alt: 'A stratovolcano erupting' },
    { keys: ['volcanic mineral', 'coloured mineral', 'colored mineral'], file: 'volcanic-minerals.jpg', alt: 'Coloured volcanic minerals' },
    { keys: ['tourist site', 'tourist sites'], file: 'ruapehu-tourist-sites.jpg', alt: 'Tourist sites around Mount Ruapehu' },
    { keys: ['damage'], file: 'volcano-damage.jpg', alt: 'Damage caused by a volcanic eruption' },
    { keys: ['local resident'], file: 'local-residents.jpg', alt: 'Local residents near Mount Ruapehu' },
    { keys: ['tour operator'], file: 'tour-operators.jpg', alt: 'Tour operators at Mount Ruapehu' },
    { keys: ['ruapehu'], file: 'ruapehu.jpg', alt: 'Mount Ruapehu' },
    { keys: ['volcano'], file: 'volcano.jpg', alt: 'A volcano' }
  ];

  function findHelperImage(studentQuestion) {
    var lower = ' ' + studentQuestion.toLowerCase() + ' ';
    var match = HELPER_IMAGES.find(function (entry) {
      return entry.keys.some(function (key) { return lower.indexOf(key) !== -1; });
    });
    return match ? { src: HELPER_IMAGE_FOLDER + match.file, alt: match.alt } : null;
  }

  function renderHelperAnswer(container, text, imageMatch) {
    var html = escapeHtml(text);
    if (imageMatch) {
      html += '<img src="' + escapeHtml(imageMatch.src) + '" alt="' + escapeHtml(imageMatch.alt) + '" class="helper-msg-image" loading="lazy" onerror="this.remove()">';
    }
    container.innerHTML = html;
  }

  /* ==================== QUIZ RENDERING ==================== */

  var picker = document.getElementById('quizPicker');
  var panel = document.getElementById('quizPanel');
  var panelTitle = document.getElementById('quizPanelTitle');
  var progressEl = document.getElementById('quizProgress');
  var body = document.getElementById('quizBody');

  var activeQuiz = null;
  var qIndex = 0;
  var score = 0;

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  QUIZZES.forEach(function (quiz) {
    var card = document.createElement('div');
    card.className = 'quiz-card';
    card.innerHTML =
      '<div class="quiz-emoji">' + quiz.emoji + '</div>' +
      '<h2>' + quiz.title + '</h2>' +
      '<p>' + quiz.blurb + ' &middot; ' + quiz.questions.length + ' questions</p>' +
      '<button type="button" class="btn">Start quiz</button>';
    card.querySelector('button').addEventListener('click', function () { startQuiz(quiz); });
    picker.appendChild(card);
  });

  function startQuiz(quiz) {
    activeQuiz = quiz;
    qIndex = 0;
    score = 0;
    panel.classList.add('is-active');
    panelTitle.textContent = quiz.emoji + ' ' + quiz.title;
    renderQuestion();
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderQuestion() {
    var q = activeQuiz.questions[qIndex];
    progressEl.textContent = 'Question ' + (qIndex + 1) + ' of ' + activeQuiz.questions.length;

    var html = '<div class="quiz-question">' + escapeHtml(q.q) + '</div>';
    html += '<div class="quiz-options" id="quizOptions">';
    q.options.forEach(function (opt, i) {
      html += '<button type="button" class="quiz-option" data-index="' + i + '">' + escapeHtml(opt) + '</button>';
    });
    html += '</div>';
    html += '<div id="quizFeedback"></div>';
    body.innerHTML = html;

    var optionButtons = body.querySelectorAll('.quiz-option');
    optionButtons.forEach(function (btn) {
      btn.addEventListener('click', function () { answerQuestion(parseInt(btn.getAttribute('data-index'), 10)); });
    });
  }

  function answerQuestion(chosenIndex) {
    var q = activeQuiz.questions[qIndex];
    var optionButtons = body.querySelectorAll('.quiz-option');
    optionButtons.forEach(function (btn, i) {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add('is-correct');
      else if (i === chosenIndex) btn.classList.add('is-wrong');
    });

    var isCorrect = chosenIndex === q.correct;
    if (isCorrect) score += 1;

    var feedback = document.getElementById('quizFeedback');
    feedback.innerHTML =
      '<div class="quiz-feedback ' + (isCorrect ? 'correct' : 'wrong') + '">' +
      (isCorrect ? '<strong>Correct!</strong> ' : '<strong>Not quite.</strong> ') +
      escapeHtml(q.explain) + '</div>' +
      '<button type="button" class="btn" id="quizNextBtn">' +
      (qIndex + 1 < activeQuiz.questions.length ? 'Next question →' : 'See my score →') +
      '</button>';

    document.getElementById('quizNextBtn').addEventListener('click', function () {
      qIndex += 1;
      if (qIndex < activeQuiz.questions.length) {
        renderQuestion();
      } else {
        renderResult();
      }
    });
  }

  function renderResult() {
    progressEl.textContent = 'Complete';
    var total = activeQuiz.questions.length;
    var msg;
    if (score === total) msg = 'Brilliant — full marks!';
    else if (score >= total * 0.6) msg = 'Good work — review the ones you missed and try again.';
    else msg = 'Worth another go — use the Geography Helper for any terms you’re unsure of.';

    body.innerHTML =
      '<div class="quiz-result">' +
      '<div class="score">' + score + ' / ' + total + '</div>' +
      '<p>' + msg + '</p>' +
      '<button type="button" class="btn" id="quizRetryBtn">Try again</button> ' +
      '<button type="button" class="btn ghost" id="quizBackBtn">Choose another quiz</button>' +
      '</div>';

    document.getElementById('quizRetryBtn').addEventListener('click', function () { startQuiz(activeQuiz); });
    document.getElementById('quizBackBtn').addEventListener('click', function () {
      panel.classList.remove('is-active');
      picker.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  /* ==================== GEOGRAPHY HELPER UI ==================== */

  var helperToggle = document.getElementById('helperToggle');
  var helperPanel = document.getElementById('helperPanel');
  var helperClose = document.getElementById('helperClose');
  var helperExpand = document.getElementById('helperExpand');
  var helperMessages = document.getElementById('helperMessages');
  var helperInput = document.getElementById('helperInput');
  var helperSend = document.getElementById('helperSend');
  var helperSuggestions = document.getElementById('helperSuggestions');

  var helperOpened = false;
  var helperBusy = false;
  var helperQuestionCount = 0;

  function addHelperMessage(text, who) {
    var div = document.createElement('div');
    div.className = 'helper-msg ' + who;
    div.textContent = text;
    helperMessages.appendChild(div);
    helperMessages.scrollTop = helperMessages.scrollHeight;
    return div;
  }

  function setHelperBusy(isBusy) {
    helperBusy = isBusy;
    helperSend.disabled = isBusy;
    helperInput.disabled = isBusy;
  }

  function answerHelper(studentQuestion) {
    setHelperBusy(true);
    var typingMsg = addHelperMessage('Thinking…', 'bot typing');

    var payload = buildHelperPrompt(studentQuestion);

    fetch('/api/mark-ppq', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: payload.question,
        maxMark: payload.maxMark,
        markingGuidance: payload.markingGuidance,
        studentAnswer: studentQuestion
      })
    })
      .then(function (res) {
        return res.json().then(function (data) {
          if (!res.ok) throw new Error((data && data.error) || 'Could not get an answer.');
          return data;
        });
      })
      .then(function (data) {
        var feedback = data.feedback || {};
        var answerText = feedback.whyThisMark || data.raw || 'Sorry, I couldn’t work out an answer to that — try rephrasing your question.';
        var imageMatch = findHelperImage(studentQuestion);
        renderHelperAnswer(typingMsg, trimHelperAnswer(answerText), imageMatch);
        typingMsg.className = 'helper-msg bot';
      })
      .catch(function (err) {
        typingMsg.textContent = 'Sorry, that didn’t go through (' + (err.message || 'please try again') + ').';
        typingMsg.className = 'helper-msg bot';
      })
      .finally(function () {
        setHelperBusy(false);
        helperInput.focus();
      });
  }

  function sendHelperQuestion() {
    if (helperBusy) return;
    var text = helperInput.value.trim();
    if (!text) return;

    if (helperQuestionCount >= MAX_HELPER_QUESTIONS) {
      addHelperMessage(text, 'user');
      helperInput.value = '';
      addHelperMessage(HELPER_LIMIT_MESSAGE, 'bot');
      return;
    }

    helperQuestionCount += 1;
    addHelperMessage(text, 'user');
    helperInput.value = '';
    answerHelper(text);
  }

  HELPER_SUGGESTIONS.forEach(function (s) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = s.label;
    btn.addEventListener('click', function () {
      if (helperBusy) return;
      helperInput.value = s.value;
      sendHelperQuestion();
    });
    helperSuggestions.appendChild(btn);
  });

  helperToggle.addEventListener('click', function () {
    helperPanel.classList.toggle('is-open');
    if (helperPanel.classList.contains('is-open') && !helperOpened) {
      helperOpened = true;
      addHelperMessage(HELPER_GREETING, 'bot');
    }
  });
  helperClose.addEventListener('click', function () { helperPanel.classList.remove('is-open'); });
  helperExpand.addEventListener('click', function () {
    var isExpanded = helperPanel.classList.toggle('is-expanded');
    helperExpand.innerHTML = isExpanded ? '&#10531;' : '&#10530;';
    helperExpand.setAttribute('aria-label', isExpanded ? 'Shrink Geography Helper' : 'Expand Geography Helper');
  });
  helperSend.addEventListener('click', sendHelperQuestion);
  helperInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') sendHelperQuestion();
  });

})();
</script>

<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/js/sbl-feedback-widget.js"></script>
</body>
