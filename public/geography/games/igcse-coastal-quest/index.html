<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coastal Quest — IGCSE Geography Coastal Environments Revision Game — SBL</title>
<meta name="description" content="Edexcel IGCSE Geography revision game for Paper 1 Coastal Environments: 16 levels covering waves, erosion, weathering, landforms, coastal ecosystems, coral reefs, threats, conflicts, flooding, hard and soft engineering, Sri Lanka and Holderness, with labelled diagrams, data skills, past paper checkpoint questions and an Edexcel Examiner boss fight.">
<style>
  :root {
    --navy: #0f3a5c; --deep: #071a2c; --teal: #00b8b0; --teal-dark: #007c82; --cyan: #20d7e2;
    --ink: #062033; --muted: #4a6272; --line: rgba(5,43,65,0.13);
    --green: #16a34a; --green-soft: #e7f7ed; --red: #dc2626; --red-soft: #fdecec; --amber: #d97706; --amber-soft: #fff4dc;
    --gold: #f59e0b; --purple: #7c3aed;
    --c1: #65a30d; --c2: #ea580c; --c3: #0284c7; --c4: #7c3aed;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-padding-top: 80px; }
  .panel { scroll-margin-top: 80px; }
  body { font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--ink); min-height: 100vh;
    background: radial-gradient(circle at 10% 0%, rgba(0,184,176,0.14), transparent 40%), radial-gradient(circle at 100% 20%, rgba(245,158,11,0.12), transparent 35%), linear-gradient(180deg, #f4fbfc, #e9f2f5); }
  a { color: inherit; text-decoration: none; }
  button, input { font-family: inherit; }
  button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .top-bar { padding: 16px 20px; color: #fff; background: linear-gradient(135deg, #011526, #02324e); }
  .top-inner { max-width: 1150px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; font-weight: 700; color: rgba(255,255,255,0.85); }
  .back-link:hover { color: var(--cyan); }
  .brand { font-weight: 900; } .brand span { color: var(--teal); }

  /* HUD */
  .hud { position: sticky; top: 0; z-index: 50; background: rgba(7,26,44,0.96); color: #fff; padding: 8px 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
  .hud-inner { max-width: 1150px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; }
  .hud .xp { font-weight: 900; font-size: 1rem; color: var(--gold); white-space: nowrap; }
  .hud .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .hud .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold)); transition: width .6s ease; }
  .hud .lv { font-size: 0.82rem; font-weight: 800; white-space: nowrap; color: rgba(255,255,255,0.85); }
  .hud .badges { font-size: 1.05rem; letter-spacing: 2px; white-space: nowrap; }
  .hud .badges .off { filter: grayscale(1); opacity: 0.3; }
  .xp-pop { position: fixed; z-index: 3000; font-weight: 900; color: var(--gold); font-size: 1.1rem; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,0.25); animation: xpPop 1.1s ease forwards; }
  @keyframes xpPop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-50px); } }

  main { max-width: 1150px; margin: 18px auto 60px; padding: 0 16px; }
  .hero { text-align: center; padding: 18px 10px 6px; }
  .kicker { display: inline-block; font-size: 0.74rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--teal), #0792a3); padding: 5px 12px; border-radius: 999px; margin-bottom: 10px; }
  h1 { font-size: clamp(1.5rem, 3.6vw, 2.4rem); font-weight: 900; color: var(--navy); line-height: 1.15; }
  .hero p { color: var(--muted); max-width: 760px; margin: 8px auto 0; line-height: 1.55; font-weight: 500; }

  /* level map */
  .map { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 18px; }
  .lvcard { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 16px; padding: 14px; cursor: pointer; position: relative; color: var(--ink); box-shadow: 0 8px 20px rgba(0,25,45,0.06); transition: transform .2s ease; min-height: 130px; }
  .lvcard:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--teal); }
  .lvcard .num { display: block; padding-right: 24px; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.07em; color: var(--teal-dark); text-transform: uppercase; }
  .lvcard .emo { font-size: 1.8rem; display: block; margin: 4px 0; }
  .lvcard b { display: block; font-size: 1rem; line-height: 1.25; }
  .lvcard small { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 4px; line-height: 1.35; }
  .lvcard .st { position: absolute; top: 12px; right: 12px; font-size: 1.1rem; }
  .lvcard:disabled { cursor: not-allowed; background: #f1f5f9; color: #94a3b8; box-shadow: none; }
  .lvcard:disabled .emo { filter: grayscale(1); opacity: 0.5; }
  .lvcard.done { border-color: rgba(22,163,74,0.45); background: linear-gradient(180deg, #fff, #f0fdf4); }
  .lvcard.next { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(245,158,11,0.18); }
  .shelf { margin-top: 18px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .shelf h2 { font-size: 1.05rem; color: var(--navy); margin-bottom: 8px; }
  .bdg-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .bdg { display: flex; gap: 10px; align-items: center; padding: 9px 11px; border-radius: 12px; background: #f8fafc; border: 1px solid var(--line); font-size: 0.82rem; }
  .bdg .i { font-size: 1.6rem; filter: grayscale(1); opacity: 0.35; }
  .bdg b { display: block; font-size: 0.9rem; }
  .bdg.on { background: #fffbeb; border-color: rgba(245,158,11,0.5); }
  .bdg.on .i { filter: none; opacity: 1; }
  .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 14px; font-size: 0.8rem; color: var(--muted); }
  .linkbtn { background: none; border: none; color: var(--teal-dark); font-weight: 800; cursor: pointer; font-size: 0.8rem; text-decoration: underline; }

  /* level screen */
  .lvhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .lvhead .emo { font-size: 2.2rem; }
  .lvhead h2 { font-size: 1.4rem; color: var(--navy); font-weight: 900; }
  .lvhead .tag { font-size: 0.72rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--teal-dark); }
  .lvhead .spacer { flex: 1; }
  .panel { background: rgba(255,255,255,0.97); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: 0 14px 34px rgba(0,25,45,0.07); margin-bottom: 14px; }
  .panel h3 { font-size: 1.05rem; font-weight: 900; color: var(--navy); margin-bottom: 6px; }
  .how { font-size: 0.93rem; color: var(--muted); line-height: 1.55; margin-bottom: 12px; }
  .how b { color: var(--ink); }
  .stage-tag { display: inline-block; font-size: 0.7rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; background: var(--amber-soft); color: #92400e; padding: 3px 9px; border-radius: 999px; margin-bottom: 6px; }
  .btn { border: none; border-radius: 12px; padding: 11px 18px; font-weight: 800; font-size: 0.93rem; cursor: pointer; transition: transform .2s ease; }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn.primary { color: #fff; background: linear-gradient(135deg, #00b8b0, #0392a2); box-shadow: 0 8px 20px rgba(0,184,176,0.28); }
  .btn.gold { color: #422006; background: linear-gradient(135deg, #fcd34d, #f59e0b); box-shadow: 0 8px 20px rgba(245,158,11,0.3); }
  .btn.ghost { background: #fff; color: var(--navy); border: 1px solid rgba(5,43,65,0.2); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .msg { font-weight: 750; font-size: 0.92rem; text-align: center; min-height: 1.3em; margin-top: 10px; }
  .msg.ok { color: var(--green); } .msg.no { color: var(--red); } .msg.info { color: var(--amber); }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* sort engine */
  .sg-tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; min-height: 54px; padding: 10px; border-radius: 14px; background: #fff; border: 1px dashed var(--line); }
  .sg-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 0.86rem; padding: 6px; }
  .sg-card { background: #fff; border: 2px solid rgba(5,43,65,0.16); border-radius: 12px; padding: 9px 11px; cursor: grab; user-select: none; touch-action: none; font-size: 0.88rem; line-height: 1.35; font-weight: 700; box-shadow: 0 3px 8px rgba(0,25,45,0.06); }
  .sg-card small { display: block; font-weight: 500; color: var(--muted); font-size: 0.76rem; }
  .sg-card.selected { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(0,184,176,0.25); }
  .sg-card.dragging { cursor: grabbing; box-shadow: 0 14px 28px rgba(0,0,0,0.22); }
  .sg-card.correct { border-color: var(--green); background: var(--green-soft); }
  .sg-card.incorrect { border-color: var(--red); background: var(--red-soft); }
  .sg-card .fb { display: none; margin-top: 4px; font-size: 0.74rem; font-weight: 700; color: #7f1d1d; }
  .sg-card.incorrect .fb { display: block; }
  .sg-card.correct .fb.alt { display: block; color: var(--teal-dark); }
  .sg-zones { display: grid; gap: 10px; margin-top: 12px; }
  .sg-zones.z2 { grid-template-columns: repeat(2, 1fr); } .sg-zones.z3 { grid-template-columns: repeat(3, 1fr); } .sg-zones.z4 { grid-template-columns: repeat(4, 1fr); }
  .sg-zone { border-radius: 16px; padding: 10px; min-height: 130px; border: 3px dashed #94a3b8; background: rgba(255,255,255,0.92); cursor: pointer; }
  .sg-zone.hover { background: #f0fbfa; }
  .sg-zone h4 { font-size: 0.95rem; font-weight: 900; margin-bottom: 2px; }
  .sg-zone .zsub { font-size: 0.74rem; color: var(--muted); margin-bottom: 6px; line-height: 1.35; }
  .sg-zone .zc { display: grid; gap: 6px; min-height: 40px; }
  .zc1 { border-color: var(--c1); } .zc1 h4 { color: var(--c1); }
  .zc2 { border-color: var(--c2); } .zc2 h4 { color: var(--c2); }
  .zc3 { border-color: var(--c3); } .zc3 h4 { color: var(--c3); }
  .zc4 { border-color: var(--c4); } .zc4 h4 { color: var(--c4); }
  .zg { border-color: var(--green); } .zg h4 { color: var(--green); }
  .zr { border-color: var(--red); } .zr h4 { color: var(--red); }

  /* choices / mcq */
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin: 8px 0; }
  .choice { text-align: left; padding: 11px 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-size: 0.9rem; font-weight: 700; color: var(--ink); line-height: 1.4; }
  .choice:hover:not(:disabled) { border-color: var(--teal); }
  .choice.right { border-color: var(--green); background: var(--green-soft); }
  .choice.wrong { border-color: var(--red); background: var(--red-soft); }
  .choice.sel { border-color: var(--navy); background: #e8f0f7; }
  .choice:disabled { cursor: default; }
  .fbk { display: none; margin-top: 8px; padding: 10px 12px; border-radius: 12px; font-size: 0.9rem; line-height: 1.5; }
  .fbk.show { display: block; } .fbk.good { background: var(--green-soft); border-left: 5px solid var(--green); } .fbk.bad { background: var(--red-soft); border-left: 5px solid var(--red); }
  .q { padding: 14px; border-radius: 14px; background: #f8fbfd; border: 1px solid var(--line); margin-bottom: 10px; }
  .q h4 { font-size: 0.98rem; font-weight: 850; line-height: 1.4; }

  /* order */
  .ord-pool, .ord-chain { display: grid; gap: 7px; }
  .ord-chain { counter-reset: s; min-height: 56px; padding: 10px; border-radius: 14px; border: 2px dashed #fcd34d; background: #fffdf5; margin-top: 10px; }
  .ord-item { padding: 10px 12px; border-radius: 11px; background: #fff; border: 2px solid rgba(5,43,65,0.16); cursor: pointer; font-size: 0.9rem; font-weight: 700; line-height: 1.4; text-align: left; color: var(--ink); }
  .ord-chain .ord-item { border-color: var(--gold); position: relative; padding-left: 42px; }
  .ord-chain .ord-item::before { counter-increment: s; content: counter(s); position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #422006; font-size: 0.78rem; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .ord-chain .ord-item.right { border-color: var(--green); background: var(--green-soft); }
  .ord-chain .ord-item.wrong { border-color: var(--red); background: var(--red-soft); }
  .ord-empty { color: var(--muted); font-size: 0.85rem; text-align: center; }
  .arrow { text-align: center; color: var(--gold); font-weight: 900; line-height: 0.7; }

  /* table */
  table.data { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; font-size: 0.92rem; margin: 6px 0 10px; }
  table.data th, table.data td { padding: 9px 10px; border-bottom: 1px solid rgba(5,43,65,0.08); text-align: center; }
  table.data th { background: #f1f5f9; font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  table.data td:first-child { font-weight: 900; }
  .cf-graph { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
  .cf-graph svg { display: block; width: 100%; height: auto; }
  .cf-line { stroke-dasharray: 100 100; stroke-dashoffset: 100; transition: stroke-dashoffset 2.4s ease; }
  .cf-graph.go .cf-line { stroke-dashoffset: 0; }
  .cf-mark { opacity: 0; transition: opacity .6s ease; }
  .cf-graph.go .cf-mark { opacity: 1; transition-delay: 2.4s; }

  /* escape room locks */
  .locks { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .lock { border-radius: 16px; padding: 14px; background: #fff; border: 2px solid var(--line); }
  .lock .lh { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .lock .lh .pad { font-size: 1.6rem; }
  .lock .lh b { font-size: 1rem; }
  .lock .lh small { display: block; color: var(--muted); font-size: 0.78rem; }
  .lock.open { border-color: var(--green); background: var(--green-soft); }
  .door { text-align: center; font-size: 3rem; margin-top: 10px; transition: transform .6s ease; }

  /* yes/no flash */
  .flash { text-align: center; padding: 20px; border-radius: 18px; background: linear-gradient(135deg, #0f3a5c, #155e75); color: #fff; }
  .flash .card { font-size: 1.4rem; font-weight: 900; margin: 10px 0 16px; min-height: 2.2em; display: flex; align-items: center; justify-content: center; }
  .flash .count { font-size: 0.8rem; opacity: 0.8; font-weight: 700; }
  .flash .yn { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .flash .yn button { min-width: 140px; padding: 14px 18px; border-radius: 14px; border: none; font-weight: 900; font-size: 1rem; cursor: pointer; }
  .flash .y { background: #4ade80; color: #052e16; } .flash .n { background: #fca5a5; color: #450a0a; }
  .flash .fb2 { min-height: 1.5em; margin-top: 12px; font-weight: 700; font-size: 0.92rem; }
  .flash .timer { font-size: 2rem; font-weight: 900; color: var(--gold); }
  .tbar { height: 8px; background: rgba(255,255,255,0.2); border-radius: 99px; overflow: hidden; margin: 6px auto 0; max-width: 420px; }
  .tbar div { height: 100%; background: var(--gold); transition: width 1s linear; }
  kbd { background: rgba(255,255,255,0.2); border-radius: 4px; padding: 0 5px; font-size: 0.78rem; }

  /* boss */
  .arena { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 12px; align-items: stretch; }
  .thinker { border-radius: 18px; padding: 14px; text-align: center; color: #fff; cursor: pointer; border: 3px solid transparent; transition: transform .2s; }
  .thinker:hover { transform: translateY(-2px); }
  .thinker.drop { border-color: var(--gold); }
  .thinker.hit { animation: hit .5s; }
  @keyframes hit { 30% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(74,222,128,0.6); } }
  .thinker .face { font-size: 3rem; }
  .thinker b { display: block; font-size: 1.1rem; }
  .thinker small { display: block; opacity: 0.85; font-size: 0.78rem; line-height: 1.35; margin-top: 4px; }
  .th-m { background: linear-gradient(160deg, #7f1d1d, #b91c1c); } .th-b { background: linear-gradient(160deg, #14532d, #15803d); }
  .centre { display: flex; flex-direction: column; gap: 10px; align-items: stretch; justify-content: center; }
  .hp { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 800; }
  .hpbar { height: 12px; border-radius: 99px; background: #e2e8f0; overflow: hidden; }
  .hpbar div { height: 100%; background: linear-gradient(90deg, #ef4444, #f97316); transition: width .4s; }
  .stmt { background: #fff; border: 3px solid var(--navy); border-radius: 16px; padding: 16px; font-weight: 850; font-size: 1.05rem; text-align: center; min-height: 100px; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; user-select: none; line-height: 1.35; }
  .stmt.dragging { position: fixed; z-index: 1000; box-shadow: 0 16px 32px rgba(0,0,0,0.3); cursor: grabbing; }
  .throws { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .throws button { padding: 10px; border-radius: 12px; border: none; color: #fff; font-weight: 900; cursor: pointer; font-size: 0.86rem; }
  .throws .tm { background: #b91c1c; } .throws .tb { background: #15803d; }
  .hearts { font-size: 1.2rem; letter-spacing: 3px; }

  /* energy */
  .country { border-radius: 16px; padding: 14px; background: linear-gradient(135deg, #0f3a5c, #134e4a); color: #fff; margin-bottom: 12px; }
  .country b { font-size: 1.1rem; } .country p { font-size: 0.9rem; opacity: 0.9; line-height: 1.5; margin-top: 4px; }
  .egrid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .srcs { display: grid; gap: 6px; }
  .src { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: #fff; border: 1px solid var(--line); }
  .src .ic { font-size: 1.4rem; text-align: center; }
  .src .nm { font-weight: 800; font-size: 0.9rem; }
  .src .nm small { display: block; font-weight: 500; font-size: 0.72rem; color: var(--muted); }
  .src .sb { height: 8px; border-radius: 99px; background: #e2e8f0; overflow: hidden; margin-top: 4px; }
  .src .sb div { height: 100%; transition: width .3s; }
  .src .ctl { display: flex; align-items: center; gap: 6px; }
  .src .ctl button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: #f8fafc; font-weight: 900; font-size: 1.1rem; cursor: pointer; }
  .src .ctl button:disabled { opacity: 0.35; cursor: not-allowed; }
  .src .ctl span { min-width: 40px; text-align: center; font-weight: 900; }
  .src.off { opacity: 0.55; }
  .meters { display: grid; gap: 8px; }
  .meter { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
  .meter .k { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 800; }
  .meter .b { height: 10px; border-radius: 99px; background: #e2e8f0; overflow: hidden; margin-top: 5px; }
  .meter .b div { height: 100%; transition: width .4s; border-radius: 99px; }
  .bigscore { text-align: center; padding: 14px; border-radius: 16px; background: linear-gradient(135deg, #fef3c7, #fde68a); border: 2px solid var(--gold); }
  .bigscore .v { font-size: 2.4rem; font-weight: 900; color: #78350f; }
  .bigscore small { display: block; font-weight: 700; color: #92400e; }
  .total { font-weight: 900; text-align: center; padding: 8px; border-radius: 10px; }
  .total.ok { background: var(--green-soft); color: var(--green); } .total.no { background: var(--amber-soft); color: #92400e; }
  .warns { font-size: 0.82rem; line-height: 1.5; color: #92400e; }

  /* carbon */
  .crow { margin-bottom: 10px; }
  .crow h4 { font-size: 0.9rem; font-weight: 900; margin-bottom: 6px; }
  .copts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .copt { text-align: left; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-size: 0.86rem; font-weight: 750; color: var(--ink); }
  .copt small { display: block; font-weight: 900; color: var(--muted); margin-top: 3px; }
  .copt.sel { border-color: var(--navy); background: #e8f0f7; }
  .copt.sel small { color: var(--navy); }

  /* ================= GENERIC: LABEL THE DIAGRAM ================= */

    1: [
      { type: 'best', marks: 1, cmd: 'Identify', src: 'Adapted Edexcel question', q: 'Which of these is the best definition of backwash?', o: [

    2: [
      { type: 'best', marks: 1, cmd: 'Identify', src: 'Adapted Edexcel question', q: 'Which of these is the best definition of hydraulic action?', o: [
          'waves hit the cliffs forcing pockets of air into cracks', 'where waves pick up stones and they hit the cliffs', 'waves carry material along the coast', 'where rocks are dissolved by sea water'], c: 0,
        ms: '<b>Waves hit the cliffs forcing pockets of air into cracks.</b> Stones thrown at cliffs is abrasion; carrying material is transportation; dissolving rocks is solution.' },
      { type: 'best', marks: 1, cmd: 'Identify', src: 'Adapted Edexcel question', q: 'Which of these is a process of coastal erosion?', o: ['abrasion', 'beach', 'fetch', 'swash'], c: 0,
        ms: '<b>Abrasion.</b> A beach is a landform; fetch and swash are features of waves.' },
      { type: 'best', marks: 3, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain how longshore drift moves sediment along a coastline.', o: [
          'The prevailing wind makes waves approach the beach at an angle, so the swash carries sediment up the beach at that angle. The backwash then pulls it straight back down under gravity, so the sediment moves along the coast in a zig-zag.',
          'Longshore drift is when waves erode the cliffs by hydraulic action, forcing air into cracks, which makes the cliff collapse and the material stays at the bottom of the cliff where it fell, forming a beach that does not move along the coast at all.',
          'Longshore drift moves sand along the beach.',
          'Waves move sediment up and down the beach.'], c: 0,
        ms: '1 mark for the initial point and 2 for development: waves arrive <b>at an angle</b> due to the prevailing wind (1); <b>swash</b> carries sediment up the beach at that angle (1); <b>backwash</b> drags it straight back down, so sediment moves along the coast (1).' }],
    3: [
      { type: 'best', marks: 1, cmd: 'Identify', src: 'Adapted Edexcel question', q: 'Which is the best definition of mechanical weathering?', o: [
          'Where rocks are broken down by physical factors in the environment.', 'Where rocks are eroded by activities of plants and animals.', 'Where rocks are protected from physical processes on a coastline.', 'Where the chemical composition of the rocks is changed.'], c: 0,
        ms: '<b>Rocks broken down by physical factors in the environment.</b> Plants and animals is biological weathering; a change in chemical composition is chemical weathering.' },
      { type: 'best', marks: 2, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain one type of mass movement that happens on coasts.', o: [
          'Slumping: soft rock such as clay becomes saturated after heavy rain, so it becomes heavy and slides down a curved slip plane under gravity.',
          'Slumping is when the sea dissolves the cliff by solution, so the cliff gets smaller every year and the dissolved rock is carried away in the sea.',
          'Rockfall happens on cliffs.',
          'Mass movement is when rocks move.'], c: 0,
        ms: '1 mark for identifying a type (e.g. <b>slumping</b>, rockfall, landslide) and 1 for explaining it (e.g. <b>saturated clay moves down a curved slip plane under gravity</b>).' },
      { type: 'best', marks: 2, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain one type of mechanical weathering that takes place at the coast.', o: [
          'Freeze–thaw: water in cracks freezes and expands, putting pressure on the rock. Repeated freezing and thawing makes pieces of rock break off.',
          'Freeze–thaw is when acid rain freezes on the cliff and reacts with the minerals, changing the chemical make-up of the rock until it dissolves away.',
          'Freeze–thaw weathering.',
          'Rocks break up because of the weather.'], c: 0,
        ms: '1 mark for a type of physical weathering (e.g. <b>freeze–thaw</b>, salt weathering, onion-skin) and 1 for explanation (e.g. <b>water freezes and expands, causing rock to break off</b>).' }],
    4: [
      { type: 'best', marks: 3, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain one factor that influences the rate of coastal erosion.', o: [
          'Geology: rocks differ in hardness, so soft rocks such as clay erode much faster than hard rocks such as granite. This is why soft rock coasts like Holderness retreat quickly.',
          'Geology: all rocks are exactly the same hardness, so they all erode at the same rate, which means the type of rock has no effect at all on the rate of coastal erosion anywhere.',
          'Geology affects erosion.',
          'The type of rock and the waves.'], c: 0,
        ms: '1 mark for the factor (e.g. <b>geology</b>, wave energy, fetch, beach width) and 2 for development (e.g. <b>soft rock erodes faster</b> (1) → <b>so the coast retreats more quickly</b> or forms bays (1)).' },
      { type: 'best', marks: 4, cmd: 'Suggest', src: 'Adapted Edexcel question', q: 'Suggest two ways geology can influence the shape of a coastline.', o: [
          'Hard and soft rocks erode at different rates, so soft rock is worn back into bays while hard rock forms headlands. Rocks with lots of joints and faults are eroded more quickly, so caves, arches and stacks form along these weaknesses.',
          'Geology influences the coastline because hard rocks erode faster than soft rocks, so the hard rock is worn back into bays while the soft rock forms headlands. Also, rocks with lots of joints and faults are stronger, so they are never eroded into caves, arches or stacks.',
          'Hard rocks make headlands. Soft rocks make bays.',
          'Geology changes the shape of the coastline.'], c: 0,
        ms: '1 mark for each way geology affects the coast and 1 for development, ×2: <b>differential erosion</b> → headlands and bays; <b>joints and faults</b> → caves, arches and stacks.' }],
    5: [
      { type: 'best', marks: 4, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain how a headland is formed.', o: [
          'Headlands form on discordant coasts, where bands of hard and soft rock meet the coast at right angles. The soft rock is eroded more quickly by hydraulic action and abrasion to form bays, while the more resistant hard rock is left sticking out into the sea as a headland.',
          'Headlands form on concordant coasts where the rock bands are parallel to the sea. Hard rock erodes faster than soft rock, so the hard rock is worn back to form a bay and the soft rock is left sticking out into the sea as a headland, protected by the sheltered bays on either side of it.',
          'A headland is formed by erosion of hard and soft rock.',
          'A headland is land that sticks out into the sea.'], c: 0,
        ms: '1 mark for the initial point and 3 for development: <b>discordant coastline</b> (1); <b>bands of hard and soft rock at right angles</b> (1); soft rock <b>eroded faster</b> to form bays (1); <b>hard rock is resistant</b> and left as a headland (1).' },
      { type: 'multi', marks: 2, cmd: 'Identify', q: 'Identify two features of a concordant coastline.', need: 2, items: [
          { t: 'Bands of rock run parallel to the coastline', ok: true },
          { t: 'Coves form when the outer band of hard rock is breached', ok: true },
          { t: 'Bands of hard and soft rock meet the coast at right angles', ok: false },
          { t: 'A long series of alternating headlands and bays', ok: false }],
        ms: 'Concordant: rock bands <b>parallel</b> to the coast; <b>coves</b> such as Lulworth Cove form when the hard outer rock is breached. Headlands and bays are features of discordant coasts.' }],
    6: [
      { type: 'best', marks: 4, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain how a coastal arch forms.', o: [
          'Arches form on headlands. Waves erode lines of weakness such as joints by hydraulic action and abrasion, forming a cave. Caves on either side of the headland are eroded further until they meet, or one cave cuts right through, forming an arch.',
          'Arches form in bays where constructive waves deposit sand in a curved shape. Over time the sand is cemented together into rock, and the arch grows taller and wider each year as more sand and shingle are added on top by the swash of the waves.',
          'An arch is formed when a cave is eroded.',
          'Arches are made by the sea.'], c: 0,
        ms: '1 mark for the initial point and 3 for development: arches form at <b>headlands</b> (1); waves erode <b>weaknesses/joints</b> (1) forming a <b>cave</b> (1); erosion continues until the cave <b>breaks through</b> the headland (1).' },
      { type: 'best', marks: 4, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain how a cave forms.', o: [
          'Caves form in headlands. Waves attack a line of weakness such as a joint or fault. Hydraulic action forces air into the crack and abrasion wears it away, so the crack widens and deepens over time into a cave.',
          'Caves form when longshore drift deposits sand and shingle in a curved ridge across a bay, which traps water behind it. The water is then slowly dissolved to leave a large hollow space under the beach, which becomes a cave.',
          'A cave is formed by erosion of a cliff.',
          'Waves make a hole in the rock.'], c: 0,
        ms: '1 mark for the initial point and 3 for development: forms along a <b>headland</b> (1); waves attack <b>joints/faults</b> (1); <b>hydraulic action/abrasion</b> widen the crack (1); it grows into a <b>cave</b> (1).' },
      { type: 'best', marks: 4, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain how a cliff forms.', o: [
          'Destructive waves erode the base of the rock between high and low tide by hydraulic action and abrasion, forming a wave-cut notch. The rock above overhangs and eventually collapses, so the cliff retreats and becomes steep.',
          'Cliffs form when constructive waves deposit sand at the bottom of a slope. The sand builds up higher and higher over many years until it is cemented together and forms a tall, steep wall of rock at the back of the beach, which then retreats seawards.',
          'Cliffs are formed by erosion from the sea.',
          'A cliff is a steep rock face at the coast.'], c: 0,
        ms: '1 mark for the initial point and 3 for development: <b>destructive waves</b> erode the base (1); a <b>wave-cut notch</b> forms (1); the <b>overhang collapses</b> (1); the cliff <b>retreats</b>, leaving a steep face (1).' }],
    7: [
      { type: 'best', marks: 4, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain two physical factors that influence coastal deposition.', o: [
          'Sediment supply: coasts with lots of sediment from rivers and eroding cliffs have more material to build beaches. Wave type: constructive waves have a strong swash and weak backwash, so they push sediment up the beach and leave it there.',
          'Sediment supply: coasts with very little sediment build the biggest beaches. Wave type: destructive waves have a strong backwash and a weak swash, so they push sediment up the beach and leave it there, building wide, gently sloping beaches in the bays.',
          'The amount of sand and the type of wave.',
          'Waves and the wind affect deposition.'], c: 0,
        ms: '1 mark for each factor and 1 for explanation, ×2: e.g. <b>sediment supply</b> → more material to deposit; <b>constructive waves</b> → strong swash builds beaches; <b>sheltered / shallow water</b> → waves lose energy.' },
      { type: 'best', marks: 1, cmd: 'Identify', src: 'Adapted Edexcel question', q: 'Which coastal landform is formed by deposition?', o: ['spit', 'cave', 'cliff', 'wave-cut platform'], c: 0,

        ms: '<b>Spit.</b> Headlands, caves and stacks are all erosional landforms.' }],
    8: [
      { type: 'best', marks: 1, cmd: 'Identify', src: 'Adapted Edexcel question', q: 'Which of these is an abiotic characteristic of a coastal ecosystem?', o: ['temperature', 'coral', 'fungi', 'phytoplankton'], c: 0,

      { type: 'best', marks: 1, cmd: 'Identify', src: 'Adapted Edexcel question', q: 'Which of these is a feature of a mangrove ecosystem?', o: ['complex root system', 'high altitude', 'steep land gradient', 'cold temperatures'], c: 0,
        ms: '<b>Complex root system.</b> Mangroves grow on low, gently sloping coasts in warm water.' },
      { type: 'best', marks: 3, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain one physical factor that affects where mangrove ecosystems are found.', o: [
          'Temperature: mangroves need warm water, so they are found on tropical and subtropical coasts between about 30°N and 30°S. They cannot survive where the sea is cold or freezes.',

    9: [
      { type: 'best', marks: 1, cmd: 'Identify', src: 'Adapted Edexcel question', q: 'Which is the best definition of a coral reef ecosystem?', o: [

        ms: '<b>Polyps living together in water of 23–27°C.</b> Sandy deposits describes sand dunes; shrubs and trees describes mangroves; salt and fresh water describes a salt marsh.' },
      { type: 'best', marks: 2, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain one factor that influences the distribution of coral reefs.', o: [

      { type: 'best', marks: 3, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain one physical factor that affects where coral reefs are found.', o: [
          'Temperature: coral needs a minimum water temperature of about 18°C, so reefs are found in tropical seas between about 30°N and 30°S. Where cold currents flow, such as off west coasts, the water is too cold for reefs.',

    10: [
      { type: 'best', marks: 2, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain one way in which human activity can threaten coastal ecosystems.', o: [
          'Mangroves are cleared for shrimp farms, which destroys the habitat of fish and birds and removes the natural protection from storms.',

        ms: '1 mark for a human activity (e.g. <b>pollution</b>, <b>deforestation of mangroves</b>, tourism) and 1 for how it threatens the ecosystem (e.g. <b>destroys habitat</b>, kills coral).' },
      { type: 'best', marks: 3, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain one way in which industry can threaten coastal ecosystems.', o: [
          'Factories dump industrial waste into the sea, causing water pollution. Toxic chemicals kill fish and coral, and they build up in food chains, reducing biodiversity.',
          'Industry threatens coastal ecosystems because factories are always built inland, so they take workers away from the coast and nobody is left to look after the beaches.',
          'Industry causes pollution.',
          'Factories are bad for the environment.'], c: 0,
        ms: '1 mark for identifying the threat and 2 for development: e.g. <b>dumping industrial waste</b> (1) → <b>water pollution</b> (1) → <b>kills species / reduces biodiversity</b> (1).' }],
    11: [
      { type: 'best', marks: 3, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain why one conflict could develop between different users of a coastline.', o: [
          'Tourists and conservationists may disagree, because tourists using jet skis and boats make a lot of noise, which disturbs birds and can disrupt their breeding grounds.',
          'Tourists and conservationists never disagree, because tourists always stay in hotels far away from the coast and never visit the beaches or the sea, so birds are not disturbed.',
          'Tourists and fishers want the beach.',
          'People argue about the coast.'], c: 0,
        ms: '1 mark for identifying a conflict and 2 for development: e.g. <b>tourists vs bird watchers</b> (1) → <b>noise</b> (1) → <b>disturbs breeding grounds</b> (1).' },
      { type: 'best', marks: 4, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain two reasons why coastal management strategies can cause conflict.', o: [
          'Some stretches of coast are left unprotected, so people living there face faster erosion and the value of their homes falls. Groynes in one place trap sediment, so beaches further down the coast are starved and erode more quickly.',
          'All stretches of coast are always protected equally, so nobody loses out. Groynes add extra sediment to beaches further down the coast, so everyone benefits from wider beaches, house prices rise everywhere and nobody along the coast complains about the plans.',
          'Some people are not protected. It costs a lot.',
          'People disagree about what to do.'], c: 0,
        ms: '1 mark for each reason and 1 for development, ×2: e.g. <b>unprotected areas</b> → faster erosion / lost property; defences <b>move the problem downdrift</b>; <b>high cost</b> to taxpayers.' }],
    12: [
      { type: 'best', marks: 2, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain one way of reducing the impact of coastal flooding.', o: [
          'Build houses on raised stilts, so that they are above the level that floods usually reach and water can pass underneath.',
          'Build houses closer to the sea, so that the floodwater reaches them more quickly and drains away again before it causes any damage.',
          'Build sea walls.',
          'Move people away.'], c: 0,
        ms: '1 mark for a way (e.g. <b>building design</b>, <b>planning</b>, forecasting, defences) and 1 for explanation (e.g. <b>raised above flood level</b>).' },
      { type: 'best', marks: 3, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain one way in which climate change may affect coastal environments.', o: [
          'Climate change melts ice sheets and makes sea water expand, so sea levels rise. Low-lying coastal settlements and ecosystems may then flood more often or have to be abandoned.',
          'Climate change makes sea levels fall, because warmer water takes up less space than cold water. This means that coastal settlements will be further from the sea and safer from flooding.',
          'Sea levels will rise.',
          'Climate change makes coasts warmer.'], c: 0,
        ms: '1 mark for the initial point and 2 for development: e.g. <b>melting ice caps</b> (1) → <b>sea level rises</b> (1) → <b>settlements flooded or abandoned</b> (1).' },
      { type: 'best', marks: 4, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain how prevention strategies can reduce the impact of coastal flooding.', o: [
          'Forecasting and warning systems track storms with satellites, so people can be evacuated before a surge arrives, saving lives. Planning bans new building on low-lying land, so fewer homes are at risk and damage costs are lower.',
          'Forecasting and warning systems stop storms from forming, so surges never arrive. Planning moves all new buildings onto low-lying land near the sea, so that people are closer to the shelters and can reach them quickly when a flood warning is given.',
          'Warnings and planning reduce flooding.',
          'They stop the floods happening.'], c: 0,
        ms: '1 mark for the initial point and 3 for development; credit 1+1+1+1 or two developed strategies: e.g. <b>forecasting</b> → <b>evacuation</b> → lives saved; <b>land-use planning</b> → fewer homes at risk.' }],
    13: [
      { type: 'best', marks: 4, cmd: 'Explain', src: 'Adapted Edexcel question', q: 'Explain one advantage and one disadvantage of soft engineering strategies.', o: [
          'Advantage: managed retreat is cheaper than building defences, because no structures need to be built or maintained. Disadvantage: farmland is flooded and lost, so landowners may need compensation and may object.',
          'Advantage: soft engineering uses huge concrete walls that last for ever. Disadvantage: beach nourishment adds too much sand, which makes the beach so wide that waves cannot reach it any more, so it never needs to be repeated.',
          'It is cheap but it does not last.',
          'It looks natural. It can be expensive.'], c: 0,
        ms: '1 mark for the advantage and 1 for development, and the same for the disadvantage: e.g. <b>cheaper</b> / looks natural / creates habitats; <b>land is lost</b> / needs repeating (beach nourishment).' },
      { type: 'best', marks: 1, cmd: 'Identify', src: 'Adapted Edexcel question', q: 'Which of these is a soft engineering technique used on coastlines?', o: ['beach replenishment', 'rock armour', 'groynes', 'sea wall'], c: 0,
        ms: '<b>Beach replenishment.</b> Rock armour, groynes and sea walls are all hard engineering.' }],
    14: [
      { type: 'best', marks: 3, cmd: 'Explain', q: 'Explain one way in which Sri Lanka’s Coastal Zone Management Plan (CZMP) has reduced coastal erosion.', o: [
          'The CZMP banned coral mining, so reefs that absorb wave energy are protected. This means less wave energy reaches the beaches, so erosion is reduced.',
          'The CZMP encouraged more coral mining, so there is more lime for building sea walls. The extra concrete walls absorb wave energy everywhere on the coast.',
          'The CZMP protects the coast.',
          'It stopped coral mining.'], c: 0,
        ms: '1 mark for a strategy (e.g. <b>coral mining ban</b>, setback areas, mangrove replanting, revetments) and 2 for development (e.g. reefs <b>absorb wave energy</b> (1) → <b>less erosion</b> of beaches (1)).' },
      { type: 'multi', marks: 2, cmd: 'Identify', q: 'Identify two strategies used in Sri Lanka’s coastal management.', need: 2, items: [
          { t: 'Setback areas where new building is not allowed', ok: true },
          { t: 'Special Area Management (SAM) plans with local communities', ok: true },
          { t: 'Building the Thames Barrier across the river at Colombo', ok: false },
          { t: 'Encouraging hotels to build right up to the high water line', ok: false }],
        ms: 'Sri Lanka uses <b>setback areas</b>, <b>Special Area Management</b>, a coral mining ban, mangrove replanting and hard engineering such as revetments and groynes.' }],
    15: [
      { type: 'best', marks: 3, cmd: 'Explain', q: 'Explain why the Holderness coastline is eroding rapidly.', o: [
          'The cliffs are made of soft boulder clay, which is easily eroded and slumps when saturated. Powerful waves arrive from the north-east across a long fetch, and narrow beaches give little protection, so the coast retreats about 1.8 m a year.',
          'The cliffs are made of very hard granite, which is resistant to erosion. Waves are weak because the fetch is very short, and wide beaches protect the cliffs, so the coast retreats very slowly, by only a few millimetres each year on average.',
          'The cliffs are soft and the waves are strong.',
          'Holderness is eroding because of the sea.'], c: 0,
        ms: '1 mark for a reason (e.g. <b>soft boulder clay</b>, <b>long fetch</b>, narrow beaches) and 2 for development (e.g. clay <b>slumps when saturated</b> (1) → retreats about <b>1.8 m a year</b> (1)).' },
      { type: 'num', marks: 2, cmd: 'Calculate', q: 'A cliff-top road is 63 m from the edge of a Holderness cliff that is retreating at 1.8 m a year. How many years until the road is reached?', ans: 35, tol: 0, unit: 'years',
        ms: '63 ÷ 1.8 = <b>35 years</b>.' }]
  };
  function gatePassed(n) { return !!(S.gate && S.gate[n]); }
  function needsGate(n) { return !S.unlockAll && n > 1 && !isDone(n) && isDone(n - 1) && !gatePassed(n - 1) && !!GATES[n - 1]; }

  function startGate(n) {
    run = null; closeModal();
    S.gate = S.gate || {}; S.gv = S.gv || {};
    var pool = GATES[n], vi = (S.gv[n] || 0) % pool.length, G = pool[vi], tries = 0;
    $('app').innerHTML = '<div class="lvhead"><span class="emo" aria-hidden="true">🔐</span><div><div class="tag">Checkpoint · after Level ' + n + ' · unlocks Level ' + (n + 1) + '</div><h2>Past paper question</h2></div><span class="spacer"></span><button type="button" class="btn ghost" data-map="1">🗺️ Level map</button></div>' +
      '<div class="panel gate"><p class="how">Answer this exam-style question <b>correctly</b> to unlock the next level. If you get it wrong, read the mark scheme and try another question.</p><div id="gq"></div></div>';
    window.scrollTo(0, 0);
    function render() {
      var h = '<div class="exq"><div class="mk">' + (G.src ? esc(G.src) + ' · ' : 'Exam-style question · ') + 'Command term: <b>' + G.cmd + '</b> · [' + G.marks + ' mark' + (G.marks > 1 ? 's' : '') + ']</div><h3>' + esc(G.q) + '</h3></div>';
      if (G.type === 'best') h += '<p class="gate-ins">' + (G.marks === 1 ? 'Choose the <b>correct</b> answer.' : 'Which answer would score <b>full marks</b>?') + '</p><div class="choices one">' + shuffle(G.o.map(function (_, j) { return j; })).map(function (j) { return '<button type="button" class="choice" data-j="' + j + '"' + (DEBUG && j === G.c ? ' data-ok="1"' : '') + '>' + esc(G.o[j]) + '</button>'; }).join('') + '</div>';
      if (G.type === 'multi') h += '<p class="gate-ins">Select the <b>' + G.need + '</b> statements that would earn marks.</p><div class="choices one">' + shuffle(G.items.map(function (_, j) { return j; })).map(function (j) { return '<button type="button" class="choice tick" data-j="' + j + '" aria-pressed="false"' + (DEBUG && G.items[j].ok ? ' data-ok="1"' : '') + '>' + esc(G.items[j].t) + '</button>'; }).join('') + '</div>';
      if (G.type === 'num') h += '<div class="dg-num"><input type="text" inputmode="decimal" id="gNum" aria-label="Your answer" autocomplete="off"' + (DEBUG ? ' data-a="' + G.ans + '"' : '') + '><span class="dg-unit">' + (G.unit || '') + '</span></div>';
      h += '<div class="actions"><button type="button" class="btn gold" id="gSub">Submit answer</button></div><div id="gRes" aria-live="polite"></div>';
      $('gq').innerHTML = h;
      var box = $('gq'), pickB = null;
      box.querySelectorAll('.choice').forEach(function (b) { b.addEventListener('click', function () {
        if (b.disabled) return;
        if (G.type === 'best') { box.querySelectorAll('.choice').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); pickB = +b.dataset.j; }
        else { var on = !b.classList.contains('sel'); b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }
      }); });
      if ($('gNum')) $('gNum').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('gSub').click(); });
      $('gSub').addEventListener('click', function () {
        var ok, R = $('gRes');
        if (G.type === 'best') { if (pickB == null) { R.innerHTML = '<div class="msg info">Choose an answer first.</div>'; return; } ok = pickB === G.c; }
        if (G.type === 'multi') {
          var chosen = Array.prototype.map.call(box.querySelectorAll('.choice.sel'), function (b) { return +b.dataset.j; });
          if (chosen.length !== G.need) { R.innerHTML = '<div class="msg info">Select exactly ' + G.need + ' statements.</div>'; return; }
          ok = chosen.every(function (j) { return G.items[j].ok; });
        }
        if (G.type === 'num') { var v = parseFloat(String($('gNum').value).replace(/[^0-9.\-]/g, '')); if (isNaN(v)) { R.innerHTML = '<div class="msg info">Type a number first.</div>'; return; } ok = Math.abs(v - G.ans) <= G.tol + 1e-9; $('gNum').disabled = true; }
        tries++;
        box.querySelectorAll('.choice').forEach(function (b) {
          b.disabled = true; var j = +b.dataset.j;
          var good = G.type === 'best' ? j === G.c : G.items[j].ok;
          if (good) b.classList.add('right'); else if (b.classList.contains('sel')) b.classList.add('wrong');
        });
        this.disabled = true;
        if (ok) {
          S.gate[n] = 1; var bonus = tries === 1 ? 30 : 15; S.xp += bonus; save(); paintHud(); xpPop(bonus, this); confetti(false);
          R.innerHTML = '<div class="fbk show good">✔ <b>Correct — checkpoint passed!</b> ' + G.ms + '</div><div class="actions"><button type="button" class="btn ghost" data-map="1">Level map</button><button type="button" class="btn primary" id="gNext">Level ' + (n + 1) + ' →</button></div>';
          $('gNext').addEventListener('click', function () { startLevel(n + 1); }); $('gNext').focus();
        } else {
          S.gv[n] = (S.gv[n] || 0) + 1; save();
          R.innerHTML = '<div class="fbk show bad">✖ <b>Not quite.</b> Mark scheme: ' + G.ms + '</div><div class="actions"><button type="button" class="btn primary" id="gAgain">Try another question →</button></div>';
          $('gAgain').addEventListener('click', function () { vi = (vi + 1) % pool.length; G = pool[vi]; render(); });
        }
      });
    }
    render();
  }

  var KEYSLOTS = [['C', 'Point'], ['E', 'Evidence / Example'], ['X', 'Explain / Develop'], ['J', 'Conclusion / Judgement']];
  /* ================= TEACHER ANSWER KEY ================= */
  function showKey() {
    run = null; closeModal();
    var R = { sortGame: sortGame, flash: flash, orderGame: orderGame, mcq: mcq, dataGame: dataGame, labelGame: labelGame, stages: stages }, curN = 0;
    function why(t) { return t ? ' <span class="kwhy">— ' + t + '</span>' : ''; }
    function opts(o, c) { return '<ul class="kopts">' + o.map(function (x, j) { return '<li class="' + (j === c ? 'kok' : 'kno') + '">' + (j === c ? '✅ ' : '') + esc(x) + '</li>'; }).join('') + '</ul>'; }
    stages = function (root, list) {
      if (typeof EXTRA !== 'undefined' && EXTRA[curN]) { var at = EXTRA_AT[curN] != null ? EXTRA_AT[curN] : list.length - 1; list = list.slice(0, at).concat(EXTRA[curN], list.slice(at)); }
      list.forEach(function (s, i) {
        var p = document.createElement('div'); p.className = 'kstage';
        p.innerHTML = '<h4>Part ' + (i + 1) + ': ' + s.title + '</h4>' + (s.how ? '<p class="how">' + s.how + '</p>' : '') + '<div class="sb"></div>';
        root.appendChild(p);
        try { s.build(p.querySelector('.sb'), function () {}); } catch (e) { p.querySelector('.sb').innerHTML = '<p class="kwhy">Interactive activity — play the level to see it.</p>'; }
      });
    };
    sortGame = function (root, cfg) {
      root.innerHTML = '<div class="kzones">' + cfg.zones.map(function (z) {
        var cs = cfg.cards.filter(function (c) { return (c.a || []).indexOf(z.id) > -1; });
        return '<div class="kzone"><b>' + z.label + '</b><ul>' + cs.map(function (c) { return '<li>' + esc(c.t) + (c.s ? ' <small>(' + esc(c.s) + ')</small>' : '') + why(c.why) + '</li>'; }).join('') + '</ul></div>';
      }).join('') + '</div>';
    };
    flash = function (el, cfg) {
      el.innerHTML = '<ul class="klist">' + cfg.items.map(function (x) { return '<li>' + esc(x.t) + ' → <b>' + (x.a ? cfg.yes : cfg.no) + '</b>' + why(x.why) + '</li>'; }).join('') + '</ul>';
    };
    orderGame = function (root, items) { root.innerHTML = '<p class="kwhy">Correct order:</p><ol class="klist">' + items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>'; };
    mcq = function (root, qs) {
      root.innerHTML = qs.map(function (q, i) { return '<div class="kq"><b>' + (i + 1) + '. ' + q.q + '</b>' + opts(q.o, q.c) + (q.f ? '<p class="kwhy">' + q.f + '</p>' : '') + '</div>'; }).join('');
    };
    dataGame = function (el, cfg) {
      el.innerHTML = '<figure class="dg-fig">' + cfg.chart + (cfg.cap ? '<figcaption>' + cfg.cap + '</figcaption>' : '') + '</figure>' + cfg.qs.map(function (q, i) {
        return '<div class="kq"><b>' + (i + 1) + '. ' + q.q + '</b>' + (q.type === 'num' ? '<p class="kok">✅ ' + q.ans + ' ' + (q.unit || '') + (q.tol ? ' (accept ±' + q.tol + ')' : '') + '</p>' : opts(q.o, q.c)) + (q.f ? '<p class="kwhy">' + q.f + '</p>' : '') + '</div>';
      }).join('');
    };
    labelGame = function (el, cfg) {
      var pins = cfg.pins.map(function (p) { return '<g class="ld-pin filled" transform="translate(' + p.x + ',' + p.y + ')"><circle r="15"/><text y="5" text-anchor="middle">' + p.n + '</text></g>'; }).join('');
      var ls = cfg.labels.filter(function (l) { return l.pin != null; }).sort(function (a, b) { return a.pin - b.pin; });
      var traps = cfg.labels.filter(function (l) { return l.pin == null; });
      el.innerHTML = '<div class="kld"><figure class="ld-fig">' + cfg.svg.replace('</svg>', pins + '</svg>') + (cfg.cap ? '<figcaption>' + cfg.cap + '</figcaption>' : '') + '</figure><div><ol class="klist">' +
        ls.map(function (l) { return '<li value="' + l.pin + '">' + esc(l.t) + '</li>'; }).join('') + '</ol>' + (traps.length ? '<p class="kwhy">Trap label' + (traps.length > 1 ? 's' : '') + ': ' + traps.map(function (l) { return esc(l.t); }).join('; ') + '</p>' : '') + '</div></div>';
    };
    function gateHtml(n) {
      var G = (typeof GATES !== 'undefined') && GATES[n]; if (!G || !G.length) return '';
      return '<div class="kgate"><h4>🔐 Checkpoint after Level ' + n + (G.length > 1 ? ' — one of these ' + G.length + ' is asked (they rotate)' : '') + '</h4>' + G.map(function (g, i) {
        var h = '<div class="kq"><div class="kmk">' + (g.src ? esc(g.src) + ' · ' : '') + (g.cmd ? g.cmd + ' · ' : '') + '[' + g.marks + ' mark' + (g.marks > 1 ? 's' : '') + ']</div><b>' + (G.length > 1 ? String.fromCharCode(65 + i) + '. ' : '') + esc(g.q) + '</b>';
        if (g.type === 'best') h += opts(g.o, g.c);
        if (g.type === 'multi') h += '<ul class="kopts">' + g.items.map(function (x) { return '<li class="' + (x.ok ? 'kok' : 'kno') + '">' + (x.ok ? '✅ ' : '') + esc(x.t) + '</li>'; }).join('') + '</ul>';
        if (g.type === 'num') h += '<p class="kok">✅ ' + g.ans + ' ' + (g.unit || '') + '</p>';
        return h + (g.ms ? '<p class="kms"><b>Mark scheme:</b> ' + g.ms + '</p>' : '') + '</div>';
      }).join('') + '</div>';
    }
    function bossHtml() {
      if (typeof EXQ === 'undefined') return '';
      return EXQ.map(function (Q, i) {
        return '<div class="kq"><div class="kmk">' + esc(Q.mk) + '</div><b>' + (i + 1) + '. ' + esc(Q.q) + '</b><ol class="klist">' +
          KEYSLOTS.map(function (s) { return '<li><b>' + s[1] + ':</b> ' + esc(Q[s[0]]) + '</li>'; }).join('') + '</ol><p class="kwhy">Traps: ' + Q.D.map(esc).join(' / ') + '</p></div>';
      }).join('');
    }
    $('app').innerHTML = '<div class="kbar"><button type="button" class="btn ghost" data-map="1">🗺️ Level map</button><button type="button" class="btn primary" id="kprint">🖨️ Print or save as PDF</button></div>' +
      '<div class="hero"><span class="kicker">Teacher answer key</span><h1>' + document.title.split(' — ')[0] + '</h1><p>Every activity with its answers, every past paper checkpoint (with mark schemes) and the final boss. Sort and order activities are shown in their correct groups and order; students see them shuffled.</p></div><div id="keyBody"></div>';
    var body = $('keyBody');
    try {
      LEVELS.forEach(function (L) {
        curN = L.n;
        var sec = document.createElement('section'); sec.className = 'klevel';
        sec.innerHTML = '<h2 style="border-left:6px solid ' + ZONES[L.z][2] + '">' + L.emo + ' Level ' + L.n + ' · ' + ZONES[L.z][1] + ': ' + esc(L.t) + '</h2>';
        body.appendChild(sec);
        if (L.z === 'X' && typeof EXQ !== 'undefined') { var b = document.createElement('div'); b.className = 'kstage'; b.innerHTML = '<h4>Final boss: build each answer from the cards</h4>' + bossHtml(); sec.appendChild(b); }
        else if (LV[L.n]) LV[L.n](sec);
        sec.insertAdjacentHTML('beforeend', gateHtml(L.n));
      });
    } finally {
      sortGame = R.sortGame; flash = R.flash; orderGame = R.orderGame; mcq = R.mcq; dataGame = R.dataGame; labelGame = R.labelGame; stages = R.stages;
    }
    $('kprint').addEventListener('click', function () { window.print(); });
    window.scrollTo(0, 0);
  }

  paintHud(); showMap();
})();
</script>
