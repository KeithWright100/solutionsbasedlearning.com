<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ruapehu Mission — Can a volcano be a fantastic place? — KS3 Geography Games — SBL</title>
<meta name="description" content="Year 7 geography enquiry game on Mount Ruapehu, New Zealand. Use the 4 Ps (Place, Processes, Power, Possibilities) to decide whether a volcano can be a fantastic place, label a subduction diagram and copy your answers into OneNote.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f3a5c; --teal: #00b8b0; --teal-dark: #007c82; --cyan: #20d7e2;
    --ink: #062033; --muted: #4a6272; --line: rgba(5,43,65,0.13);
    --green: #16a34a; --green-soft: #e7f7ed; --red: #dc2626; --red-soft: #fdecec; --amber: #d97706;
    --place: #0284c7; --place-bg: #e0f2fe;
    --proc: #ea580c; --proc-bg: #ffedd5;
    --power: #7c3aed; --power-bg: #ede9fe;
    --poss: #16a34a; --poss-bg: #dcfce7;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Inter", "Segoe UI", Arial, sans-serif; color: var(--ink); min-height: 100vh;
    background: radial-gradient(circle at top right, rgba(234,88,12,0.10), transparent 35%), linear-gradient(180deg, #f7fbfc 0%, #edf4f6 100%); }
  a { color: inherit; text-decoration: none; }
  button, textarea, input { font-family: inherit; }

  .top-bar { padding: 18px 22px; color: #fff; background: linear-gradient(135deg, rgba(1,21,38,0.98), rgba(2,50,78,0.96)); }
  .top-bar-inner { max-width: 1150px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; font-weight: 700; color: rgba(255,255,255,0.85); }
  .back-link:hover { color: var(--cyan); }
  .back-link svg { width: 16px; height: 16px; }
  .brand { font-weight: 900; font-size: 1.1rem; }
  .brand .teal { color: var(--teal); }

  main { max-width: 1150px; margin: 22px auto 60px; padding: 0 18px; }
  .intro { text-align: center; margin-bottom: 12px; }
  .kicker { display: inline-block; font-size: 0.74rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, #ea580c, #c2410c); padding: 5px 12px; border-radius: 999px; margin-bottom: 10px; }
  h1 { font-size: clamp(1.5rem, 3.4vw, 2.3rem); font-weight: 900; color: var(--navy); }
  .intro p { color: var(--muted); max-width: 760px; margin: 8px auto 0; line-height: 1.55; font-weight: 500; }

  /* station nav */
  .stations { display: flex; gap: 6px; overflow-x: auto; padding: 6px 2px 10px; margin: 10px 0 8px; scrollbar-width: thin; }
  .st { flex: 0 0 auto; border: 1px solid var(--line); background: rgba(255,255,255,0.85); color: var(--muted); border-radius: 999px; padding: 7px 12px; font-size: 0.8rem; font-weight: 750; cursor: pointer; white-space: nowrap; }
  .st.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .st.done { border-color: rgba(22,163,74,0.4); color: var(--green); background: var(--green-soft); }
  .st.done.on { background: var(--navy); color: #fff; }
  .progress { height: 8px; background: #dde7eb; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .progress div { height: 100%; background: linear-gradient(90deg, var(--teal), #ea580c); width: 0; transition: width .4s ease; }

  .screen { display: none; }
  .screen.on { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .panel { background: rgba(255,255,255,0.96); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: 0 14px 34px rgba(0,25,45,0.07); margin-bottom: 14px; }
  .panel h2 { font-size: 1.2rem; font-weight: 900; color: var(--navy); margin-bottom: 6px; }
  .panel h3 { font-size: 1rem; font-weight: 850; color: var(--navy); margin: 4px 0 8px; }
  .how { font-size: 0.93rem; color: var(--muted); line-height: 1.55; margin-bottom: 12px; }
  .how b { color: var(--ink); }
  .act-tag { display: inline-block; font-size: 0.7rem; font-weight: 850; letter-spacing: 0.06em; text-transform: uppercase; color: #c2410c; background: #fff1e6; border-radius: 999px; padding: 3px 9px; margin-bottom: 6px; }

  .btn { border: none; border-radius: 12px; padding: 11px 18px; font-weight: 800; font-size: 0.93rem; cursor: pointer; transition: transform .2s ease; }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn.primary { color: #fff; background: linear-gradient(135deg, #00b8b0, #0392a2); box-shadow: 0 8px 20px rgba(0,184,176,0.28); }
  .btn.orange { color: #fff; background: linear-gradient(135deg, #ea580c, #c2410c); box-shadow: 0 8px 20px rgba(234,88,12,0.28); }
  .btn.ghost { background: #fff; color: var(--navy); border: 1px solid rgba(5,43,65,0.2); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .nav-row { display: flex; justify-content: space-between; gap: 10px; margin: 6px 0 20px; flex-wrap: wrap; }
  .msg { font-weight: 750; font-size: 0.9rem; text-align: center; min-height: 1.3em; margin-top: 10px; }
  .msg.ok { color: var(--green); } .msg.no { color: var(--red); } .msg.info { color: var(--amber); }

  /* photos */
  .photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 8px 0 12px; }
  .photo { margin: 0; background: #0b2239; border-radius: 14px; overflow: hidden; position: relative; }
  .photo img { display: block; width: 100%; height: 170px; object-fit: cover; }
  .photo.big img { height: 300px; }
  .photo figcaption { font-size: 0.76rem; color: #e2e8f0; padding: 7px 10px; line-height: 1.35; }
  .photo figcaption a { color: #7dd3fc; font-size: 0.66rem; display: block; margin-top: 2px; }
  .photo .ph { display: none; height: 170px; align-items: center; justify-content: center; font-size: 3rem; background: linear-gradient(135deg, #1e3a5f, #7c2d12); }
  .photo.missing img { display: none; } .photo.missing .ph { display: flex; }

  /* write box (OneNote) */
  .wb { margin: 12px 0; padding: 12px; border-radius: 14px; background: #f8fbfd; border: 1px solid var(--line); }
  .wb label { display: block; font-weight: 800; font-size: 0.92rem; margin-bottom: 6px; line-height: 1.4; }
  .wb .frame { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
  .wb textarea { width: 100%; min-height: 84px; padding: 10px; border-radius: 10px; border: 1px solid rgba(5,43,65,0.22); font-size: 0.93rem; line-height: 1.5; resize: vertical; background: #fff; }
  .wb textarea:focus { outline: 2px solid var(--teal); border-color: transparent; }
  .wb .wb-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .wb .count { font-size: 0.74rem; color: var(--muted); }
  .copy { border: 1px solid rgba(0,124,130,0.35); background: #fff; color: var(--teal-dark); border-radius: 9px; padding: 6px 11px; font-size: 0.8rem; font-weight: 800; cursor: pointer; }
  .copy.copied { background: var(--green-soft); color: var(--green); border-color: rgba(22,163,74,0.4); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .chip { border: 1px dashed rgba(234,88,12,0.5); background: #fff7ed; color: #9a3412; border-radius: 999px; padding: 4px 10px; font-size: 0.78rem; font-weight: 750; cursor: pointer; }
  .chip.used { border-style: solid; background: var(--green-soft); color: var(--green); border-color: rgba(22,163,74,0.4); }

  /* sort game */
  .sg-tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; min-height: 54px; padding: 10px; border-radius: 14px; background: #fff; border: 1px dashed var(--line); }
  .sg-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 0.86rem; padding: 6px; }
  .sg-card { background: #fff; border: 2px solid rgba(5,43,65,0.16); border-radius: 12px; padding: 9px 11px; cursor: grab; user-select: none; touch-action: none; font-size: 0.86rem; line-height: 1.4; font-weight: 650; box-shadow: 0 3px 8px rgba(0,25,45,0.06); }
  .sg-card.selected { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(0,184,176,0.25); }
  .sg-card.dragging { cursor: grabbing; box-shadow: 0 14px 28px rgba(0,0,0,0.22); }
  .sg-card.correct { border-color: var(--green); background: var(--green-soft); }
  .sg-card.incorrect { border-color: var(--red); background: var(--red-soft); }
  .sg-card .fb { display: none; margin-top: 4px; font-size: 0.75rem; font-weight: 700; color: #7f1d1d; }
  .sg-card.incorrect .fb { display: block; }
  .sg-card.correct .fb.alt { display: block; color: var(--teal-dark); }
  .sg-zones { display: grid; gap: 10px; margin-top: 12px; }
  .sg-zones.z2 { grid-template-columns: repeat(2, 1fr); }
  .sg-zones.z3 { grid-template-columns: repeat(3, 1fr); }
  .sg-zones.z4 { grid-template-columns: repeat(4, 1fr); }
  .sg-zone { border-radius: 16px; padding: 10px; min-height: 130px; border: 3px dashed #94a3b8; background: rgba(255,255,255,0.92); cursor: pointer; }
  .sg-zone.hover { background: #f0fbfa; }
  .sg-zone h4 { font-size: 0.95rem; font-weight: 900; margin-bottom: 4px; }
  .sg-zone .zsub { font-size: 0.74rem; color: var(--muted); margin-bottom: 6px; line-height: 1.35; }
  .sg-zone .zc { display: grid; gap: 6px; min-height: 40px; }
  .z-place { border-color: var(--place); } .z-place h4 { color: var(--place); }
  .z-proc { border-color: var(--proc); } .z-proc h4 { color: var(--proc); }
  .z-power { border-color: var(--power); } .z-power h4 { color: var(--power); }
  .z-poss { border-color: var(--poss); } .z-poss h4 { color: var(--poss); }
  .z-fan { border-color: var(--green); } .z-fan h4 { color: var(--green); }
  .z-dan { border-color: var(--red); } .z-dan h4 { color: var(--red); }
  .z-both { border-color: var(--amber); } .z-both h4 { color: var(--amber); }
  .z-plain h4 { color: var(--navy); }

  /* 4P cards */
  .ps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 12px; }
  .pcard { border-radius: 14px; padding: 10px 12px; font-size: 0.82rem; line-height: 1.45; border: 2px solid; }
  .pcard b { display: block; font-size: 0.95rem; }
  .pcard.place { background: var(--place-bg); border-color: var(--place); } .pcard.place b { color: var(--place); }
  .pcard.proc { background: var(--proc-bg); border-color: var(--proc); } .pcard.proc b { color: var(--proc); }
  .pcard.power { background: var(--power-bg); border-color: var(--power); } .pcard.power b { color: var(--power); }
  .pcard.poss { background: var(--poss-bg); border-color: var(--poss); } .pcard.poss b { color: var(--poss); }

  /* choice buttons */
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin: 8px 0; }
  .choice { text-align: left; padding: 11px 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-size: 0.9rem; font-weight: 700; color: var(--ink); line-height: 1.4; }
  .choice:hover:not(:disabled) { border-color: var(--teal); }
  .choice.picked { border-color: var(--navy); background: #e8f0f7; }
  .choice.right { border-color: var(--green); background: var(--green-soft); }
  .choice.wrong { border-color: var(--red); background: var(--red-soft); }
  .choice:disabled { cursor: default; }
  .choice small { display: block; font-weight: 500; color: var(--muted); margin-top: 3px; }
  .fbk { display: none; margin-top: 8px; padding: 10px 12px; border-radius: 12px; font-size: 0.9rem; line-height: 1.5; background: #f0fbfa; border-left: 5px solid var(--teal); }
  .fbk.show { display: block; }
  .fbk.bad { background: var(--red-soft); border-left-color: var(--red); }
  .fbk.good { background: var(--green-soft); border-left-color: var(--green); }

  /* true/false */
  .tf { display: grid; gap: 8px; }
  .tf-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: #fff; border: 2px solid var(--line); }
  .tf-row.right { border-color: var(--green); background: var(--green-soft); }
  .tf-row.wrong { border-color: var(--red); background: var(--red-soft); }
  .tf-row .s { font-weight: 650; font-size: 0.9rem; line-height: 1.4; }
  .tf-row .why { grid-column: 1 / -1; font-size: 0.8rem; color: var(--teal-dark); font-weight: 650; display: none; }
  .tf-row.right .why, .tf-row.wrong .why { display: block; }
  .tf-row .bt { display: flex; gap: 6px; }
  .tf-row .bt button { border: 2px solid var(--line); background: #f8fafc; border-radius: 9px; padding: 6px 11px; font-weight: 850; cursor: pointer; font-size: 0.82rem; }
  .tf-row .bt button:disabled { cursor: default; opacity: 0.7; }

  /* diagram */
  .diagram-wrap { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .diagram { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
  .diagram svg { display: block; width: 100%; height: auto; }
  .lbl-bank { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .lbl { border: 2px solid rgba(5,43,65,0.2); background: #fff; border-radius: 10px; padding: 6px 10px; font-size: 0.82rem; font-weight: 750; cursor: pointer; }
  .lbl.selected { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0,184,176,0.25); }
  .lbl.placed { opacity: 0.35; cursor: default; }
  .slots { display: grid; gap: 6px; }
  .slot { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; border: 2px dashed #cbd5e1; background: #fff; cursor: pointer; min-height: 40px; font-size: 0.84rem; font-weight: 700; }
  .slot .n { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 900; }
  .slot .v { color: var(--muted); font-weight: 600; }
  .slot.filled .v { color: var(--ink); font-weight: 750; }
  .slot.right { border-style: solid; border-color: var(--green); background: var(--green-soft); }
  .slot.wrong { border-style: solid; border-color: var(--red); background: var(--red-soft); }
  .slot.target { border-color: var(--teal); background: #f0fbfa; }

  /* chain */
  .chain-pool, .chain { display: grid; gap: 7px; }
  .chain { counter-reset: step; min-height: 60px; padding: 10px; border-radius: 14px; border: 2px dashed #fdba74; background: #fffaf5; margin-top: 10px; }
  .chain-item { padding: 9px 12px; border-radius: 11px; background: #fff; border: 2px solid rgba(5,43,65,0.16); cursor: pointer; font-size: 0.88rem; font-weight: 650; line-height: 1.4; text-align: left; color: var(--ink); }
  .chain .chain-item { border-color: #fb923c; position: relative; padding-left: 40px; }
  .chain .chain-item::before { counter-increment: step; content: counter(step); position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 50%; background: #ea580c; color: #fff; font-size: 0.76rem; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .chain .chain-item.right { border-color: var(--green); background: var(--green-soft); }
  .chain .chain-item.wrong { border-color: var(--red); background: var(--red-soft); }
  .chain-empty { color: var(--muted); font-size: 0.85rem; text-align: center; }
  .arrow-down { text-align: center; color: #ea580c; font-weight: 900; line-height: 0.6; }

  /* rank */
  .rank-list { display: grid; gap: 8px; }
  .rank-item { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #fff; border: 2px solid var(--line); }
  .rank-item .rn { width: 30px; height: 30px; border-radius: 50%; background: var(--poss); color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .rank-item .rt { font-weight: 700; font-size: 0.9rem; line-height: 1.4; }
  .rank-item .rt small { display: block; font-weight: 500; color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
  .rank-item .mv { display: flex; flex-direction: column; gap: 3px; }
  .rank-item .mv button { border: 1px solid var(--line); background: #f8fafc; border-radius: 6px; width: 30px; height: 24px; cursor: pointer; font-size: 0.8rem; }

  /* news/alert */
  .alert-box { border-radius: 16px; padding: 16px; background: linear-gradient(135deg, #7c2d12, #c2410c); color: #fff; margin-bottom: 12px; }
  .alert-box .lvl { display: inline-block; background: #fde047; color: #422006; font-weight: 900; font-size: 0.78rem; padding: 3px 9px; border-radius: 6px; letter-spacing: 0.04em; }
  .alert-box h3 { color: #fff; font-size: 1.15rem; margin: 8px 0 6px; }
  .alert-box p { color: rgba(255,255,255,0.9); line-height: 1.5; font-size: 0.93rem; }

  /* advert */
  .adv-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .field { margin-bottom: 8px; }
  .field label { display: block; font-size: 0.8rem; font-weight: 850; margin-bottom: 3px; }
  .field label .pt { font-size: 0.66rem; padding: 2px 7px; border-radius: 999px; margin-left: 4px; vertical-align: 1px; }
  .field input, .field textarea { width: 100%; padding: 8px 10px; border-radius: 9px; border: 1px solid rgba(5,43,65,0.22); font-size: 0.9rem; line-height: 1.45; }
  .field textarea { min-height: 58px; resize: vertical; }
  .checklist { list-style: none; display: grid; gap: 5px; margin: 8px 0; font-size: 0.84rem; }
  .checklist li { padding: 6px 10px; border-radius: 9px; background: #f1f5f9; color: var(--muted); font-weight: 650; }
  .checklist li::before { content: "\25CB  "; }
  .checklist li.ok { background: var(--green-soft); color: var(--green); }
  .checklist li.ok::before { content: "\2714  "; }
  .poster { border-radius: 16px; overflow: hidden; background: #fff; border: 1px solid var(--line); box-shadow: 0 10px 26px rgba(0,25,45,0.12); position: sticky; top: 10px; }
  .poster .pimg { height: 180px; background: #1e3a5f center/cover no-repeat; position: relative; }
  .poster .pimg .ttl { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px; background: linear-gradient(transparent, rgba(0,0,0,0.75)); color: #fff; }
  .poster .ttl h3 { color: #fff; font-size: 1.35rem; margin: 0; font-weight: 900; }
  .poster .ttl p { font-style: italic; font-size: 0.9rem; opacity: 0.95; }
  .poster .pbody { padding: 14px; font-size: 0.88rem; line-height: 1.55; }
  .poster .pbody p { margin-bottom: 8px; }
  .poster .safe { background: #fef3c7; border-left: 4px solid var(--amber); padding: 8px 10px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; }
  .poster .placeholder { color: #94a3b8; font-style: italic; }
  details.model { margin-top: 12px; border-radius: 12px; border: 1px solid var(--line); background: #fff; padding: 10px 12px; }
  details.model summary { cursor: pointer; font-weight: 800; color: var(--teal-dark); }
  details.model p { font-size: 0.88rem; line-height: 1.55; margin-top: 8px; }

  /* finish */
  .copy-all { text-align: center; padding: 20px; border-radius: 18px; background: linear-gradient(135deg, #0f3a5c, #155e75); color: #fff; }
  .copy-all h2 { color: #fff; }
  .copy-all p { color: rgba(255,255,255,0.85); margin: 6px auto 12px; max-width: 620px; line-height: 1.5; }
  .scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 12px 0; }
  .score { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 0.82rem; }
  .score b { display: block; font-size: 1.2rem; color: var(--navy); }
  .note { font-size: 0.76rem; color: var(--muted); margin-top: 6px; }
  .fact { background: #fff7ed; border-left: 5px solid #ea580c; border-radius: 10px; padding: 10px 12px; font-size: 0.88rem; line-height: 1.5; margin: 10px 0; }

  /* gap fill */
  .cloze { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .cz-bank { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border-radius: 10px; background: #fff7ed; border: 1px dashed #fdba74; margin-bottom: 10px; }
  .cz-bank button { border: 2px solid #fb923c; background: #fff; color: #9a3412; border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: 0.88rem; cursor: pointer; }
  .cz-bank button.used { opacity: 0.3; cursor: default; }
  .cz-bank button.sel { background: #ea580c; color: #fff; }
  .cz-text { font-size: 1.02rem; line-height: 2.3; }
  .gap { display: inline-block; min-width: 92px; padding: 0 8px; margin: 0 2px; border: none; border-bottom: 3px solid #94a3b8; background: #f1f5f9; border-radius: 6px 6px 0 0; font: inherit; font-weight: 800; color: var(--navy); cursor: pointer; line-height: 1.6; }
