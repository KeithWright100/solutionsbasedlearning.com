<style>

  .pol.on { border-color: var(--acc); background: var(--acc-soft); }
  .pol .cost { font-size: 0.78rem; font-weight: 900; color: var(--amber); }

  .pol small { color: var(--muted); line-height: 1.35; }

  @media (prefers-reduced-motion: reduce) { .xp-pop { animation: none; } .mcard { transition: none; } .hud .bar div { transition: none; } }
</style>

      TYPES: ['Family planning', 'Women and girls', 'Health', 'Resources and environment'],
      POLICIES: [
        { id: 'A', tab: 'A · Family planning services', hd: 'Bringing contraception to the villages', types: ['Family planning'],
          p: ['Family planning has been part of the government’s health strategy since the 1990s, with a National Family Planning Policy and a costed plan supported by the UN Population Fund (UNFPA). UNFPA is the only supplier of modern contraceptives to public health facilities.',
              'Because many villages are far from clinics, the Gambia Family Planning Association runs a Community-Based Distribution programme in more than 150 underserved communities. In 2020 it provided 75% of all new family planning users.',
              'Use of modern contraception by married women rose from 8% in 2013 to 17% in 2019–20, and the fertility rate fell from 5.6 to 4.4. New users rose from 47,911 in 2015 to 80,918 in 2019, then fell by about 40% in 2020 when COVID-19 disrupted services.',
              'Barriers remain: myths that contraception causes infertility or encourages promiscuity, religious objections, opposition from husbands, and shortages of staff and supplies in rural areas. Only about 40% of the demand for family planning is met by modern methods.'],
          by: 'Based on UNFPA The Gambia (Family Planning) and the Gambia Demographic and Health Survey 2019–20', url: 'https://gambia.unfpa.org/en/topics/family-planning-10',
          q: 'Which evidence best shows a LIMITATION of this policy?', o: ['Modern contraceptive use doubled from 8% to 17%', 'Only about 40% of demand for family planning is met, and supplies depend on one UN agency', 'The programme reaches more than 150 communities', 'The fertility rate fell from 5.6 to 4.4'], a: 1,
          why: 'Most women who want to avoid pregnancy are still not using a modern method, and relying on one outside supplier is a risk if funding stops.' },
        { id: 'B', tab: 'B · Girls’ education', hd: 'Getting girls into school', types: ['Women and girls'],
          p: ['The right to education was written into the constitution in 1997. The Education Policy (2004) and the Children’s Act (2005) made basic education free and compulsory. Girls were charged lower fees or none at all in grades 7–9, and from 2010 all girls received fee exemptions. A Girls’ Scholarship Trust Fund also paid for girls to stay in school.',
              'In 1996 there were only 74 girls for every 100 boys in primary school, and 44 for every 100 in upper secondary. By 2004 primary schools had more girls than boys (104 per 100), and by 2008 upper secondary had reached 94. In 2011, 20% of the national budget went to primary and secondary education.',
              'Girls who stay in school tend to marry later, have their first child later, earn more and choose smaller families. The challenge now is quality: better school management and better learning.'],
          by: 'Based on UK Government case study “MDG 3: Education for all in The Gambia”', url: 'https://www.gov.uk/government/case-studies/mdg-3-education-for-all-in-the-gambia',
          q: 'Why might girls’ education reduce the birth rate?', o: ['Schools hand out contraceptives', 'Girls who stay in school marry later, start families later and often choose fewer children', 'The law stops students from having children', 'Fees make families too poor to have children'], a: 1,
          why: 'Education is an indirect (development) policy: it changes the choices women make, so it works slowly but lasts.' },
        { id: 'C', tab: 'C · Laws on child marriage and FGM', hd: 'Changing the law to protect girls', types: ['Women and girls'],
          p: ['In 2015 The Gambia banned female genital mutilation/cutting (FGM/C). In 2016 the Children’s (Amendment) Act made marriage under the age of 18 illegal.',
              'Laws alone do not change customs quickly. In the 2019–20 survey, 23% of women aged 20–24 had been married before 18, 14% had given birth before 18, and 73% of women aged 15–49 had experienced FGM/C. The share of girls aged 0–14 who had been cut (46%) suggests the practice is slowly declining.',
              'In 2024 some politicians and religious leaders tried to overturn the FGM ban. On 15 July 2024 the National Assembly rejected the repeal bill, so the ban stayed.'],
          by: 'Based on Girls Not Brides (2024), Gambia Bureau of Statistics and the Gambia DHS 2019–20', url: 'https://www.girlsnotbrides.org/articles/uphold-the-ban-on-fgmc-the-gambia/',
          q: 'What does the 2024 attempt to repeal the FGM ban suggest about these laws?', o: ['They are fully accepted by everyone', 'There is still strong cultural resistance, so laws need education and community support to work', 'They have ended child marriage completely', 'They only apply in towns'], a: 1,
          why: 'Laws set a clear rule, but enforcement in rural areas and changing attitudes take much longer.' },
        { id: 'D', tab: 'D · Mothers’ and children’s health', hd: 'Healthier mothers, fewer births?', types: ['Health'],
          p: ['When parents are confident their children will survive, they tend to have fewer of them. Improving the health of mothers and babies is therefore an important part of slowing population growth.',
              'Malaria is a major danger in pregnancy. The share of pregnant women receiving at least three doses of preventive malaria treatment rose from 6% in 2013 to 52% in 2019–20.',
              'However, under-5 mortality stayed at 56 deaths per 1,000 births between 2013 and 2019–20: about 1 in 18 children still dies before age 5. 44% of women and 45% of young children have anaemia.'],
          by: 'Based on the Gambia DHS 2019–20 key findings (Gambia Bureau of Statistics)', url: 'https://www.gbosdata.org/data-stories/population-and-demography/the-gambia-demographic-and-health-survey-highlight',
          q: 'Which statement is best supported by the source?', o: ['Child deaths have fallen sharply since 2013', 'Malaria prevention in pregnancy improved a lot, but child mortality has not fallen yet', 'Every pregnant woman now gets malaria treatment', 'Health care has no link to family size'], a: 1,
          why: 'Progress is uneven: one measure improved greatly, but the child mortality rate that drives families to have more children has stayed the same.' },
        { id: 'E', tab: 'E · Social marketing', hd: 'Social marketing: selling an idea', types: ['Family planning'],
          p: ['Social marketing uses advertising methods, such as radio jingles, dramas, posters and branded low-cost products, to change behaviour for the good of society rather than for profit.',
              'With UNFPA support, the Ministry of Health has a family planning Communication Strategy. Messages aim to correct myths (for example, that contraception causes infertility), explain spacing births for the mother’s health, and reach men, who are often the key decision-makers in the home.',
              'Radio reaches more rural households than television, and messages from trusted local and religious leaders carry more weight than posters from the capital.'],
          by: 'Based on UNFPA The Gambia (Family Planning)', url: 'https://gambia.unfpa.org/en/topics/family-planning-10',
          q: 'Why is reaching men an important part of this strategy?', o: ['Men buy most of the radios', 'Men are often the main decision-makers about family size, and opposition from husbands is a key barrier', 'Only men are allowed to use contraception', 'Women do not listen to the radio'], a: 1,
          why: 'Changing attitudes is as important as supplying contraceptives: a method is only used if the family accepts it.' },
        { id: 'F', tab: 'F · Managing resources: forests', hd: 'Community forests: managing land for a growing population', types: ['Resources and environment'],
          p: ['In 1983 forests covered about 43% of The Gambia, but they were being damaged by fires used to clear land for farms, grazing, fuelwood and charcoal, and by a growing population, including migrant farmers.',
              'Charcoal production has been banned since 1980, but the ban is not fully obeyed. In 1990 the Forestry Department began handing forests to villages that could show they would manage them well. This became law in the Forest Policy (1995) and the Forest Act (1998).',
              'By 2000 around 270 villages managed about 24,000 hectares. Village forest committees protect against fire and keep the income from the forest. Seven years after the first handovers, fires had not fallen nationally, but in many community forest villages they had become rarer and smaller.'],
          by: 'Based on FAO, “Community forestry in The Gambia” (Dampha, 2001)', url: 'https://www.fao.org/4/ad348e/ad348e0c.htm',
          q: 'What is the main strength of the community forestry approach?', o: ['It stopped all forest fires nationally', 'Local people benefit from the forest, so they have a reason to protect it', 'It ended the need for fuelwood', 'It moved people out of rural areas'], a: 1,
          why: 'Giving communities ownership and income creates an incentive to manage resources sustainably, even if national results are slow.' }
      ],
      DECIDE: { budget: 10, meters: [['births', 'Slows birth rate'], ['dev', 'Development'], ['support', 'Public support'], ['env', 'Environment']],
        intro: 'It is 2026 and President Adama Barrow’s government (in power since 2017) asks for your plan. You have <b>10 budget points</b>. These cards come from the class grid. Choose at least four, watch the dashboard, then read what the evidence says about your choices.',
        cards: [
          { id: 'tv', name: 'TV advertising campaign promoting contraception for young adults', cost: 1, e: { births: 1, dev: 0, support: 0, env: 0 }, note: 'Fewer rural homes have a TV than a radio, so this misses many of the families with the highest birth rates.' },
          { id: 'radio', name: 'Radio programme discussing family planning and encouraging contraception', cost: 1, e: { births: 2, dev: 0, support: 1, env: 0 }, note: 'Radio reaches rural areas, and dramas and phone-ins can tackle myths. This is social marketing (Source E).' },
          { id: 'two', name: 'Only allow people in The Gambia to have a maximum of two children', cost: 1, e: { births: 2, dev: -1, support: -3, env: 0 }, note: 'Coercive and a breach of human rights. It would be almost impossible to enforce and would destroy trust in health services.' },
          { id: 'tax', name: 'Make people who work pay more tax to spend on schools and hospitals', cost: 0, e: { births: 0, dev: 1, support: -2, env: 0 }, note: 'Costs nothing from your budget, but over half of Gambians (53.4% in 2020) live in poverty, so there is little extra tax to collect.' },
          { id: 'mums', name: 'Improve hospital care for pregnant mothers', cost: 2, e: { births: 1, dev: 2, support: 2, env: 0 }, note: 'Safer births and better child survival reduce the need for “insurance” births (Source D).' },
          { id: 'forest', name: 'Protect some forest areas and plant more trees', cost: 1, e: { births: 0, dev: 1, support: 1, env: 3 }, note: 'Community forestry already does this (Source F). It protects resources but does not slow the birth rate.' },
          { id: 'school', name: 'Offer free education to all children', cost: 3, e: { births: 2, dev: 3, support: 2, env: 0 }, note: 'Strong evidence: educating girls delays marriage and first births and leads to smaller families (Source B). It works slowly.' },
          { id: 'aid', name: 'Ask richer countries for aid to pay for free contraception', cost: 1, e: { births: 2, dev: 0, support: 1, env: 0 }, note: 'This is what happens now: UNFPA is the only supplier of contraceptives to public clinics. It works, but depends on foreign funding (Source A).' },
          { id: 'vacc', name: 'Provide vaccinations for common diseases to all babies', cost: 2, e: { births: 1, dev: 2, support: 2, env: 0 }, note: 'Lower child mortality helps families feel confident having fewer children, but it raises population growth at first.' },
          { id: 'fact', name: 'Try to get more big companies to open factories in the country', cost: 2, e: { births: 1, dev: 2, support: 1, env: -1 }, note: 'Jobs for young people and women can reduce family size over time, but investors need skills, power and roads first.' },
          { id: 'spons', name: 'Get charities to find sponsors in richer countries for children in poor families', cost: 1, e: { births: 0, dev: 1, support: 1, env: 0 }, note: 'Helps individual children, but it is small-scale and does not change national patterns.' },
          { id: 'rights', name: 'Make sure men and women have equal rights to go to school and get a job', cost: 1, e: { births: 2, dev: 2, support: 0, env: 0 }, note: 'Women’s empowerment is one of the strongest links to lower fertility, but changing attitudes meets resistance (Source C).' },
          { id: 'water', name: 'Build clean water pumps in every village', cost: 2, e: { births: 1, dev: 2, support: 2, env: 0 }, note: 'Fewer water-borne diseases mean fewer child deaths, and girls spend less time fetching water, so more can attend school.' },
          { id: 'work', name: 'Make it illegal for children under 15 to do any paid work', cost: 1, e: { births: 1, dev: 1, support: -1, env: 0 }, note: 'Children become less of an economic asset, but poor families lose income and the law is hard to enforce on family farms.' },
          { id: 'poster', name: 'Run a poster campaign to encourage people to have fewer children', cost: 1, e: { births: 1, dev: 0, support: 0, env: 0 }, note: 'Cheap, but posters alone rarely change deep-rooted beliefs, especially where literacy is lower.' },
          { id: 'debt', name: 'Get the rich countries’ banks to cancel The Gambia’s debts', cost: 1, e: { births: 0, dev: 2, support: 1, env: 0 }, note: 'Frees money for schools and clinics, but depends on other countries agreeing.' },
          { id: 'web', name: 'Set up computers and an internet connection in each village', cost: 3, e: { births: 0, dev: 1, support: 1, env: 0 }, note: 'Expensive and needs electricity first. Useful later, but not a priority for slowing growth.' },
          { id: 'solar', name: 'Set up solar power to provide electricity in all the villages', cost: 2, e: { births: 0, dev: 2, support: 2, env: 2 }, note: 'Reduces the need for fuelwood (protecting forests) and powers clinics and schools.' },
          { id: 'slums', name: 'Clear away all the slums and illegal shanty towns in the city', cost: 1, e: { births: 0, dev: -2, support: -3, env: 0 }, note: 'Makes people homeless without solving why they moved to the city. It harms the poorest families.' },
          { id: 'dam', name: 'Build a huge dam to generate electricity for the growing city', cost: 3, e: { births: 0, dev: 2, support: -1, env: -2 }, note: 'Large-scale power, but very expensive, and it can flood farmland and move people from their homes.' }
        ],
        actual: 'What The Gambia is actually doing: free basic education with fee exemptions for girls (Source B); family planning through clinics and community distribution, mostly funded by UNFPA (Source A); laws against child marriage (2016) and FGM (2015, upheld in 2024) (Source C); better maternal health care (Source D); and community forestry (Source F).' },
      pyrTasks: 'g'
    },

      POLICIES: [
        { id: 'A', tab: 'A · Stop at Two (1966–1986)', hd: '“Two is enough”: Singapore’s anti-natalist years', types: ['Anti-natalist'],
          p: ['In the 1960s Singapore’s fertility rate was around 6. The Singapore Family Planning and Population Board was set up in 1966. Abortion and sterilisation were legalised in 1970, and women were urged to be sterilised after their second child.',
              'From 1972–73 a series of disincentives punished large families: paid maternity leave only for the first two children, higher hospital delivery fees for each extra child, tax relief only for the first three children, less priority for big families in public housing, and top primary school places for children whose parents had been sterilised. Posters announced “Small Families – Brighter Future: Two is enough.”',
              'The fertility rate fell from 5.76 in 1960 to 2.07 in 1975 and below replacement level in 1977. It has never returned to 2.1. Statistician Saw Swee Hock argued the policy sped up a fall that would have happened anyway, and that it was not reversed quickly enough.'],
          by: 'Based on “Population planning in Singapore” (Wikipedia, citing Saw Swee Hock and the US Library of Congress)', url: 'https://en.wikipedia.org/wiki/Population_planning_in_Singapore',
          q: 'Which is the strongest criticism of “Stop at Two”?', o: ['It did not reduce the fertility rate', 'It worked too well: fertility fell below replacement and never recovered', 'It was too cheap', 'It only lasted one year'], a: 1,
          why: 'An anti-natalist policy can overshoot. Singapore is still dealing with the low birth rate it helped to create.' },
        { id: 'B', tab: 'B · Graduate Mothers’ Scheme (1984)', hd: 'Babies for graduates: a policy that backfired', types: ['Selective (eugenic)'],
          p: ['In 1984 the government worried that university-educated women were having fewer children than less-educated women. It gave graduate mothers priority for their children’s school places, tax rebates and other benefits, and set up the Social Development Unit (SDU) to help graduates meet and marry.',
              'The policy caused a public row known as the “Great Marriage Debate”. Critics called it eugenics and unfair to poorer families. In the 1984 general election the ruling party suffered a 12.9% swing against it, and the most controversial parts were dropped in 1985. The SDU was nicknamed “Single, Desperate and Ugly”; it became the Social Development Network in 2009.'],
          by: 'Based on “Population planning in Singapore” (Wikipedia)', url: 'https://en.wikipedia.org/wiki/Population_planning_in_Singapore',
          q: 'What does the 1984 election result suggest?', o: ['The policy was very popular', 'Selective policies that favour one group can lose public support quickly', 'Graduates had more children afterwards', 'Matchmaking always works'], a: 1,
          why: 'Policies seen as unfair or discriminatory lose public trust, so they are dropped before they can work.' },
        { id: 'C', tab: 'C · Have three or more (1987)', hd: 'A U-turn: “Have three or more, if you can afford it”', types: ['Pro-natalist: money'],
          p: ['By 1986 the fertility rate had fallen to 1.43. The Family Planning and Population Board was closed and in 1987 the government launched a new slogan: “Have three or more, if you can afford it.”',
              'Incentives included extra tax relief for a third and fourth child, MediSave money for third-child hospital costs and housing upgrade priority for large families. In 1990 a $20,000 tax rebate was offered for a second child born before the mother turned 28.',
              'The fertility rate rose to 1.96 in 1988, which was also a Dragon year, popular for births in Chinese tradition. It then fell back to 1.83 in 1990 and 1.60 by 2000. Many parents said they were baffled: were they having children for the country or for themselves?'],
          by: 'Based on “Population planning in Singapore” (Wikipedia); fertility rates from the Singapore Department of Statistics', url: 'https://en.wikipedia.org/wiki/Population_planning_in_Singapore',
          q: 'Why is it hard to judge whether this policy worked?', o: ['There is no data', 'The 1988 rise coincided with a Dragon year, and the rise did not last', 'The government did not spend any money', 'Fertility rose every year after 1987'], a: 1,
          why: 'A short rise may have been cultural (the Dragon year), not the policy. Fertility then kept falling.' },
        { id: 'D', tab: 'D · The Baby Bonus (2001–today)', hd: 'Paying for babies: the Baby Bonus', types: ['Pro-natalist: money'],

  /* ================= SORTER (M3, M4) ================= */
  function sorter(body, cards, bins, store, ansKey, intro) {
    var TT = T;
    var st = TT[store], placed = st.placed || {}, order = st.order && st.order.length === cards.length ? st.order : shuffle(cards.map(function (_, i) { return i; }));
    st.order = order; save();
    var cols = Math.min(bins.length, 4);
    body.insertAdjacentHTML('beforeend',
      '<p>' + intro + ' Drag each card into the correct box, or tap a card and then tap a box. Then press <b>Check</b>.</p>' +
      '<div class="tray" id="tray" aria-label="Cards to sort"></div>' +
      '<div class="bins" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr))">' + bins.map(function (b) { return '<div class="bin ' + b[2] + '" data-bin="' + b[0] + '" role="button" tabindex="0" aria-label="' + b[1] + '"><h4>' + b[1] + '</h4><div class="drop"></div></div>'; }).join('') + '</div>' +
      '<div class="row"><button type="button" class="btn" id="chk">Check</button><button type="button" class="btn ghost" id="rs">Start again</button><span class="fb" id="sfb" aria-live="polite"></span></div>');
    var selC = null, done = function () { return TT.ans[ansKey] && TT.ans[ansKey].ok; };
    function render() {
      $('tray').innerHTML = ''; body.querySelectorAll('.bin .drop').forEach(function (d) { d.innerHTML = ''; });
      order.forEach(function (i) {
        var c = document.createElement('button'); c.type = 'button'; c.className = 'card' + (done() ? ' right' : ''); c.textContent = cards[i].t; c.dataset.i = i;
        var where = placed[i]; (where ? body.querySelector('.bin[data-bin="' + where + '"] .drop') : $('tray')).appendChild(c);
      });
      if (done()) { $('sfb').className = 'fb ok'; $('sfb').textContent = '✓ All correct!'; }
    }
    function put(i, bin) { if (done()) return; if (bin) placed[i] = bin; else delete placed[i]; st.placed = placed; save(); render(); }
    render();
    dragify(body, '.card', function (c, el) { var b = el && el.closest('.bin'); if (b) put(+c.dataset.i, b.dataset.bin); else if (el && el.closest('#tray')) put(+c.dataset.i, null); },
      function (c) { if (done()) return; if (selC === c) { c.classList.remove('sel'); selC = null; return; } if (selC) selC.classList.remove('sel'); selC = c; c.classList.add('sel'); }, '.bin');
    body.querySelectorAll('.bin').forEach(function (b) {
      var act = function () { if (selC) { put(+selC.dataset.i, b.dataset.bin); selC = null; } };
      b.addEventListener('click', function (e) { if (!e.target.closest('.card')) act(); });
      b.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
    });
    $('chk').onclick = function () {
      if (done()) return;
      var wrong = 0, left = 0;
      body.querySelectorAll('.card').forEach(function (c) { var i = +c.dataset.i; if (!placed[i]) { left++; return; } if (placed[i] === cards[i].a) c.classList.add('right'); else { c.classList.add('wrong'); wrong++; } });
      var fb = $('sfb');
      if (left) { fb.className = 'fb'; fb.textContent = left + ' card' + (left > 1 ? 's' : '') + ' still to sort.'; return; }
      if (wrong) { fb.className = 'fb bad'; fb.textContent = wrong + ' in the wrong box (shown in red). Move them and check again.'; return; }
      TT.ans[ansKey] = { ok: true }; save(); fb.className = 'fb ok'; fb.textContent = '✓ All ' + cards.length + ' correct!'; award(40, $('chk'));
    };
    $('rs').onclick = function () { if (done()) return; placed = {}; st.placed = placed; save(); render(); $('sfb').textContent = ''; };
  }
  function dragify(container, sel, onDrop, onTap, zoneSel) {
    var drag = null;
    container.addEventListener('pointerdown', function (e) { var c = e.target.closest(sel); if (!c || c.classList.contains('right') || c.disabled) return; drag = { c: c, x: e.clientX, y: e.clientY, moved: false }; try { c.setPointerCapture(e.pointerId); } catch (x) {} });
    container.addEventListener('pointermove', function (e) {
      if (!drag) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) { drag.moved = true; var r = drag.c.getBoundingClientRect(); drag.g = drag.c.cloneNode(true); drag.g.classList.add('ghost-drag'); drag.g.style.width = r.width + 'px'; drag.ox = drag.x - r.left; drag.oy = drag.y - r.top; document.body.appendChild(drag.g); drag.c.style.opacity = '.35'; }
      if (drag.moved) { drag.g.style.left = (e.clientX - drag.ox) + 'px'; drag.g.style.top = (e.clientY - drag.oy) + 'px'; document.querySelectorAll(zoneSel).forEach(function (z) { z.classList.remove('over'); }); var el = document.elementFromPoint(e.clientX, e.clientY), z = el && el.closest(zoneSel); if (z) z.classList.add('over'); }
    });
    var end = function (e) { if (!drag) return; var d = drag; drag = null; document.querySelectorAll(zoneSel).forEach(function (z) { z.classList.remove('over'); }); if (d.moved) { d.g.remove(); d.c.style.opacity = ''; onDrop(d.c, document.elementFromPoint(e.clientX, e.clientY)); } else onTap(d.c); };
    container.addEventListener('pointerup', end);
    container.addEventListener('pointercancel', function () { if (drag) { if (drag.g) drag.g.remove(); drag.c.style.opacity = ''; drag = null; } });
  }

  /* ================= M3: CAUSES ================= */
  function m3(body) {
    var g = C.id === 'g';
    sorter(body, C.CAUSES, C.sortBins, 'sort', 'm3', g ? 'Why is The Gambia’s population growing so fast? Some cards explain the high birth rate, some explain why the death rate fell, and some are not causes at all.' : 'Why does Singapore have so few babies and so many older people? Sort the cards. Watch out: some are not causes.');
    mount(body, g ? [
      mcq('m3b', 'Explain the link', 'Why does high child mortality lead to a high birth rate?', ['Parents have more children so that enough survive to help the family and care for them in old age', 'Hospitals encourage large families', 'It lowers the death rate', 'It makes contraception cheaper'], 0, 'These are sometimes called “insurance births”. When child survival improves, families usually choose to have fewer children, but only after a delay.', 10),
      writeTask('m3w', 'Worksheet question 1 · Explain (4 marks)', 'What are the reasons for The Gambia’s high birth and fertility rates?', 'Give at least three reasons. For each: reason → evidence → explain why it raises the birth rate.',
        'First, many families depend on farming, so children are an economic asset who help on the land and at home, and they are expected to support their parents in old age. Second, contraception is not widely used: only 17% of married women use a modern method, because of myths, religious objections, opposition from husbands and poor access in rural areas, where the fertility rate is highest (6.4 in Kuntaur). Third, early marriage is common: 23% of women aged 20–24 were married before 18, which lengthens the time women have children. Finally, high child mortality (about 1 in 18 children die before 5) encourages parents to have more children.',
        'at least three reasons · data from the cards · an explanation of how each raises the birth rate')

      mcq('m3b', 'Explain the link', 'Why did Singapore’s birth rate stay low even after “Stop at Two” ended in 1986?', ['Small families had become normal, and the costs of housing, education and work pressure kept rising', 'Contraception was banned', 'The government still punished large families', 'The death rate rose'], 0, 'Social norms change slowly. Once couples expect to have one or two children and pay a lot for each, it is hard to persuade them to have more.', 10),
      writeTask('m3w', 'Exam skill · Explain (4 marks)', 'Explain two reasons for Singapore’s very low fertility rate.', 'Reason → evidence → explain why it lowers fertility.',
        'First, people are marrying later and more are staying single: the median age of brides is 29.1 and 29.6% of women aged 30–39 are single. Fewer years of marriage means fewer births. Second, raising a child is very expensive and time-consuming in Singapore: housing, education and private tuition are costly and working hours are long, so many couples decide to have only one child or none.',
        'two reasons · data · a clear explanation for each')

  /* ================= M4: ISSUES ================= */
  function m4(body) {

      writeTask('m4w', 'Worksheet question 5 · Explain (6 marks)', 'What are the consequences of a high dependency ratio for (1) governments and (2) families?', 'Two or three points for each. Use data: dependency ratio about 75, 39.7% under 15, 53.4% in poverty.',
        '1) Governments: with about 75 dependants for every 100 people of working age, the government must spend heavily on schools, teachers and health care for 1.1 million children, while relatively few people earn enough to pay tax. Money spent on basic services cannot be used for roads, power or jobs, so development is slower. It must also create enough jobs for the large numbers leaving school each year, or young people may migrate. 2) Families: each working adult supports more children, so there is less money for food, uniforms and school costs, which keeps families in poverty (53.4% in 2020). Girls may be taken out of school to help at home or to marry, and frequent pregnancies put mothers’ health at risk.',

      writeTask('m4w', 'Exam skill · Explain (6 marks)', 'Explain the consequences of Singapore’s low birth rate and ageing population for (1) the government and (2) families.', 'Two or three points for each. Use data: old-age support ratio 4.9 → 2.9 → 2.4, 20.7% of citizens aged 65+.',

        '<div class="task' + (st.types === true ? ' done' : '') + '" id="ttask"><span class="tnum">Step 1 · Tag the policy type</span><p><b>What type of policy does this source describe? Select all that apply, then check.</b></p><div class="chips">' +
          C.TYPES.map(function (t) { var on = st.tsel.indexOf(t) >= 0; var c = st.types === true ? (s.types.indexOf(t) >= 0 ? ' right' : '') : (on ? ' sel' : ''); return '<button type="button" class="chip' + c + '" data-t="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') +
          '</div><div class="row"><button type="button" class="btn" id="tchk"' + (st.types === true ? ' disabled' : '') + '>Check</button><span class="fb" id="tfb">' + (st.types === true ? '✓ Correct.' : '') + '</span></div></div>' +

          s.o.map(function (o, k) { return '<button type="button" class="opt' + (st.q === true && k === s.a ? ' right' : '') + '" data-k="' + k + '"' + (st.q === true ? ' disabled' : '') + '>' + esc(o) + '</button>'; }).join('') +

      var rate = $('rate'); $('rlab').textContent = st.rate + ' · ' + RLAB[st.rate];
      rate.oninput = function () { st.rate = +rate.value; st.touched = true; $('rlab').textContent = st.rate + ' · ' + RLAB[st.rate]; save(); score(); };
      var tt = null; $('rwhy').oninput = function (e) { st.why = e.target.value; st.touched = true; clearTimeout(tt); tt = setTimeout(function () { save(); score(); }, 400); };
      document.querySelectorAll('#ttask .chip').forEach(function (c) { c.onclick = function () { if (st.types === true) return; var t = c.dataset.t, k = st.tsel.indexOf(t); if (k >= 0) st.tsel.splice(k, 1); else st.tsel.push(t); c.classList.toggle('sel'); save(); }; });
      $('tchk').onclick = function () {
        var ok = st.tsel.length === s.types.length && s.types.every(function (t) { return st.tsel.indexOf(t) >= 0; });
        if (ok) { st.types = true; save(); award(10, $('tchk')); show(); }
        else { $('tfb').className = 'fb bad'; $('tfb').textContent = st.tsel.length < s.types.length ? 'Choose a tag that fits. Read the source again.' : 'Not quite. One of your tags does not fit this source.'; }
      };
      document.querySelectorAll('#qtask .opt').forEach(function (b) { b.onclick = function () {
        if (st.q === true) return;
        if (+b.dataset.k === s.a) { st.q = true; save(); award(10, b); show(); }
        else { b.classList.add('wrong'); $('qfb').className = 'fb bad'; $('qfb').textContent = 'Not the best answer. Look for the evidence in the source.'; setTimeout(function () { b.classList.remove('wrong'); }, 900); }
      }; });
      if ($('prev')) $('prev').onclick = function () { at--; show(); };
      if ($('next')) $('next').onclick = function () { at++; show(); window.scrollTo({ top: $('stabs').offsetTop - 80, behavior: 'smooth' }); };
      $('stabs').onclick = function (e) { var b = e.target.closest('[data-s]'); if (b) { at = +b.dataset.s; show(); } };
      score();
    }
    function score() {
      if (!$('scard')) return;
      $('scard').innerHTML = '<h3>My policy scorecard</h3><div class="tblwrap"><table class="score"><tr><th>Policy</th><th>Type</th><th>My rating (1–5)</th><th>My reason</th></tr>' +
        C.POLICIES.map(function (s) { var st = T.src[s.id] || {}; return '<tr><td>' + esc(s.tab) + '</td><td>' + esc(s.types.join(', ')) + '</td><td>' + (st.rate || 3) + '</td><td>' + esc(st.why || '') + '</td></tr>'; }).join('') + '</table></div>';
    }
    show();
    mount(body, [C.id === 'g' ?
      writeTask('m5w', 'IB-style question (5 marks)', 'Analyse the anti-natalist policy of a country you have studied (The Gambia).', 'Plan: what the policy aims to do → how it works (two or three named measures) → evidence of its effect → a limitation → a short judgement.', null,
        'at least three policies · data (TFR 5.6 → 4.4, contraception 8% → 17%, parity in schools) · limitations (unmet demand, cultural resistance, aid dependence) · a clear judgement') :
      writeTask('m5w', 'IB-style question (5 marks)', 'Analyse the pro-natalist policy of a country you have studied (Singapore).', 'Plan: why Singapore needs the policy → how it works (two or three named measures with dates) → evidence of its effect on the fertility rate → a limitation → a short judgement.', null,
        'at least three policies with dates · data (TFR 1.96 in 1988, 1.60 in 2000, 0.87 in 2025) · reasons for limited success · immigration as an alternative · a clear judgement')]);
  }

  /* ================= M6: DECISION ================= */
  function m6(body) {
    var D = C.DECIDE;
    body.insertAdjacentHTML('beforeend',
      '<p>' + D.intro + '</p>' +
      '<div class="pm-grid"><div class="pols" id="pols"></div><aside class="dash" aria-live="polite"><div class="budget" id="bud"></div><div id="meters" style="display:flex;flex-direction:column;gap:8px"></div><p class="src">A simplified model for discussion: real effects are debated and take years.</p></aside></div>' +
      '<div id="cmp"></div>');
    var card = function (id) { return D.cards.filter(function (p) { return p.id === id; })[0]; };
    function spent() { return T.pm.reduce(function (a, id) { return a + card(id).cost; }, 0); }
    function draw() {
      $('pols').innerHTML = D.cards.map(function (p) { var on = T.pm.indexOf(p.id) >= 0; return '<button type="button" class="pol' + (on ? ' on' : '') + '" data-p="' + p.id + '" aria-pressed="' + on + '"><b>' + esc(p.name) + '</b><span class="cost">Cost: ' + p.cost + ' point' + (p.cost === 1 ? '' : 's') + '</span></button>'; }).join('');
      var sp = spent(); $('bud').textContent = 'Budget used: ' + sp + ' / ' + D.budget + ' points · ' + T.pm.length + ' policies chosen';
      var tot = {}; D.meters.forEach(function (m) { tot[m[0]] = 0; });
      T.pm.forEach(function (id) { var p = card(id); for (var k in tot) tot[k] += p.e[k] || 0; });
      $('meters').innerHTML = D.meters.map(function (m) { var v = Math.max(-8, Math.min(8, tot[m[0]])), w = Math.abs(v) / 8 * 50, col = v >= 0 ? '#16a34a' : '#dc2626'; return '<div class="meter"><span>' + m[1] + '</span><span class="trk"><span style="' + (v >= 0 ? 'left:50%' : 'left:' + (50 - w) + '%') + ';width:' + w + '%;background:' + col + '"></span></span><span class="v">' + (v > 0 ? 'Better +' + v : v < 0 ? 'Worse ' + v : 'No change') + '</span></div>'; }).join('');
      $('cmp').innerHTML = T.pm.length ? '<h3>What the evidence says about your choices</h3><div class="tblwrap"><table class="score cmp"><tr><th>Your policy</th><th>Evidence and reality check</th></tr>' + T.pm.map(function (id) { var p = card(id); return '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.note) + '</td></tr>'; }).join('') + '</table></div><p class="model">' + esc(D.actual) + '</p>' : '';
      $('pols').querySelectorAll('.pol').forEach(function (b) { b.onclick = function () {
        var id = b.dataset.p, k = T.pm.indexOf(id), p = card(id);
        if (k >= 0) T.pm.splice(k, 1); else { if (spent() + p.cost > D.budget) { toast('Over budget: drop a policy first.'); return; } T.pm.push(id); }
        save(); draw();
      }; });
    }
    draw();
    mount(body, [
      writeTask('pm1', 'Your decision', 'Which policies would you choose and why?', 'Frame: “I would… because… The evidence from Source … shows… This is similar to / different from what ' + C.name + ' is doing, which… The biggest risk of my plan is…”', null,
        'at least four policies · evidence from the sources or data · a comparison with what the government is actually doing · one risk or limitation · why you rejected at least one option')
    ]);
  }

  /* ================= STARTER: CARROT OR STICK ================= */
  var STARTER = [
    { t: 'Anti · Family planning clinics in every town', a: 'carrot' },
    { t: 'Anti · A pay bonus if everyone at a factory agrees to have no more than two children', a: 'carrot' },
    { t: 'Anti · Posters of celebrities who have only one or two children', a: 'carrot' },
    { t: 'Anti · Good old-age pensions, so parents do not rely on children', a: 'carrot' },
    { t: 'Anti · Teach every pupil about birth control', a: 'carrot' },
    { t: 'Anti · Plenty of good careers and jobs for women', a: 'carrot' },
    { t: 'Anti · A special tax on nappies and baby food', a: 'stick' },
    { t: 'Anti · Free school places for a first or second child only', a: 'stick' },
    { t: 'Anti · Refuse public housing to families with more than three children', a: 'stick' },
    { t: 'Anti · Raise the legal age of marriage', a: 'stick' },
    { t: 'Anti · China’s one-child policy: fines for an extra child (1979–2015)', a: 'stick' },
    { t: 'Pro · Singapore’s Baby Bonus: a cash gift for each new baby', a: 'carrot' },
    { t: 'Pro · Paid leave for mothers and fathers', a: 'carrot' },
    { t: 'Pro · Cheaper childcare and preschool', a: 'carrot' },
    { t: 'Pro · Romania (1966): abortion and most contraception banned', a: 'stick' },
    { t: 'Pro · A tax on adults who have no children', a: 'stick' }
  ];
  var STARTER_BINS = [['carrot', '🥕 Carrot: makes life better if people follow the plan', 'b3'], ['stick', '🪵 Stick: makes life harder if they don’t', 'b2']];
  function starter() {
    var box = $('starter'); if (!box) return;
    S.st = S.st || { ans: {}, sort: {} };
    var keepT = T; T = S.st;
    box.insertAdjacentHTML('beforeend', '<p><b>Carrot</b> = encouraging people by making life better for them if they go along with the plan. <b>Stick</b> = making people go along with the plan by making life more difficult if they don’t. Each card says whether the policy is <b>anti</b>-natalist (fewer children) or <b>pro</b>-natalist (more children).</p>');
    sorter(box, STARTER, STARTER_BINS, 'sort', 'st', 'Sort these population policies into carrot and stick methods.');
    mount(box, [mcq('st2', 'Think', 'Which kind of approach is generally more acceptable in a democracy, and why?', ['Carrots: they reward people without taking away their choices', 'Sticks: they work faster so people prefer them', 'Neither is ever used', 'Sticks: they cost nothing'], 0, 'Sticks can work quickly but restrict human rights (China, Romania). Most democracies, including The Gambia and Singapore today, rely mainly on carrots.', 10)]);
    T = keepT;
  }

  /* ================= ONENOTE ================= */
  function notesFor(id, i) {
    var k = CASES[id], st = S.c[id], h = '', t = '';
    var H = function (x) { h += '<h2>' + esc(x) + '</h2>'; t += '\n' + x.toUpperCase() + '\n'; };
    var P = function (lbl, v) { h += '<p><b>' + esc(lbl) + '</b> ' + esc(v || '(not answered yet)').replace(/\n/g, '<br>') + '</p>'; t += lbl + ' ' + (v || '(not answered yet)') + '\n'; };
    var TB = function (head, rows) { h += '<table border="1" style="border-collapse:collapse"><tr>' + head.map(function (x) { return '<th style="padding:4px 8px">' + esc(x) + '</th>'; }).join('') + '</tr>' + rows.map(function (r) { t += r.join(' | ') + '\n'; return '<tr>' + r.map(function (x) { return '<td style="padding:4px 8px;vertical-align:top">' + esc(x) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>'; };
    var gr = pyrGroups(k.PYR), g = id === 'g';
    H(k.flag + ' ' + k.name + ' · Briefing ' + (i + 1) + ': ' + MISSIONS[i].t);
    if (i === 0) {
      var last = k.VITAL[k.VITAL.length - 1];
      P('Birth rate / death rate 2025:', last[1] + ' / ' + last[2] + ' per 1,000');
      P('Natural increase 2025:', ((last[1] - last[2]) / 10).toFixed(2) + '% per year');
      if (g) { P('Doubling time:', 'about 30 years (70 ÷ 2.31)'); P('Birth rate compared with Singapore:', '3.4 times higher'); P('DTM stage:', 'Stage 3 (late expanding)'); }
      else { P('Fertility rate:', '5.76 (1960) → 0.87 (2025), a fall of 84.9%'); P('DTM stage:', 'On the boundary of stages 4 and 5, moving into stage 5 (declining)'); }
      P('Describe the changes (my answer):', st.notes.m1w);
    } else if (i === 1) {
      P('Pyramid year:', String(k.PYR.year));
      P('Aged 0–14 / 15–64 / 65+:', (gr.young / gr.tot * 100).toFixed(1) + '% / ' + (gr.work / gr.tot * 100).toFixed(1) + '% / ' + (gr.old / gr.tot * 100).toFixed(1) + '%');
      P('Total dependency ratio:', ((gr.young + gr.old) / gr.work * 100).toFixed(1));
      if (g) P('2050 (UN projection):', 'about 4.3 million people, median age 26.1, fertility rate 2.38');
      else P('Citizens:', '20.7% aged 65+; old-age support ratio 4.9 (2015) → 2.9 (2025) → 2.4 (2030 projected)');
      P(g ? 'Annotations (my answer):' : 'Two features explained (my answer):', st.notes.m2w);
    } else if (i === 2) {
      TB(k.sortBins.map(function (b) { return b[1]; }), [k.sortBins.map(function (b) { return k.CAUSES.filter(function (c) { return c.a === b[0]; }).map(function (c) { return c.t; }).join('; '); })]);
      P('My explanation:', st.notes.m3w);
    } else if (i === 3) {
      TB(k.issueBins.map(function (b) { return b[1]; }), [k.issueBins.map(function (b) { return k.ISSUES.filter(function (c) { return c.a === b[0]; }).map(function (c) { return c.t; }).join('; '); })]);
      P('Consequences (my answer):', st.notes.m4w);
    } else if (i === 4) {
      TB(['Policy', 'Type', 'My rating (1–5)', 'My reason'], k.POLICIES.map(function (p) { var s = st.src[p.id] || {}; return [p.tab, p.types.join(', '), String(s.rate || 3), s.why || '']; }));
      P('Exam answer (5 marks):', st.notes.m5w);
    } else {
      var card = function (cid) { return k.DECIDE.cards.filter(function (p) { return p.id === cid; })[0]; };
      TB(['My policy', 'Evidence and reality check'], st.pm.map(function (cid) { var p = card(cid); return [p.name, p.note]; }));
      P('What the government is doing:', k.DECIDE.actual);
      P('My decision:', st.notes.pm1);
    }
    return { h: h, t: t };
  }
  function caseNotes(id) {
    var k = CASES[id], h = '<h1>' + k.flag + ' ' + esc(k.name) + ' · ' + k.type + ' policy · my case file</h1>', t = k.name.toUpperCase() + ' · MY CASE FILE\n';
    for (var i = 0; i < 6; i++) { var n = notesFor(id, i); h += n.h; t += n.t; }
    return { h: h, t: t };
  }
  function allNotes() {
    var h = '<h1>Population Policy Lab · my notes</h1><p><i>Learning intention: to engage with issues that have local and global significance.</i></p>', t = 'POPULATION POLICY LAB · MY NOTES\n';
    ['g', 's'].forEach(function (id) { var n = caseNotes(id); h += n.h; t += n.t; });
    h += '<h2>Comparison: pro-natalist and anti-natalist policies</h2><p>' + esc(S.notes.cmp || '(not answered yet)').replace(/\n/g, '<br>') + '</p>';
    t += '\nCOMPARISON\n' + (S.notes.cmp || '(not answered yet)') + '\n';
    h += '<p><small>From SBL · Population Policy Lab</small></p>';
    return { h: h, t: t };
  }
  function copyNotes(n) {
    var html = '<div style="font-family:Calibri,Arial,sans-serif">' + n.h + '</div>';
    var done = function () { toast('Copied. Paste it into OneNote with Ctrl+V.'); };
    var fallback = function () {
      var ta = document.createElement('textarea'); ta.value = n.t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('Select and copy the text manually.'); } ta.remove();
    };
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([n.t], { type: 'text/plain' }) })]).then(done, function () {
          if (navigator.clipboard.writeText) navigator.clipboard.writeText(n.t).then(done, fallback); else fallback();
        });
      } else if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(n.t).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  /* ================= TEACHER ================= */
  function checkTeacher() {
    try {
      fetch('/api/session', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
        IS_T = !!(d && d.loggedIn && d.user && d.user.status === 'active' && (d.user.role === 'teacher' || d.user.role === 'admin'));
        if (IS_T && view === 'home' && $('tRow')) $('tRow').hidden = false;
      }).catch(function () {});
    } catch (e) {}
  }
  function keyHtml() {
    var li = function (a) { return '<ul>' + a.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>'; };
    var h = '<h3>Starter · Carrot or stick</h3>' + STARTER_BINS.map(function (b) { return '<p><b>' + b[1] + ':</b> ' + STARTER.filter(function (c) { return c.a === b[0]; }).map(function (c) { return esc(c.t); }).join('; ') + '</p>'; }).join('');
    ['g', 's'].forEach(function (id) {
      var k = CASES[id], gr = pyrGroups(k.PYR), g = id === 'g', last = k.VITAL[k.VITAL.length - 1];
      h += '<h3>' + k.flag + ' ' + k.name + '</h3>';
      h += '<h4>Briefing 1 · DTM</h4>' + li(g ? ['Birth rate 2025: 29.3', 'Natural increase: (29.3 − 6.2) ÷ 10 = 2.31%', 'Doubling time: 70 ÷ 2.31 ≈ 30.3 years', '29.3 ÷ 8.5 = 3.4 times Singapore’s', 'DTM: stage 3 (late expanding)'] : ['Birth rate 1960: 36.7', 'Steepest fall: 1960s (36.7 → 21.5)', 'Natural increase: (8.5 − 5.1) ÷ 10 = 0.34%', 'TFR change: (0.87 − 5.76) ÷ 5.76 × 100 = −84.9%', 'DTM: stage 5 (on the 4/5 boundary)']);
      h += '<h4>Briefing 2 · Pyramid (' + k.PYR.year + ')</h4>' + li(g ? ['Largest group: 0–4', '% aged 0–14: ' + (gr.young / gr.tot * 100).toFixed(1), 'Dependency ratio: ' + ((gr.young + gr.old) / gr.work * 100).toFixed(1), 'Shape: wide base, narrow top (young, expanding)', '2050: base narrows relative to the middle (demographic dividend)'] : ['Most males: 25–29', 'Male bulge 20–39: non-resident foreign workers', '% aged 65+: ' + (gr.old / gr.tot * 100).toFixed(1), 'Dependency ratio: ' + ((gr.young + gr.old) / gr.work * 100).toFixed(1), 'OASR 2.4 = 2.4 citizens aged 20–64 per citizen aged 65+']);
      h += '<h4>Briefing 3 · Causes</h4>' + k.sortBins.map(function (b) { return '<p><b>' + b[1] + ':</b> ' + k.CAUSES.filter(function (c) { return c.a === b[0]; }).map(function (c) { return esc(c.t); }).join('; ') + '</p>'; }).join('');
      h += '<h4>Briefing 4 · Issues</h4>' + k.issueBins.map(function (b) { return '<p><b>' + b[1] + ':</b> ' + k.ISSUES.filter(function (c) { return c.a === b[0]; }).map(function (c) { return esc(c.t); }).join('; ') + '</p>'; }).join('');
      h += '<h4>Briefing 5 · Policies</h4>' + li(k.POLICIES.map(function (p) { return '<b>' + p.id + '</b> (' + esc(p.types.join(', ')) + '): ' + esc(p.o[p.a]) + '. ' + esc(p.why); }));
      h += '<h4>Briefing 6 · Decision cards</h4>' + li(k.DECIDE.cards.map(function (p) { return '<b>' + esc(p.name) + '</b> (cost ' + p.cost + '): ' + esc(p.note); }));
    });
    return h + '<p class="muted">Open answers are marked by the teacher. Model answers appear to students only after they write their own.</p>';
  }
  function answerKey() {
    if (!IS_T) return;
    view = 'key';
    $('app').innerHTML = '<section class="panel key"><span class="kicker teal">Teacher answer key</span><h2>Population Policy Lab</h2>' + keyHtml() +
      '<button type="button" class="btn ghost" id="kBack" style="align-self:flex-start">← Back</button></section>';
    $('kBack').onclick = home; window.scrollTo(0, 0);
  }
  /* SBL teacher tools (shared bottom-left button, teacher accounts only) */
  window.SBL_TEACHER_ADAPTER = {
    key: function () { return '<h3>Population Policy Lab</h3>' + keyHtml(); },
    unlock: function (on) { S.unlock = !!on; save(); if (view === 'home') home(); else if (view === 'case' && C) caseHome(C.id); },
    unlockLabel: 'briefings'
  };

  hud(); home(); checkTeacher();
})();
</script>
<script defer src="/js/sbl-teacher-tools.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
