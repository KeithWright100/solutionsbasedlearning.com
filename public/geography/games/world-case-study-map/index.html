<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Case Study Map — IB Geography Learning Hub</title>
<meta name="description" content="Interactive world map of IB Geography case studies. Click a dot to explore Place, Processes, Power and Possibilities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f3a5c; --navy-line: rgba(255,255,255,0.14); --teal: #00b8b0; --teal-dark: #007c82;
    --cyan: #20d7e2; --gold: #f59e0b; --slate: #7c93a3; --white: #ffffff;
    --p-place: #22c55e; --p-processes: #3b82f6; --p-power: #f97316; --p-possibilities: #8b5cf6;
    --p-place-bg: #f0fdf4; --p-processes-bg: #eff6ff; --p-power-bg: #fff7ed; --p-possibilities-bg: #f5f3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', system-ui, sans-serif; color: #0b1f2e;
    background: linear-gradient(180deg, #f4f8fa 0%, #eef3f6 100%);
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  a { color: inherit; }
  button:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .topbar {
    background: var(--navy); color: #fff; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .back-link { text-decoration: none; font-weight: 700; font-size: 0.88rem; color: #cfe3ee; display: inline-flex; align-items: center; gap: 6px; }
  .back-link:hover { color: var(--cyan); }
  .brand { font-weight: 900; font-size: 1rem; }
  .brand span { color: var(--teal); }

  .hero { max-width: 980px; margin: 0 auto; padding: 34px 20px 10px; text-align: center; }
  .hero h1 { font-size: clamp(1.5rem, 3.2vw, 2.1rem); color: var(--navy); margin: 0 0 10px; }
  .hero p { color: #4a5f6c; font-size: 0.98rem; line-height: 1.55; max-width: 680px; margin: 0 auto; }

  .legend-bar {
    max-width: 1080px; margin: 18px auto 0; padding: 0 20px;
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
  }
  .legend-chip {
    display: inline-flex; align-items: center; gap: 7px; background: #fff; border: 1px solid #dde6ea;
    border-radius: 999px; padding: 6px 13px; font-size: 0.8rem; font-weight: 700; color: #33495a;
  }
  .legend-dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }

  .map-wrap {
    max-width: 1080px; margin: 18px auto 46px; padding: 0 20px;
  }
  .map-card {
    background: #eaf4fa; border: 1px solid #d7e6ee; border-radius: 18px; padding: 10px;
    box-shadow: 0 18px 40px -22px rgba(15,58,92,0.35);
  }
  #mapSvg { width: 100%; height: auto; display: block; }
  .sea { fill: #cfe7f2; }
  .land { fill: #ffffff; stroke: #b7cdd9; stroke-width: 0.6; }
  .graticule { fill: none; stroke: #d7e6ee; stroke-width: 0.4; }

  .study-dot { cursor: pointer; }
  .study-dot circle.pulse { fill: none; opacity: 0.55; }
  .study-dot circle.core { stroke: #fff; stroke-width: 1.6; }
  .study-dot:hover circle.core, .study-dot:focus circle.core { filter: brightness(1.12); }
  .study-dot text {
    font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px; fill: #0f3a5c;
    paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round;
    pointer-events: none;
  }
  @keyframes dotPulse {
    0% { r: 7; opacity: 0.55; }
    70% { r: 19; opacity: 0; }
    100% { r: 19; opacity: 0; }
  }
  .pulse { animation: dotPulse 2.2s ease-out infinite; }

  .map-hint { text-align: center; font-size: 0.82rem; color: #607786; margin-top: 10px; }

  .status-note { text-align: center; color: #607786; font-size: 0.85rem; padding: 40px 10px; }

  /* ---- Modal ---- */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(8,24,37,0.55); backdrop-filter: blur(2px);
    z-index: 1000; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .study-modal {
    background: #fff; border-radius: 18px; max-width: 760px; width: 100%; max-height: 90vh; overflow-y: auto;
    padding: 0; box-shadow: 0 30px 70px -20px rgba(0,0,0,0.45);
  }
  .study-modal__head {
    background: var(--navy); color: #fff; padding: 22px 26px; border-radius: 18px 18px 0 0;
    position: sticky; top: 0; z-index: 2;
  }
  .study-modal__eyebrow { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--cyan); margin: 0 0 4px; }
  .study-modal__title { font-size: 1.3rem; margin: 0 0 4px; }
  .study-modal__paper { font-size: 0.82rem; color: #cfe3ee; margin: 0; }
  .study-modal__close {
    position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.12); border: none;
    color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; line-height: 1;
  }
  .study-modal__close:hover { background: rgba(255,255,255,0.24); }

  .study-modal__body { padding: 20px 22px 26px; }


  .ps-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  @media (max-width: 560px) { .ps-grid { grid-template-columns: 1fr; } }
  .ps-box { border-radius: 12px; padding: 14px 15px; border: 1px solid transparent; }
  .ps-box h3 {
    margin: 0 0 8px; font-size: 0.86rem; display: flex; align-items: center; gap: 8px; letter-spacing: 0.01em;
  }
  .ps-swatch { width: 13px; height: 13px; border-radius: 4px; flex: none; }
  .ps-box ul { margin: 0; padding-left: 18px; }
  .ps-box li { font-size: 0.85rem; line-height: 1.5; margin-bottom: 6px; color: #243641; }
  .ps-box li:last-child { margin-bottom: 0; }

  .ps-place { background: var(--p-place-bg); border-color: #bbf0cf; }
  .ps-place h3 { color: #15803d; }
  .ps-place .ps-swatch { background: var(--p-place); }

  .ps-processes { background: var(--p-processes-bg); border-color: #bfdbfe; }
  .ps-processes h3 { color: #1d4ed8; }
  .ps-processes .ps-swatch { background: var(--p-processes); }

  .ps-power { background: var(--p-power-bg); border-color: #fed7aa; }
  .ps-power h3 { color: #c2410c; }
  .ps-power .ps-swatch { background: var(--p-power); }

  .ps-possibilities { background: var(--p-possibilities-bg); border-color: #ddd6fe; }
  .ps-possibilities h3 { color: #6d28d9; }
  .ps-possibilities .ps-swatch { background: var(--p-possibilities); }

</style>
</head>

// ---- Legend ----
(function buildLegend() {
  var bar = document.getElementById('legendBar');
  Object.keys(TOPICS).forEach(function (key) {
    var t = TOPICS[key];
    var chip = document.createElement('span');
    chip.className = 'legend-chip';
    chip.innerHTML = '<span class="legend-dot" style="background:' + t.color + '"></span>' + t.label;
    bar.appendChild(chip);
  });
})();

// ---- Map (static pre-rendered world outline + a small vanilla-JS equirectangular
//      projection, matched to the same projection used to build that outline, so
//      everything below is self-contained and needs no external map library or
//      internet connection to draw). ----
var PROJ_SCALE = 149.60564650638162;
var PROJ_TRANSLATE = [480, 250];
function projectPoint(lonLat) {
  var lon = lonLat[0], lat = lonLat[1];
  var x = PROJ_TRANSLATE[0] + PROJ_SCALE * (lon * Math.PI / 180);
  var y = PROJ_TRANSLATE[1] - PROJ_SCALE * (lat * Math.PI / 180);
  return [x, y];
}

var dotsGroup = document.getElementById('dotsGroup');
var svgNS = 'http://www.w3.org/2000/svg';

function el(tag, attrs) {
  var e = document.createElementNS(svgNS, tag);
  for (var k in attrs) { e.setAttribute(k, attrs[k]); }
  return e;
}

function drawDots() {
  CASE_STUDIES.forEach(function (d) {
    var xy = projectPoint(d.coords);
    var g = el('g', {
      'class': 'study-dot',
      'tabindex': '0',
      'role': 'button',
      'aria-label': 'Open case study: ' + d.title,
      'transform': 'translate(' + xy[0] + ',' + xy[1] + ')'
    });
    g.appendChild(el('circle', { 'class': 'pulse', r: 7, stroke: TOPICS[d.topic].color, 'stroke-width': 2 }));
    g.appendChild(el('circle', { 'class': 'core', r: 7, fill: TOPICS[d.topic].color }));
    var text = el('text', { y: -13, 'text-anchor': 'middle' });
    text.textContent = d.label;
    g.appendChild(text);

    g.addEventListener('click', function () { openStudy(d); });
    g.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openStudy(d); }
    });

    dotsGroup.appendChild(g);
  });
}

drawDots();

// ---- Case study modal ----
var studyBackdrop = document.getElementById('studyBackdrop');
var lastFocused = null;

function fillList(ulId, items) {
  var ul = document.getElementById(ulId);
  ul.innerHTML = '';
  items.forEach(function (text) {
    var li = document.createElement('li');
    li.textContent = text;
    ul.appendChild(li);
  });
}

function openStudy(d) {
  lastFocused = document.activeElement;
  document.getElementById('studyEyebrow').textContent = TOPICS[d.topic].label + ' case study';
  document.getElementById('studyTitle').textContent = d.title;
  document.getElementById('studyPaper').textContent = d.paper;
  fillList('psPlace', d.place);
  fillList('psProcesses', d.processes);
  fillList('psPower', d.power);
  fillList('psPossibilities', d.possibilities);

  studyBackdrop.classList.add('open');
  document.getElementById('studyClose').focus();
  document.addEventListener('keydown', onStudyKeydown);
}

function closeStudy() {
  studyBackdrop.classList.remove('open');
  document.removeEventListener('keydown', onStudyKeydown);
  if (lastFocused) lastFocused.focus();
}

function onStudyKeydown(e) { if (e.key === 'Escape') closeStudy(); }

document.getElementById('studyClose').addEventListener('click', closeStudy);
studyBackdrop.addEventListener('click', function (e) { if (e.target === studyBackdrop) closeStudy(); });

</script>
