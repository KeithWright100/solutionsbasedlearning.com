<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Map Challenge — KS3 Geography Map Game — SBL</title>
<meta name="description" content="KS3 Geography map game: find and name the countries of the world, learn the continents, oceans and lines of latitude, and test yourself on capitals and flags. Three levels from famous countries to tiny islands." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f3a5c; --deep: #071a2c; --teal: #00b8b0; --teal-dark: #007c82; --cyan: #20d7e2;
    --ink: #062033; --muted: #4a6272; --line: rgba(5,43,65,0.13);
    --green: #16a34a; --green-soft: #e7f7ed; --red: #dc2626; --red-soft: #fdecec; --amber: #d97706; --amber-soft: #fff4dc;
    --gold: #f59e0b; --purple: #7c3aed;
    --sea: #cfe8f3; --land: #f3efe2; --land-hover: #ffe8a3; --border: #9aa9a6; --terr: #e6e3da;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--ink); min-height: 100vh;
    background: radial-gradient(circle at 10% 0%, rgba(0,184,176,0.14), transparent 40%), radial-gradient(circle at 100% 20%, rgba(245,158,11,0.12), transparent 35%), linear-gradient(180deg, #f4fbfc, #eef6f8); }
  a { color: inherit; text-decoration: none; }
  button, input { font-family: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .top-bar { padding: 14px 20px; color: #fff; background: linear-gradient(135deg, #011526, #02324e); }
  .top-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; font-weight: 700; color: rgba(255,255,255,0.85); }
  .back-link:hover { color: var(--cyan); }
  .brand { font-weight: 900; } .brand span { color: var(--teal); }

  .hud { position: sticky; top: 0; z-index: 50; background: rgba(7,26,44,0.96); color: #fff; padding: 8px 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
  .hud-inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; }
  .hud .xp { font-weight: 900; color: var(--gold); white-space: nowrap; }
  .hud .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .hud .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold)); transition: width .6s ease; }
  .hud .lv { font-size: 0.82rem; font-weight: 800; white-space: nowrap; color: rgba(255,255,255,0.85); }
  .hud .badges { font-size: 1.05rem; letter-spacing: 2px; white-space: nowrap; }
  .hud .badges .off { filter: grayscale(1); opacity: 0.3; }
  .xp-pop { position: fixed; z-index: 3000; font-weight: 900; color: var(--gold); font-size: 1.1rem; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,0.25); animation: xpPop 1.1s ease forwards; }
  @keyframes xpPop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-50px); } }

  main { max-width: 1200px; margin: 18px auto 60px; padding: 0 16px; }
  .hero { text-align: center; padding: 14px 10px 4px; }
  .kicker { display: inline-block; font-size: 0.74rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--teal), #0792a3); padding: 5px 12px; border-radius: 99px; margin-bottom: 10px; }
  h1 { font-size: clamp(1.6rem, 3.8vw, 2.5rem); font-weight: 900; color: var(--navy); line-height: 1.15; }
  .hero p { color: var(--muted); max-width: 720px; margin: 8px auto 0; line-height: 1.55; font-weight: 500; }

  .modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 14px; margin-top: 22px; }
  .mode { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: var(--radius); padding: 18px; cursor: pointer; color: var(--ink); box-shadow: 0 10px 24px rgba(5,43,65,0.07); transition: transform .15s, border-color .15s; display: flex; flex-direction: column; gap: 6px; }
  .mode:hover { transform: translateY(-3px); border-color: var(--teal); }
  .mode .emo { font-size: 2.1rem; }
  .mode b { font-size: 1.12rem; }
  .mode small { color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
  .mode .prog { margin-top: auto; padding-top: 8px; font-size: 0.8rem; font-weight: 800; color: var(--teal-dark); }

  .panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: 0 10px 24px rgba(5,43,65,0.06); margin-top: 18px; }
  .panel h2 { font-size: 1.3rem; color: var(--navy); font-weight: 900; }
  .panel .sub { color: var(--muted); margin-top: 4px; font-size: 0.92rem; line-height: 1.5; }
  .row-title { font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: var(--teal-dark); margin: 18px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 2px solid var(--line); background: #f8fbfc; border-radius: 99px; padding: 7px 14px; font-weight: 800; font-size: 0.88rem; cursor: pointer; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .lvcard { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 16px; padding: 14px; cursor: pointer; position: relative; color: var(--ink); box-shadow: 0 8px 20px rgba(5,43,65,0.06); transition: transform .15s, border-color .15s; }
  .lvcard:hover { transform: translateY(-3px); border-color: var(--teal); }
  .lvcard .num { display: block; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.07em; color: var(--teal-dark); text-transform: uppercase; padding-right: 60px; }
  .lvcard .emo { font-size: 1.7rem; display: block; margin: 4px 0; }
  .lvcard b { display: block; font-size: 1rem; line-height: 1.25; }
  .lvcard small { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 4px; line-height: 1.4; }
  .lvcard .stars { position: absolute; top: 12px; right: 12px; font-size: 0.95rem; letter-spacing: 1px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 850; font-size: 0.92rem; cursor: pointer; background: var(--navy); color: #fff; }
  .btn:hover { filter: brightness(1.1); }
  .btn.alt { background: #e9f1f4; color: var(--navy); }
  .btn.teal { background: var(--teal-dark); }
  .btn.gold { background: var(--gold); color: #3b2500; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* play */
  .play-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .crumb { font-size: 0.8rem; font-weight: 800; color: var(--muted); }
  .qbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; background: linear-gradient(135deg, var(--navy), #0b5576); color: #fff; border-radius: 16px; padding: 12px 16px; }
  .qbar .q { font-size: clamp(1.05rem, 2.6vw, 1.45rem); font-weight: 900; flex: 1 1 260px; line-height: 1.3; }
  .qbar .q em { font-style: normal; color: var(--gold); }
  .qbar .meta { display: flex; gap: 10px; font-size: 0.82rem; font-weight: 800; color: rgba(255,255,255,0.85); white-space: nowrap; }
  .tries { letter-spacing: 2px; }
  .answer-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .answer-row input { flex: 1 1 220px; font-size: 1.1rem; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); font-weight: 700; color: var(--ink); }
  .answer-row input:focus { border-color: var(--teal); outline: none; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-top: 10px; }
  .opt { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; font-weight: 800; font-size: 1rem; cursor: pointer; text-align: left; color: var(--ink); }
  .opt:hover:not(:disabled) { border-color: var(--teal); background: #f2fbfb; }
  .opt.ok { background: var(--green-soft); border-color: var(--green); }
  .opt.bad { background: var(--red-soft); border-color: var(--red); }
  .opt:disabled { cursor: default; }
  .flagbox { display: flex; align-items: center; justify-content: center; margin-top: 10px; }
  .flagbox img { height: 120px; max-width: 100%; border-radius: 6px; box-shadow: 0 6px 18px rgba(5,43,65,0.18); border: 1px solid var(--line); background: #fff; }
  .feedback { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; min-height: 50px; margin-top: 10px; padding: 8px 8px 8px 14px; border-radius: 12px; font-weight: 700; line-height: 1.45; font-size: 0.95rem; }
  .feedback.ok { background: var(--green-soft); color: #14532d; }
  .feedback.bad { background: var(--red-soft); color: #7f1d1d; }
  .feedback.idle { background: #f1f6f8; color: var(--muted); font-weight: 600; }
  .feedback .btn { flex: none; }
  .feedback.info { background: var(--amber-soft); color: #78350f; }

  .mapwrap { position: relative; margin-top: 12px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #e3eef3; height: min(62vh, 600px); touch-action: none; user-select: none; -webkit-user-select: none; }
  .mapwrap svg { width: 100%; height: 100%; display: block; cursor: grab; }
  .mapwrap svg.dragging { cursor: grabbing; }
  .sphere { fill: var(--sea); stroke: #a9cddd; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .grat { fill: none; stroke: #b8d7e4; stroke-width: 0.6; vector-effect: non-scaling-stroke; }
  .ctry { fill: var(--land); stroke: var(--border); stroke-width: 0.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .ctry.terr { fill: var(--terr); }
  .ctry.click:hover, .dot.click:hover { fill: var(--land-hover); }
  .ctry.dim, .dot.dim { fill: #ebe9e2; }
  .ctry.target { fill: var(--gold) !important; animation: pulse 1.2s ease-in-out infinite; }
  .ctry.got { fill: #86d39b; } .ctry.got2 { fill: #f6c66b; } .ctry.miss { fill: #f19a9a; }
  .ctry.flash { fill: #f87171 !important; }
  .ctry.cont-hi { fill: #9ad7d3; }
  @keyframes pulse { 50% { fill: #fbbf24; filter: brightness(1.15); } }
  .dot { fill: var(--land); stroke: #5b6d6a; vector-effect: non-scaling-stroke; stroke-width: 1; }
  .dot.target { fill: var(--gold) !important; stroke: #92400e; stroke-width: 2; }
  .dot.got { fill: #86d39b; } .dot.got2 { fill: #f6c66b; } .dot.miss { fill: #f19a9a; } .dot.flash { fill: #f87171 !important; }
  .ring { fill: none; stroke: #6b7f7c; stroke-width: 1; stroke-dasharray: 2 2; vector-effect: non-scaling-stroke; pointer-events: none; }
  .ring.target { stroke: #b45309; stroke-width: 2.5; stroke-dasharray: none; }
  .hit { fill: transparent; }
  .lat { stroke: #0b6e8a; stroke-width: 1.4; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; fill: none; }
  .lat.hi { stroke: var(--red); stroke-width: 3.5; stroke-dasharray: none; }
  .lat.ok { stroke: var(--green); stroke-width: 3.5; stroke-dasharray: none; }
  .lat-hit { stroke: transparent; fill: none; vector-effect: non-scaling-stroke; stroke-width: 22; cursor: pointer; }
  .lbl { font-weight: 900; fill: #0b2536; paint-order: stroke; stroke: #fff; stroke-linejoin: round; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
  .lbl.bad { fill: #991b1b; } .lbl.ok { fill: #14532d; } .lbl.sea { fill: #0b5f80; font-style: italic; }
  .star { fill: var(--red); stroke: #fff; vector-effect: non-scaling-stroke; stroke-width: 1.5; }
  .zoombar { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .zoombar button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 1.15rem; font-weight: 900; cursor: pointer; color: var(--navy); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
  .tip { position: absolute; left: 10px; bottom: 10px; z-index: 5; background: rgba(255,255,255,0.92); border-radius: 10px; padding: 6px 10px; font-size: 0.78rem; font-weight: 700; color: var(--muted); }
  .info-card { position: absolute; left: 10px; top: 10px; z-index: 6; background: #fff; border-radius: 14px; box-shadow: 0 10px 26px rgba(0,0,0,0.18); padding: 12px 14px; max-width: 270px; display: flex; gap: 12px; align-items: center; }
  .info-card img { width: 64px; border-radius: 4px; border: 1px solid var(--line); }
  .info-card b { display: block; font-size: 1rem; }
  .info-card span { font-size: 0.85rem; color: var(--muted); font-weight: 600; }

  .results { text-align: center; }
  .results .big { font-size: 3rem; margin: 6px 0; }
  .results .score { font-size: 1.6rem; font-weight: 900; color: var(--navy); }
  .review { margin: 14px auto 0; max-width: 640px; text-align: left; }
  .review h3 { font-size: 0.95rem; color: var(--navy); margin-bottom: 6px; }
  .review ul { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .review li { background: var(--red-soft); color: #7f1d1d; border-radius: 99px; padding: 4px 10px; font-size: 0.85rem; font-weight: 700; }
  .review li.ok { background: var(--green-soft); color: #14532d; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .teacher { margin-top: 26px; font-size: 0.86rem; color: var(--muted); line-height: 1.55; }
  .teacher b { color: var(--navy); }

  @media (max-width: 640px) {
    .hud-inner { grid-template-columns: auto 1fr auto; } .hud .badges { display: none; }
    .mapwrap { height: 58vh; }
    .panel { padding: 14px; }
    .flagbox img { height: 90px; }
  }
</style>
</head>

}

  curMap.cls(k, "flash");
  var nm = keyName(k), l = nm ? curMap.label(k, nm, "bad", 13) : null;
  setTimeout(function () { curMap.cls(k, "flash", false); if (l) l.remove(); }, 1500);
}
function onMapClick(k, p) {
  var q = R && R.q; if (!q || q.done) return;
  if (q.type === "find") {
    if (!k) { fb("That's the sea! Click on land.", "info"); return; }
    if (k === q.id) {
      q.done = true;
      var first = q.tries === q.maxTries, pts = first ? (q.hint ? 7 : 10) : (q.tries === q.maxTries - 1 ? 5 : 2);
      curMap.cls(k, first ? "got" : "got2"); curMap.label(k, C[k].name, "ok", 14);
      record(true, pts, C[k].name);
      fb("✅ Yes! That's <b>" + esc(C[k].name) + "</b>. Capital: " + esc(C[k].cap) + ".", "ok");
      R.timer = setTimeout(advance, 1300);
      return;
    }
    q.tries--; flashWrong(k);
    var nm = keyName(k);
    if (q.tries > 0) { fb("❌ That's " + (nm ? "<b>" + esc(nm) + "</b>" : "not it") + ". Try again!", "bad"); meta(); }
    else revealFind(nm);
  } else if (q.type === "contClick") {
    var ck = k === "643" ? (p.x > 1280 ? "AS" : "EU") : keyCont(k);
    if (!ck) { fb("That's the sea! Click on land.", "info"); return; }
    if (ck === q.k) {
      q.done = true; var pts2 = q.tries === q.maxTries ? 10 : 5;
      contHi(q.k, q.tries === q.maxTries ? "got" : "got2"); curMap.label(null, CONT[q.k].name, "ok", 17, CONT[q.k].pt);
      record(true, pts2, CONT[q.k].name);
      fb("✅ Correct! " + CONT[q.k].fact, "ok"); nextBtn();
    } else {
      q.tries--;
      contHi(ck, "flash"); var lb = curMap.label(null, CONT[ck].name, "bad", 16, CONT[ck].pt);
      setTimeout(function () { curMap.clearCls(["flash"]); lb.remove(); }, 1500);
      if (q.tries > 0) { fb("❌ That's <b>" + CONT[ck].name + "</b>. Try again!", "bad"); meta(); }
      else {
        q.done = true; contHi(q.k, "miss"); curMap.label(null, CONT[q.k].name, "bad", 17, CONT[q.k].pt);
        record(false, 0, CONT[q.k].name); fb("This is <b>" + CONT[q.k].name + "</b>. " + CONT[q.k].fact, "bad"); nextBtn();
      }
    }
  } else if (q.type === "lineClick") {
    var lk = curMap.nearestLine(p);
    if (!lk) { fb("Click exactly on one of the dashed lines.", "info"); return; }
    if (lk === q.k) {
      q.done = true; var pts3 = q.tries === q.maxTries ? 10 : 5;
      curMap.lineCls(lk, "ok"); record(true, pts3, LINES[lk].name);
      fb("✅ Correct! " + LINES[lk].fact, "ok"); nextBtn();
    } else {
      q.tries--; curMap.lineCls(lk, "hi");
      if (q.tries > 0) { fb("❌ That's the <b>" + LINES[lk].name + "</b>. Try again!", "bad"); meta(); }
      else { q.done = true; curMap.lineCls(q.k, "ok"); record(false, 0, LINES[q.k].name); fb("The <b>" + LINES[q.k].name + "</b> is shown in green. " + LINES[q.k].fact, "bad"); nextBtn(); }
    }
  }
}
function revealFind(lastName) {
  var q = R.q, c = C[q.id]; q.done = true;
  curMap.cls(q.id, "target"); curMap.zoomTo(q.id, 500);
  curMap.label(q.id, c.name, "", 15);
  record(false, 0, c.name);
  fb("Here is <b>" + esc(c.name) + "</b>, in " + CONT[c.cont].name + ". Capital: " + esc(c.cap) + ".", "bad");
  setTimeout(function () { curMap.cls(q.id, "target", false); curMap.cls(q.id, "miss"); }, 2600);
  nextBtn();
}
function checkName() {
  var q = R.q; if (q.done) return;
  var inp = $("#ans"), v = inp.value.trim(); if (!v) return;
  var m = matchCountry(v), c = C[q.id];
  if (m && m.id === q.id) {
    q.done = true;
    var first = q.tries === q.maxTries, pts = first ? (q.hint ? 7 : 10) : (q.tries === q.maxTries - 1 ? 5 : 2);
    curMap.cls(q.id, "target", false); curMap.cls(q.id, first ? "got" : "got2"); curMap.label(q.id, c.name, "ok", 15);
    record(true, pts, c.name);
    var spell = m.typo || norm(v) !== norm(c.name) ? (m.typo ? " Watch the spelling: <b>" + esc(c.name) + "</b>." : " Also known as <b>" + esc(c.name) + "</b>.") : "";
    fb("✅ Correct! It's <b>" + esc(c.name) + "</b>." + spell + " Capital: " + esc(c.cap) + ".", "ok");
    inp.disabled = true;
    R.timer = setTimeout(advance, m.typo ? 2200 : 1400);
    return;
  }
  q.tries--; inp.select();
  var msg = m ? "<b>" + esc(C[m.id].name) + "</b> is somewhere else." : "That doesn't match a country name. Check your spelling.";
  if (q.tries > 0) { fb("❌ " + msg + " Try again!", "bad"); meta(); }
  else revealName();
}
function revealName() {
  var q = R.q, c = C[q.id]; q.done = true;
  curMap.cls(q.id, "target", false); curMap.cls(q.id, "miss"); curMap.label(q.id, c.name, "bad", 15);
  var inp = $("#ans"); if (inp) inp.disabled = true;
  record(false, 0, c.name);
  fb("This is <b>" + esc(c.name) + "</b>, in " + CONT[c.cont].name + ". Capital: " + esc(c.cap) + ".", "bad");
  nextBtn();
}

function finish() {
  var n = R.results.length, max = n * 10, pct = max ? R.score / max : 0, stars = starsFor(pct);
  var prev = S.best[R.key];
  var countable = !R.marathon || n === R.qs.length;
  if (countable && (!prev || stars > prev.stars || (stars === prev.stars && R.score > prev.score))) S.best[R.key] = { stars: stars, score: R.score };
  var bonus = countable && n ? stars * 5 : 0;
  var newB = [];
  function award(b) { if (!S.badges[b]) { S.badges[b] = 1; newB.push(b); } }
  if (n) award("first");
  if (n >= 5 && R.score === max) award("perfect");
  if (countable && n && R.region !== "W" && stars >= 1) S.regionsDone[R.region] = 1;
  if (CONT_ORDER.every(function (r) { return S.regionsDone[r]; })) award("regions");
  if (R.mode === "cf" && R.lvl === "c3" && stars === 3) award("caps");
  if (R.mode === "cf" && R.lvl === "f3" && stars === 3) award("flags");
  if (R.marathon && R.region === "W" && n === R.qs.length) award("marathon");
  save();
  if (bonus) addXp(bonus); else hud();
  var got = R.results.filter(function (r) { return r.ok; }), miss = R.results.filter(function (r) { return !r.ok; });
  var emo = stars === 3 ? "🏆" : stars === 2 ? "🥈" : stars === 1 ? "👍" : "📚";
  var lvlOrder = { "1": "2", "2": "3", c1: "c2", c2: "c3", f1: "f2", f2: "f3", cont: "ocean", ocean: "lines", lines: "mix" };
  var nextKey = lvlOrder[R.lvl] ? R.mode + "|" + R.region + "|" + lvlOrder[R.lvl] : null;
  setScreen('<div class="panel results"><span class="crumb">' + esc(roundTitle()) + '</span><div class="big">' + emo + '</div>' +
    '<div class="score">' + R.score + " / " + max + ' points</div><div style="font-size:1.6rem;color:var(--gold);margin-top:4px">' + starStr(stars) + "</div>" +
    (R.marathon ? '<p class="sub">You answered ' + n + " of " + R.qs.length + " countries" + (n ? " and got " + got.length + " right" : "") + ".</p>" : "") +
    (bonus ? '<p class="sub">Star bonus: +' + bonus + " XP</p>" : "") +
    (newB.length ? '<p class="sub" style="margin-top:8px;font-weight:800;color:var(--navy)">New badge' + (newB.length > 1 ? "s" : "") + ": " + newB.map(function (b) { var x = BADGES.filter(function (z) { return z[0] === b; })[0]; return x[1] + " " + x[2]; }).join(", ") + "</p>" : "") +
    (miss.length ? '<div class="review"><h3>Revise these:</h3><ul>' + miss.map(function (r) { return "<li>" + esc(r.label) + "</li>"; }).join("") + "</ul></div>" : "") +
    (got.length && miss.length ? '<div class="review"><h3>You got these right:</h3><ul>' + got.map(function (r) { return '<li class="ok">' + esc(r.label) + "</li>"; }).join("") + "</ul></div>" : "") +
    '<div class="actions"><button class="btn" id="again">Play again</button>' + (nextKey ? '<button class="btn gold" id="nextLv">Next level →</button>' : "") +
    '<button class="btn alt" id="toSetup">Choose another level</button><button class="btn alt" id="toHome">All modes</button></div></div>');
  var key = R.key, mode = R.mode;
  $("#again").onclick = function () { start(key); };
  if (nextKey) $("#nextLv").onclick = function () { start(nextKey); };
  $("#toSetup").onclick = function () { setup(mode); };
  $("#toHome").onclick = home;
}

// ---------- explore ----------
function explore() {
  R = null;
  setScreen('<div class="panel"><div class="play-head"><div><span class="crumb">World Map Challenge</span><h2>🔍 Explore the map</h2><p class="sub">Click any country to learn about it, or search for one.</p></div><button class="btn alt" id="backHome">← All modes</button></div>' +
    '<form class="answer-row" id="srch" autocomplete="off"><input id="sq" type="text" placeholder="Search for a country…" aria-label="Search for a country" list="clist"><datalist id="clist">' +
    ALL.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (c) { return '<option value="' + esc(c.name) + '">'; }).join("") +
    '</datalist><button class="btn teal" type="submit">Find</button></form><div class="chips" style="margin-top:10px">' +
    REGIONS.map(function (r) { return '<button class="chip" data-zr="' + r[0] + '">' + r[1] + "</button>"; }).join("") +
    '</div><div id="fb"></div><div id="mapHost"></div></div>');
  $("#backHome").onclick = home;
  curMap = makeMap($("#mapHost"), {});
  curMap.clickable(true);
  function show(k) {
    curMap.clearCls(["target"]); curMap.clearLabels();
    if (!k) { curMap.overlay(""); return; }
    if (k.charAt(0) === "t") { curMap.overlay("<div><b>" + esc(keyName(k)) + "</b><span>A territory, not an independent country.</span></div>"); return; }
    var c = C[k]; if (!c) return;
    curMap.cls(k, "target"); curMap.label(k, c.name, "", 15);
    if (k === "010") { curMap.overlay("<div><b>Antarctica</b><span>" + CONT.AN.fact + "</span></div>"); return; }
    curMap.overlay('<img alt="Flag of ' + esc(c.name) + '" src="' + flagUrl(c.iso, 160) + '"><div><b>' + esc(c.name) + "</b><span>Capital: " + esc(c.cap) + "<br>Continent: " + CONT[c.cont].name + "</span></div>");
  }
  curMap.onClick(function (k) { show(k); });
  $("#srch").onsubmit = function (e) {
    e.preventDefault(); var m = matchCountry($("#sq").value);
    if (!m) { fb("No country found with that name. Check the spelling.", "info"); return; }
    $("#fb").innerHTML = ""; show(m.id); curMap.zoomTo(m.id, 500);
  };
  app.querySelectorAll("[data-zr]").forEach(function (b) { b.onclick = function () { var r = b.getAttribute("data-zr"); curMap.fit(r === "W" ? WORLD_BOX : CONT[r].box, true); }; });
}

if (DEBUG) window.__wm = { C: C, matchCountry: matchCountry, R: function () { return R; }, start: start, S: S };
hud();
home();
})();
</script>
