<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Map Challenge — KS3 Geography Map Game — SBL</title>
<meta name="description" content="KS3 Geography map game: find and name the countries of the world, learn the continents, oceans and lines of latitude, find mountains, rivers, lakes, deserts and seas, and test yourself on capitals and flags. Three levels from famous countries to tiny islands." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f3a5c; --deep: #071a2c; --teal: #00b8b0; --teal-dark: #007c82; --cyan: #20d7e2;
    --ink: #062033; --muted: #4a6272; --line: rgba(5,43,65,0.13);
    --green: #16a34a; --green-soft: #e7f7ed; --red: #dc2626; --red-soft: #fdecec; --amber: #d97706; --amber-soft: #fff4dc;
    --gold: #f59e0b; --purple: #7c3aed;
    --sea: #cfe8f3; --land: #f3efe2; --land-hover: #ffe8a3; --border: #9aa9a6; --terr: #e6e3da;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--ink); min-height: 100vh;
    background: radial-gradient(circle at 10% 0%, rgba(0,184,176,0.14), transparent 40%), radial-gradient(circle at 100% 20%, rgba(245,158,11,0.12), transparent 35%), linear-gradient(180deg, #f4fbfc, #eef6f8); }
  a { color: inherit; text-decoration: none; }
  button, input { font-family: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .top-bar { padding: 14px 20px; color: #fff; background: linear-gradient(135deg, #011526, #02324e); }
  .top-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; font-weight: 700; color: rgba(255,255,255,0.85); }
  .back-link:hover { color: var(--cyan); }
  .brand { font-weight: 900; } .brand span { color: var(--teal); }

  .hud { position: sticky; top: 0; z-index: 50; background: rgba(7,26,44,0.96); color: #fff; padding: 8px 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
  .hud-inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; }
  .hud .xp { font-weight: 900; color: var(--gold); white-space: nowrap; }
  .hud .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .hud .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold)); transition: width .6s ease; }
  .hud .lv { font-size: 0.82rem; font-weight: 800; white-space: nowrap; color: rgba(255,255,255,0.85); }
  .hud .badges { font-size: 1.05rem; letter-spacing: 2px; white-space: nowrap; }
  .hud .badges .off { filter: grayscale(1); opacity: 0.3; }
  .xp-pop { position: fixed; z-index: 3000; font-weight: 900; color: var(--gold); font-size: 1.1rem; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,0.25); animation: xpPop 1.1s ease forwards; }
  @keyframes xpPop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-50px); } }

  main { max-width: 1200px; margin: 18px auto 60px; padding: 0 16px; }
  .hero { text-align: center; padding: 14px 10px 4px; }
  .kicker { display: inline-block; font-size: 0.74rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--teal), #0792a3); padding: 5px 12px; border-radius: 99px; margin-bottom: 10px; }
  h1 { font-size: clamp(1.6rem, 3.8vw, 2.5rem); font-weight: 900; color: var(--navy); line-height: 1.15; }
  .hero p { color: var(--muted); max-width: 720px; margin: 8px auto 0; line-height: 1.55; font-weight: 500; }

  .modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 22px; }
  .mode { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: var(--radius); padding: 18px; cursor: pointer; color: var(--ink); box-shadow: 0 10px 24px rgba(5,43,65,0.07); transition: transform .15s, border-color .15s; display: flex; flex-direction: column; gap: 6px; }
  .mode:hover { transform: translateY(-3px); border-color: var(--teal); }
  .mode .emo { font-size: 2.1rem; }
  .mode b { font-size: 1.12rem; }
  .mode small { color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
  .mode .prog { margin-top: auto; padding-top: 8px; font-size: 0.8rem; font-weight: 800; color: var(--teal-dark); }

  .panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: 0 10px 24px rgba(5,43,65,0.06); margin-top: 18px; }
  .panel h2 { font-size: 1.3rem; color: var(--navy); font-weight: 900; }
  .panel .sub { color: var(--muted); margin-top: 4px; font-size: 0.92rem; line-height: 1.5; }
  .row-title { font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: var(--teal-dark); margin: 18px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 2px solid var(--line); background: #f8fbfc; border-radius: 99px; padding: 7px 14px; font-weight: 800; font-size: 0.88rem; cursor: pointer; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .lvcard { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 16px; padding: 14px; cursor: pointer; position: relative; color: var(--ink); box-shadow: 0 8px 20px rgba(5,43,65,0.06); transition: transform .15s, border-color .15s; }
  .lvcard:hover { transform: translateY(-3px); border-color: var(--teal); }
  .lvcard .num { display: block; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.07em; color: var(--teal-dark); text-transform: uppercase; padding-right: 60px; }
  .lvcard .emo { font-size: 1.7rem; display: block; margin: 4px 0; }
  .lvcard b { display: block; font-size: 1rem; line-height: 1.25; }
  .lvcard small { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 4px; line-height: 1.4; }
  .lvcard .stars { position: absolute; top: 12px; right: 12px; font-size: 0.95rem; letter-spacing: 1px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 850; font-size: 0.92rem; cursor: pointer; background: var(--navy); color: #fff; }
  .btn:hover { filter: brightness(1.1); }
  .btn.alt { background: #e9f1f4; color: var(--navy); }
  .btn.teal { background: var(--teal-dark); }
  .btn.gold { background: var(--gold); color: #3b2500; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* play */
  .play-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .crumb { font-size: 0.8rem; font-weight: 800; color: var(--muted); }
  .qbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; background: linear-gradient(135deg, var(--navy), #0b5576); color: #fff; border-radius: 16px; padding: 12px 16px; }
  .qbar .q { font-size: clamp(1.05rem, 2.6vw, 1.45rem); font-weight: 900; flex: 1 1 260px; line-height: 1.3; }
  .qbar .q em { font-style: normal; color: var(--gold); }
  .qbar .meta { display: flex; gap: 10px; font-size: 0.82rem; font-weight: 800; color: rgba(255,255,255,0.85); white-space: nowrap; }
  .tries { letter-spacing: 2px; }
  .answer-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .answer-row input { flex: 1 1 220px; font-size: 1.1rem; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); font-weight: 700; color: var(--ink); }
  .answer-row input:focus { border-color: var(--teal); outline: none; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-top: 10px; }
  .opt { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; font-weight: 800; font-size: 1rem; cursor: pointer; text-align: left; color: var(--ink); }
  .opt:hover:not(:disabled) { border-color: var(--teal); background: #f2fbfb; }
  .opt.ok { background: var(--green-soft); border-color: var(--green); }
  .opt.bad { background: var(--red-soft); border-color: var(--red); }
  .opt:disabled { cursor: default; }
  .flagbox { display: flex; align-items: center; justify-content: center; margin-top: 10px; }
  .flagbox img { height: 120px; max-width: 100%; border-radius: 6px; box-shadow: 0 6px 18px rgba(5,43,65,0.18); border: 1px solid var(--line); background: #fff; }
  .feedback { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; min-height: 50px; margin-top: 10px; padding: 8px 8px 8px 14px; border-radius: 12px; font-weight: 700; line-height: 1.45; font-size: 0.95rem; }
  .feedback.ok { background: var(--green-soft); color: #14532d; }
  .feedback.bad { background: var(--red-soft); color: #7f1d1d; }
  .feedback.idle { background: #f1f6f8; color: var(--muted); font-weight: 600; }
  .feedback .btn { flex: none; }
  .feedback.info { background: var(--amber-soft); color: #78350f; }

  .mapwrap { position: relative; margin-top: 12px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #e3eef3; height: min(62vh, 600px); touch-action: none; user-select: none; -webkit-user-select: none; }
  .mapwrap svg { width: 100%; height: 100%; display: block; cursor: grab; }
  .mapwrap svg.dragging { cursor: grabbing; }
  .sphere { fill: var(--sea); stroke: #a9cddd; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .grat { fill: none; stroke: #b8d7e4; stroke-width: 0.6; vector-effect: non-scaling-stroke; }
  .ctry { fill: var(--land); stroke: var(--border); stroke-width: 0.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .ctry.terr { fill: var(--terr); }
  .ctry.click:hover, .dot.click:hover { fill: var(--land-hover); }
  .ctry.dim, .dot.dim { fill: #ebe9e2; }
  .ctry.target { fill: var(--gold) !important; animation: pulse 1.2s ease-in-out infinite; }
  .ctry.got { fill: #86d39b; } .ctry.got2 { fill: #f6c66b; } .ctry.miss { fill: #f19a9a; }
  .ctry.flash { fill: #f87171 !important; }
  .ctry.cont-hi { fill: #9ad7d3; }
  @keyframes pulse { 50% { fill: #fbbf24; filter: brightness(1.15); } }
  .dot { fill: var(--land); stroke: #5b6d6a; vector-effect: non-scaling-stroke; stroke-width: 1; }
  .dot.target { fill: var(--gold) !important; stroke: #92400e; stroke-width: 2; }
  .dot.got { fill: #86d39b; } .dot.got2 { fill: #f6c66b; } .dot.miss { fill: #f19a9a; } .dot.flash { fill: #f87171 !important; }
  .ring { fill: none; stroke: #6b7f7c; stroke-width: 1; stroke-dasharray: 2 2; vector-effect: non-scaling-stroke; pointer-events: none; }
  .ring.target { stroke: #b45309; stroke-width: 2.5; stroke-dasharray: none; }
  .hit { fill: transparent; }
  .lat { stroke: #0b6e8a; stroke-width: 1.4; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; fill: none; }
  .lat.hi { stroke: var(--red); stroke-width: 3.5; stroke-dasharray: none; }
  .lat.ok { stroke: var(--green); stroke-width: 3.5; stroke-dasharray: none; }
  .lat-hit { stroke: transparent; fill: none; vector-effect: non-scaling-stroke; stroke-width: 22; cursor: pointer; }
  .lbl { font-weight: 900; fill: #0b2536; paint-order: stroke; stroke: #fff; stroke-linejoin: round; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
  .lbl.bad { fill: #991b1b; } .lbl.ok { fill: #14532d; } .lbl.sea { fill: #0b5f80; font-style: italic; }
  .star { fill: var(--red); stroke: #fff; vector-effect: non-scaling-stroke; stroke-width: 1.5; }
  .zoombar { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .zoombar button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 1.15rem; font-weight: 900; cursor: pointer; color: var(--navy); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
  .tip { position: absolute; left: 10px; bottom: 10px; z-index: 5; background: rgba(255,255,255,0.92); border-radius: 10px; padding: 6px 10px; font-size: 0.78rem; font-weight: 700; color: var(--muted); }
  .info-card { position: absolute; left: 10px; top: 10px; z-index: 6; background: #fff; border-radius: 14px; box-shadow: 0 10px 26px rgba(0,0,0,0.18); padding: 12px 14px; max-width: 270px; display: flex; gap: 12px; align-items: center; }
  .info-card img { width: 64px; border-radius: 4px; border: 1px solid var(--line); }
  .info-card b { display: block; font-size: 1rem; }
  .info-card span { font-size: 0.85rem; color: var(--muted); font-weight: 600; }


  /* physical features */
  .ctry.plain { fill: #eef1e6; stroke: #c9d0c4; stroke-width: 0.5; }
  .pf { vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .pf-sea { fill: rgba(30,110,170,0.12); stroke: rgba(30,110,170,0.45); stroke-width: 1; stroke-dasharray: 4 3; }
  .pf-mtn { fill: rgba(140,98,57,0.6); stroke: #6f5137; stroke-width: 0.8; }
  .pf-desert { fill: rgba(236,178,70,0.6); stroke: #b9822a; stroke-width: 0.8; }
  .pf-forest { fill: rgba(46,139,87,0.5); stroke: #2e7d4f; stroke-width: 0.8; }
  .pf-land { fill: rgba(170,140,100,0.35); stroke: #8d7049; stroke-width: 0.8; stroke-dasharray: 3 2; }
  .pf-isl { fill: rgba(255,255,255,0.01); stroke: #55706b; stroke-width: 1.2; stroke-dasharray: 3 2; }
  .pf-lak { fill: #6cb4dd; stroke: #2b7bb9; stroke-width: 0.8; }
  .pf-riv { fill: none; stroke: #2b7bb9; stroke-width: 2; stroke-linecap: round; }
  .rhit { fill: none; stroke: transparent; stroke-width: 14; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
  .pf.click { cursor: pointer; } .pf.click:hover { filter: brightness(1.12) saturate(1.3); }
  .dot.peak { fill: #7c4a1e; stroke: #fff; stroke-width: 1.6; }
  .pf.target { fill: rgba(239,68,68,0.6) !important; stroke: #b91c1c !important; stroke-width: 2.5 !important; stroke-dasharray: none !important; }
  .pf.got { fill: rgba(34,197,94,0.55) !important; stroke: #15803d !important; stroke-width: 2 !important; stroke-dasharray: none !important; }
  .pf.got2 { fill: rgba(250,204,21,0.6) !important; stroke: #a16207 !important; stroke-width: 2 !important; stroke-dasharray: none !important; }
  .pf.miss { fill: rgba(248,113,113,0.5) !important; stroke: #b91c1c !important; stroke-width: 2 !important; stroke-dasharray: none !important; }
  .pf.flash { fill: rgba(248,113,113,0.8) !important; stroke: #dc2626 !important; stroke-width: 2.5 !important; }
  .pf-riv.target, .pf-riv.got, .pf-riv.got2, .pf-riv.miss, .pf-riv.flash { fill: none !important; stroke-width: 4.5 !important; }
  .pf-riv.target { stroke: #ef4444 !important; } .pf-riv.got { stroke: #16a34a !important; } .pf-riv.got2 { stroke: #ca8a04 !important; } .pf-riv.miss, .pf-riv.flash { stroke: #dc2626 !important; }

  .results { text-align: center; }
  .results .big { font-size: 3rem; margin: 6px 0; }
  .results .score { font-size: 1.6rem; font-weight: 900; color: var(--navy); }
  .review { margin: 14px auto 0; max-width: 640px; text-align: left; }
  .review h3 { font-size: 0.95rem; color: var(--navy); margin-bottom: 6px; }
  .review ul { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .review li { background: var(--red-soft); color: #7f1d1d; border-radius: 99px; padding: 4px 10px; font-size: 0.85rem; font-weight: 700; }
  .review li.ok { background: var(--green-soft); color: #14532d; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .teacher { margin-top: 26px; font-size: 0.86rem; color: var(--muted); line-height: 1.55; }
  .teacher b { color: var(--navy); }

  @media (max-width: 640px) {
    .hud-inner { grid-template-columns: auto 1fr auto; } .hud .badges { display: none; }
    .mapwrap { height: 58vh; }
    .panel { padding: 14px; }
    .flagbox img { height: 90px; }
  }
</style>
</head>

ning down Norway and Sweden. Glaciers carved Norway's famous fjords here.","carpathians":"A curved mountain range in central and eastern Europe, mostly in Romania, Ukraine, Slovakia and Poland.","ethhigh":"A high plateau in Ethiopia. The Blue Nile starts here, at Lake Tana.","drakensberg":"The highest mountains in southern Africa, along the border of South Africa and Lesotho.","southernalps":"Snow-capped mountains running down New Zealand's South Island, formed on a plate boundary.","apennines":"The mountain 'backbone' of Italy, running down the length of the country.","zagros":"A long mountain range in Iran and Iraq, formed as the Arabian plate pushes into Eurasia.","tianshan":"The 'Heavenly Mountains' of Central Asia, in China, Kyrgyzstan and Kazakhstan.","hindukush":"High mountains in Afghanistan and Pakistan, to the west of the Himalayas.","karakoram":"A very high range in Pakistan, India and China. K2, the world's second highest mountain, is here.","wghats":"Mountains along India's west coast. They force monsoon winds to rise, giving very heavy rainfall.","sierramadre":"A mountain range running down western Mexico.","transant":"A huge mountain range that crosses Antarctica, dividing East and West Antarctica.","annamite":"Mountains along the border of Vietnam and Laos in South-East Asia.","sahara":"The largest hot desert in the world, covering much of North Africa. It is about the size of the USA.","gobi":"A cold desert in Mongolia and China. Winters there can drop below -40°C.","amazonrf":"The largest tropical rainforest in the world, mostly in Brazil. It is home to around 10% of all known species.","kalahari":"A large, sandy semi-desert in Botswana, Namibia and South Africa.","namib":"A coastal desert in Namibia, possibly the oldest desert on Earth, with some of the tallest sand dunes.","arabian":"The Rub' al Khali ('Empty Quarter') is one of the largest sand deserts in the world, in Saudi Arabia, Oman, UAE and Yemen.","atacama":"A desert in Chile and one of the driest places on Earth. Some weather stations have never recorded rain.","thar":"The 'Great Indian Desert', on the border of India and Pakistan.","congorf":"The world's second largest tropical rainforest, in Central Africa around the Congo River.","tibet":"The highest and largest plateau on Earth, often called 'the Roof of the World'. Many great Asian rivers start here.","greatplains":"Huge, flat grasslands in the middle of North America, now used for farming wheat and cattle.","sahel":"A semi-arid strip of land just south of the Sahara, stretching right across Africa. It is at risk of desertification.","gvictoria":"The largest desert in Australia.","gsandy":"A large desert in north-western Australia.","taklimakan":"A large sandy desert in western China, surrounded by high mountains.","sonoran":"A hot desert in the south-west USA and north-west Mexico, famous for its giant saguaro cacti.","syrian":"A desert covering parts of Syria, Jordan, Iraq and Saudi Arabia.","patagonia":"A wild, windy region at the southern tip of South America, in Argentina and Chile.","pampas":"Fertile grassy plains in Argentina and Uruguay, used for farming cattle and crops.","deccan":"A large plateau covering most of central and southern India.","rift":"A long valley in East Africa where the African plate is slowly splitting apart.","siberia":"A huge region of northern Russia, famous for its very cold winters, forests and permafrost.","nile":"The longest river in the world (about 6,650 km). It flows north through Africa into the Mediterranean Sea.","amazon":"The river that carries the most water in the world. It flows east across South America into the Atlantic Ocean.","mississippi":"The main river of the USA, flowing south into the Gulf of Mexico.","yangtze":"The longest river in Asia, flowing across China. The huge Three Gorges Dam was built on it.","thames":"The river that flows through London and out into the North Sea.","mekong":"A great river of South-East Asia, flowing through China, Myanmar, Laos, Thailand, Cambodia and Vietnam.","ganges":"A sacred river in India and Bangladesh. Its delta is one of the largest in the world.","danube":"Europe's second longest river. It flows through more countries than any other river in the world (10).","rhine":"A busy European river flowing from the Swiss Alps through Germany to the North Sea in the Netherlands.","congo":"The deepest river in the world, crossing the Equator twice on its way to the Atlantic.","niger":"The main river of West Africa. It flows in a big curve through Mali, Niger and Nigeria.","zambezi":"A river in southern Africa, famous for Victoria Falls on the border of Zambia and Zimbabwe.","volga":"Europe's longest river, flowing through Russia into the Caspian Sea.","indus":"A long river flowing mainly through Pakistan into the Arabian Sea. An ancient civilisation grew up beside it.","missouri":"The longest river in North America, joining the Mississippi near St Louis.","murray":"Australia's longest river, in the south-east of the country.","huang":"China's second longest river. Its yellow colour comes from the huge amount of silt it carries.","brahmaputra":"A large river flowing from Tibet through India and Bangladesh, joining the Ganges.","tigris":"One of the two rivers of ancient Mesopotamia, flowing through Turkey and Iraq.","euphrates":"The longest river in western Asia, flowing through Turkey, Syria and Iraq.","orinoco":"A major river of Venezuela in northern South America.","parana":"A large river in South America, flowing through Brazil, Paraguay and Argentina.","riogrande":"A river forming part of the border between the USA and Mexico.","mackenzie":"Canada's longest river, flowing north into the Arctic Ocean.","yukon":"A long river flowing through Canada and Alaska into the Bering Sea.","ob":"A huge Siberian river in Russia that flows north into the Arctic Ocean.","lena":"A great Siberian river that flows north into the Arctic Ocean.","yenisey":"One of the largest rivers flowing into the Arctic Ocean, through Mongolia and Russia.","irrawaddy":"The main river of Myanmar, flowing south into the Andaman Sea.","seine":"The river that flows through Paris, France.","rhone":"A river flowing from the Swiss Alps through France to the Mediterranean.","orange":"The longest river in South Africa, flowing west to the Atlantic.","limpopo":"A river in southern Africa, forming part of the border of South Africa, Botswana and Zimbabwe.","jordan":"A short but important river flowing into the Dead Sea.","victoria":"Africa's largest lake, shared by Uganda, Kenya and Tanzania. It is a source of the River Nile.","caspian":"The largest lake in the world by area. It is salty, so it is called a sea.","superior":"The largest of the Great Lakes, on the border of the USA and Canada. The largest freshwater lake by area.","baikal":"The deepest and oldest lake in the world, in Siberia. It holds about a fifth of the world's unfrozen fresh water.","michigan":"One of the five Great Lakes, and the only one entirely inside the USA.","huron":"One of the five Great Lakes, between the USA and Canada.","erie":"The shallowest of the Great Lakes, on the USA–Canada border.","ontario":"The smallest Great Lake. Water from it flows into the St Lawrence River and the Atlantic.","tanganyika":"A long, very deep lake in Africa's Great Rift Valley. It is the second deepest lake in the world.","malawi":"A large lake in the Great Rift Valley, home to hundreds of kinds of colourful cichlid fish.","titicaca":"A lake high in the Andes, on the border of Peru and Bolivia. It is often called the highest navigable lake in the world.","chad":"A lake in Africa that has shrunk by about 90% since the 1960s because of drought and water use.","deadsea":"A very salty lake between Israel and Jordan. Its shore is the lowest land on Earth, over 400 m below sea level.","tonlesap":"The largest lake in South-East Asia, in Cambodia. It grows to about five times its size in the wet season.","aral":"Once one of the     (got.length && miss.length ? '<div class="review"><h3>You got these right:</h3><ul>' + got.map(function (r) { return '<li class="ok">' + esc(r.label) + "</li>"; }).join("") + "</ul></div>" : "") +
    '<div class="actions"><button class="btn" id="again">Play again</button>' + (nextKey ? '<button class="btn gold" id="nextLv">Next level →</button>' : "") +
    '<button class="btn alt" id="toSetup">Choose another level</button><button class="btn alt" id="toHome">All modes</button></div></div>');
  var key = R.key, mode = R.mode;
  $("#again").onclick = function () { start(key); };
  if (nextKey) $("#nextLv").onclick = function () { start(nextKey); };
  $("#toSetup").onclick = function () { setup(mode); };
  $("#toHome").onclick = home;
}

// ---------- explore ----------
var exploreLayer = "c";
function explore() {
  R = null;
  if (exploreLayer === "p") return explorePhys();
  setScreen('<div class="panel"><div class="play-head"><div><span class="crumb">World Map Challenge</span><h2>🔍 Explore the map</h2><p class="sub">Click any country to learn about it, or search for one.</p></div><button class="btn alt" id="backHome">← All modes</button></div>' +
    '<form class="answer-row" id="srch" autocomplete="off"><input id="sq" type="text" placeholder="Search for a country…" aria-label="Search for a country" list="clist"><datalist id="clist">' +
    ALL.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (c) { return '<option value="' + esc(c.name) + '">'; }).join("") +
    '</datalist><button class="btn teal" type="submit">Find</button></form><div class="chips" style="margin-top:10px">' +
    REGIONS.map(function (r) { return '<button class="chip" data-zr="' + r[0] + '">' + r[1] + "</button>"; }).join("") +
    '</div>' + layerChips() + '<div id="fb"></div><div id="mapHost"></div></div>');
  $("#backHome").onclick = home; bindLayer();
  curMap = makeMap($("#mapHost"), {});
  curMap.clickable(true);
  function show(k) {
    curMap.clearCls(["target"]); curMap.clearLabels();
    if (!k) { curMap.overlay(""); return; }
    if (k.charAt(0) === "t") { curMap.overlay("<div><b>" + esc(keyName(k)) + "</b><span>A territory, not an independent country.</span></div>"); return; }
    var c = C[k]; if (!c) return;
    curMap.cls(k, "target"); curMap.label(k, c.name, "", 15);
    if (k === "010") { curMap.overlay("<div><b>Antarctica</b><span>" + CONT.AN.fact + "</span></div>"); return; }
    curMap.overlay('<img alt="Flag of ' + esc(c.name) + '" src="' + flagUrl(c.iso, 160) + '"><div><b>' + esc(c.name) + "</b><span>Capital: " + esc(c.cap) + "<br>Continent: " + CONT[c.cont].name + "</span></div>");
  }
  curMap.onClick(function (k) { show(k); });
  $("#srch").onsubmit = function (e) {
    e.preventDefault(); var m = matchCountry($("#sq").value);
    if (!m) { fb("No country found with that name. Check the spelling.", "info"); return; }
    $("#fb").innerHTML = ""; show(m.id); curMap.zoomTo(m.id, 500);
  };
  app.querySelectorAll("[data-zr]").forEach(function (b) { b.onclick = function () { var r = b.getAttribute("data-zr"); curMap.fit(r === "W" ? WORLD_BOX : CONT[r].box, true); }; });
}

function layerChips() {
  return '<div class="chips" style="margin-top:10px"><span class="row-title" style="margin:6px 4px 0 0">Map:</span><button class="chip" data-layer="c" aria-pressed="' + (exploreLayer === "c") + '">🗺️ Countries</button><button class="chip" data-layer="p" aria-pressed="' + (exploreLayer === "p") + '">⛰️ Physical features</button></div>';
}
function bindLayer() {
  app.querySelectorAll("[data-layer]").forEach(function (b) { b.onclick = function () { exploreLayer = b.getAttribute("data-layer"); explore(); }; });
}
function explorePhys() {
  setScreen('<div class="panel"><div class="play-head"><div><span class="crumb">World Map Challenge</span><h2>🔍 Explore the map</h2><p class="sub">Click any mountain range, river, lake, desert, sea or island to learn about it.</p></div><button class="btn alt" id="backHome">← All modes</button></div>' +
    '<form class="answer-row" id="srch" autocomplete="off"><input id="sq" type="text" placeholder="Search for a feature, e.g. Nile…" aria-label="Search for a physical feature" list="plist"><datalist id="plist">' +
    PHL.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (o) { return '<option value="' + esc(o.name) + '">'; }).join("") +
    '</datalist><button class="btn teal" type="submit">Find</button></form>' + layerChips() +
    '<div class="chips" style="margin-top:8px">' + PCAT_ORDER.map(function (c) { return '<button class="chip" data-pcx="' + c + '" aria-pressed="' + (c === "all") + '">' + PCATS[c].emo + " " + PCATS[c].name + "</button>"; }).join("") +
    '</div><div id="fb"></div><div id="mapHost"></div></div>');
  $("#backHome").onclick = home; bindLayer();
  curMap = makeMap($("#mapHost"), { phys: true });
  curMap.clickable(true);
  function show(k) {
    curMap.clearCls(["target"]); curMap.clearLabels();
    if (!k || k.indexOf("p:") !== 0) { curMap.overlay(""); return; }
    var o = PH[k.slice(2)];
    curMap.cls(k, "target"); curMap.label(k, o.name, "", 15);
    curMap.overlay("<div><b>" + esc(o.name) + "</b><span>" + PCATS[o.cat].emo + " " + PCATS[o.cat].name + "<br>" + esc(o.fact) + "</span></div>");
  }
  curMap.onClick(function (k) { show(k); });
  $("#srch").onsubmit = function (e) {
    e.preventDefault(); var v = norm($("#sq").value); if (!v) return;
    var hit = PHL.filter(function (o) { return norm(o.name) === v; })[0] || PHL.filter(function (o) { return norm(o.name).indexOf(v) >= 0; })[0];
    if (!hit) { fb("No feature found with that name. Try another spelling.", "info"); return; }
    $("#fb").innerHTML = "";
    app.querySelectorAll("[data-pcx]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-pcx") === "all"); }); curMap.showCats(null);
    show("p:" + hit.k); curMap.zoomTo("p:" + hit.k, 600);
  };
  app.querySelectorAll("[data-pcx]").forEach(function (b) { b.onclick = function () {
    var c = b.getAttribute("data-pcx");
    app.querySelectorAll("[data-pcx]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
    curMap.showCats(c === "all" ? null : [c]); show(null);
  }; });
}

if (DEBUG) window.__wm = { PH: PH, C: C, matchCountry: matchCountry, R: function () { return R; }, start: start, S: S };
hud();
home();
})();
</script>
