  var CASES = [
    { id: 'farm', t: 'Farm-to-table restaurants', where: 'Worldwide', when: 'Ongoing', emo: '🥕', photo: 'Tomatoes at Hope Farmers Market.jpg',
      info: 'Farm-to-table restaurants source ingredients from nearby farms and local producers rather than relying on long-distance food supply chains. This can support local businesses, reduce dependence on TNC suppliers and appeal to consumers who want fresher, more traceable food.',
      actors: 'Restaurants, local farmers, consumers', m: ['Economic'], s: ['Environmental / ethical', 'Cultural'], fl: ['Goods and food supply chains'], rr: 4, rrT: 'Reform',
      why: 'It does not reject trade completely, but it promotes shorter, more local supply chains.', success: 3 },
    { id: 'local', t: 'Buy Local campaign', where: 'Towns and cities worldwide', when: 'Ongoing', emo: '🛍️', photo: 'Shops in High Street, Peebles - geograph.org.uk - 996750.jpg',
      info: 'Buy local campaigns encourage consumers to purchase goods from local producers and independent businesses rather than from global brands or imported suppliers. Supporters argue this protects local jobs, keeps money in the local economy and strengthens local identity.',
      actors: 'Independent shops, local councils, consumers', m: ['Economic'], s: ['Cultural', 'Environmental / ethical'], fl: ['Goods and food supply chains', 'Money and capital', 'TNC brands and supply chains'], rr: 3, rrT: 'Partial rejection or reform',
      why: 'It reduces reliance on global brands but does not necessarily reject all global interaction.', success: 3 },
    { id: 'barbie', t: 'Barbie vs Greenpeace', where: 'Indonesia → global', when: '2011', emo: '🐯', photo: 'Sumatran Tiger (9122811106).jpg',
      info: 'In 2011, Greenpeace targeted Mattel, the company behind Barbie, over toy packaging linked to Indonesian rainforest destruction. Greenpeace said forensic testing found mixed tropical hardwoods in Mattel-branded packaging, and the campaign linked toy packaging to deforestation and tiger habitat loss. Mattel later announced it would stop buying paper and packaging linked to rainforest destruction.',
      actors: 'Greenpeace, Mattel, consumers, Asia Pulp & Paper', m: ['Environmental / ethical'], s: ['Economic', 'Political'], fl: ['Resources (timber, paper)', 'TNC brands and supply chains'], rr: 4, rrT: 'Reform',
      why: 'Greenpeace challenged Mattel’s supply chain and pressured the company to change sourcing practices.', success: 5 },
    { id: 'ramin', t: 'Ramin Paper Trail', where: 'Sumatra, Indonesia', when: '2012', emo: '🌳', photo: 'TRONTON BERISI KAYU DI HUTAN LINDUNG.jpg',
      info: 'Greenpeace’s Ramin Paper Trail investigation focused on Asia Pulp & Paper (APP) in Indonesia. Greenpeace argued that APP was linked to illegal ramin timber and rainforest destruction, threatening ramin trees and Sumatran tiger habitat, and undermining CITES rules on protected species.',
      actors: 'Greenpeace, Asia Pulp & Paper, Indonesian government, CITES', m: ['Environmental / ethical'], s: ['Political'], fl: ['Resources (timber, paper)', 'TNC brands and supply chains'], rr: 4, rrT: 'Reform',
      why: 'The campaign challenged illegal or unsustainable sourcing and called for accountability in global paper supply chains.', success: 4 },
    { id: 'kfc', t: 'KFC packaging campaign', where: 'UK, China and Indonesia', when: '2012', emo: '🍗', photo: 'Riau deforestation 2006.jpg',
      info: 'In 2012, Greenpeace accused KFC of using packaging linked to Indonesian rainforest destruction through supplier Asia Pulp & Paper. Greenpeace said forensic testing in the UK, China and Indonesia found rainforest fibre in KFC packaging, including food boxes and chicken buckets.',
      actors: 'Greenpeace, KFC, Asia Pulp & Paper, consumers', m: ['Environmental / ethical'], s: ['Economic'], fl: ['Resources (timber, paper)', 'TNC brands and supply chains'], rr: 4, rrT: 'Reform',

    { id: 'antiimm', t: 'Anti-immigration movement (USA)', where: 'United States', when: 'Ongoing', emo: '🛂', photo: 'US-Mexico-Nogales-Border.jpg',
      info: 'In the USA, some anti-immigration movements argue that high levels of immigration can increase pressure on jobs, wages, housing, schools, healthcare and national identity. Supporters of stricter immigration controls often frame migration as a threat to economic security, cultural identity or sovereignty. Critics argue that migrants can fill labour shortages, pay taxes, support economic growth and contribute to cultural diversity.',
      actors: 'Campaign groups, voters, politicians, migrants, employers', m: ['Cultural', 'Economic'], s: ['Political', 'Social / security'], fl: ['People and labour', 'Culture, language and media'], rr: 1, rrT: 'Often rejection',
      why: 'It usually aims to reduce or restrict immigration flows.', success: 3 },
    { id: 'border', t: 'Border control campaign (USA–Mexico)', where: 'USA–Mexico border', when: '2019 → 2025', emo: '🧱', photo: 'Border Fence and Imperial Beach, US Mexico Border Wall (16034498211).jpg',
      info: 'The USA–Mexico border is a major focus of political debate about immigration and sovereignty. Policies such as border wall construction, increased border enforcement and restrictions on asylum are examples of attempts to control the movement of people into the USA. The “Remain in Mexico” policy, first introduced in 2019 and reinstated in 2025, required some non-Mexican asylum seekers to wait in Mexico while their US immigration cases were processed.',
      actors: 'US government, Mexican government, asylum seekers, border communities', m: ['Political'], s: ['Social / security', 'Cultural', 'Economic'], fl: ['People and labour'], rr: 1, rrT: 'Restriction / rejection',

      info: 'Wales has policies to protect and promote the Welsh language. The Welsh Government’s Cymraeg 2050 strategy aims to reach one million Welsh speakers by 2050. This includes efforts linked to education, public life and community use of Welsh. Supporters argue that protecting Welsh helps preserve cultural identity in a globalised world where dominant languages, especially English, can weaken minority languages.',
      actors: 'Welsh Government, schools, Welsh speakers, media (S4C)', m: ['Cultural'], s: ['Political'], fl: ['Culture, language and media'], rr: 4, rrT: 'Reform / protection',

      info: 'A Starbucks opened inside Beijing’s Forbidden City in 2000, and its rent helped pay for maintenance of the palace. In January 2007 the CCTV news presenter Rui Chenggang started an online protest, arguing that the American coffee chain damaged Chinese culture at the heart of a national symbol. Millions of people backed the protest. The palace then required shops to trade under its own brand. Starbucks refused and closed the café in July 2007, saying it respected the palace’s decision. Chinese coffee brands opened under the Palace Museum name instead.',

    { id: 'eat', t: 'Eat Local: Thailand’s local food campaign', where: 'Thailand', when: '2024', emo: '🍜', photo: 'Thai Food in street.JPG', extra: true,
      info: 'In 2024 Thailand’s Ministry of Culture launched “Local Thai Cuisine, Eat with Wisdom”. Under “One Province, One Local Dish”, each province chose a traditional dish to revive and promote, with a “Flagging Local Cuisine” logo and a theme song, “The Lost Taste”. The aims are to preserve heritage and Thai identity, turn local food into global “soft power”, and bring tourists and income to the regions.',
      actors: 'Ministry of Culture, provinces, local cooks and farmers, tourists', m: ['Cultural'], s: ['Economic'], fl: ['Goods and food supply chains', 'Culture, language and media'], rr: 5, rrT: 'Reform: uses globalisation',
      why: 'It does not reject global food; it protects local dishes and uses tourism and global media to spread Thai culture outward.', success: 2,

      '<div class="task"><span class="tnum">Judgement</span><p><b>Is local production always better?</b></p><div class="rr"><span>Never</span><input type="range" min="1" max="5" value="' + (S.lpv || 3) + '" id="lpv" aria-label="How far you agree"><span>Always</span><b id="lpl"></b></div><textarea id="lpw" placeholder="Local production is better for… but globalised production is better for… so overall…">' + esc(S.lpw || '') + '</textarea></div>' +
      '<div class="row"><button type="button" class="btn ghost" id="lpm"' + (IS_T || filled >= 6 ? '' : ' disabled') + '>👀 Show model answers</button>' + (IS_T || filled >= 6 ? '' : '<span class="hint">Unlocks when you have filled in 6 boxes.</span>') + '</div><div id="lpmod"></div>' +
      '<div class="copybar"><button type="button" class="btn onenote" id="copyLP">Copy my table to OneNote</button></div>';
    var labs = ['', 'Never', 'Rarely', 'It depends', 'Usually', 'Always'];
    var r = $('lpv'), lab = function () { $('lpl').textContent = labs[S.lpv || 3]; }; lab();
    r.oninput = function () { S.lpv = +r.value; lab(); save(); };
    el.querySelectorAll('textarea[data-k]').forEach(function (ta) { var t; ta.oninput = function () { S.lp[ta.dataset.k] = ta.value; clearTimeout(t); t = setTimeout(function () { save(); var n = Object.keys(S.lp).filter(function (k) { return (S.lp[k] || '').trim().length > 5; }).length; if (n >= 6 && $('lpm').disabled) { $('lpm').disabled = false; var h = $('lpm').nextElementSibling; if (h) h.remove(); } }, 300); }; });
    var t2; $('lpw').oninput = function (e) { S.lpw = e.target.value; clearTimeout(t2); t2 = setTimeout(save, 300); };
    $('lpm').onclick = function () { $('lpmod').innerHTML = '<div class="model"><table class="score"><tr><th>Perspective</th><th>Local</th><th>Globalised</th></tr>' + PERS.map(function (p) { return '<tr><th>' + esc(p[0]) + '</th><td>' + esc(p[1]) + '</td><td>' + esc(p[2]) + '</td></tr>'; }).join('') + '</table><p><b>Judgement:</b> Local production is not always better. It suits consumers who value freshness and identity, and governments worried about food security, but globalised production gives lower prices, more choice and jobs in exporting countries. The answer depends on the perspective, the product and the place, which is why most campaigns aim to <b>reform</b> global supply chains rather than reject them.</p></div>'; };
    $('copyLP').onclick = function () {
      var h = '<h2>Is local production always better?</h2><table border="1" style="border-collapse:collapse"><tr><th style="padding:4px 8px">Perspective</th><th style="padding:4px 8px">Why support local production?</th><th style="padding:4px 8px">Why support globalised production?</th></tr>', t = 'IS LOCAL PRODUCTION ALWAYS BETTER?\n';
      PERS.forEach(function (p, i) { h += '<tr><td style="padding:4px 8px"><b>' + esc(p[0]) + '</b></td><td style="padding:4px 8px">' + esc(S.lp[i + 'l'] || '') + '</td><td style="padding:4px 8px">' + esc(S.lp[i + 'g'] || '') + '</td></tr>'; t += p[0] + ' | ' + (S.lp[i + 'l'] || '') + ' | ' + (S.lp[i + 'g'] || '') + '\n'; });
      h += '</table><p><b>Judgement (' + labs[S.lpv || 3] + '):</b> ' + esc(S.lpw || '') + '</p>'; t += 'Judgement (' + labs[S.lpv || 3] + '): ' + (S.lpw || '');
      copyNotes({ h: h, t: t });
    };
  }

  /* ================= 5. 4P ================= */
  var FOURP = [
    ['places', 'Places', 'Which places or groups feel most exposed to globalisation?', ['Farming communities', 'Manufacturing towns', 'Minority-language areas (Wales)', 'Heritage sites (Forbidden City)', 'Border regions (Arizona)', 'Rainforest communities (Riau)'],
      'Rural farming communities and manufacturing towns facing cheaper imports; minority cultures such as Welsh speakers; national heritage sites such as the Forbidden City; border regions such as Arizona; and forest communities in Riau, Sumatra, where land is cleared for pulp and paper.'],
    ['processes', 'Processes', 'Which flows create concern: trade, migration, TNCs, culture, production?', ['Trade', 'Migration', 'TNC supply chains', 'Cultural flows', 'Globalised production'],
      'TNC supply chains (APP paper in Mattel and KFC packaging); migration (USA–Mexico border, the Minutemen); cultural flows that threaten identity (Starbucks in the Forbidden City, English replacing Welsh); and globalised food production (farm-to-table and buy local responses).'],
    ['power', 'Power', 'Who has power: states, TNCs, civil society, consumers, voters, migrants?', ['States', 'TNCs', 'Civil society', 'Consumers', 'Voters', 'Migrants'],
      'TNCs such as Mattel and APP hold economic power, but civil society (Greenpeace, online protest in China) can use reputation to force change. States hold the most direct power (US border policy, Wales’ Cymraeg 2050, Thailand’s Ministry of Culture). Consumers use buying power; voters back anti-immigration parties; migrants usually have the least power.'],
    ['possibility', 'Possibility', 'What responses are possible: local sourcing, campaigns, nationalism, restrictions, boycotts, de-globalisation?', ['Local sourcing', 'Campaigns', 'Nationalism', 'Restrictions', 'Boycotts', 'De-globalisation'],
      'Local sourcing (farm-to-table), NGO campaigns (Greenpeace), boycotts and online protest (Starbucks, 2007), language and food protection (Wales, Thailand), restrictions and nationalism (border walls, Remain in Mexico). Most successful responses reform global flows rather than reject them; complete de-globalisation is rare.']
  ];
  function v4P(el) {
    S.p4 = S.p4 || {};
    el.innerHTML = '<span class="kicker">Task 5 · Final activity</span><h1>4P: Why do places reject globalisation?</h1>' +
      '<p class="muted">Complete the 4P analysis using the prompt questions. Tap a prompt to add it, then explain with examples from your case files.</p>' +
      '<div class="fourp">' + FOURP.map(function (q) { return '<div class="pq pq-' + q[0] + '"><h2>' + q[1] + '</h2><p class="hint">' + esc(q[2]) + '</p><div class="chips">' + q[3].map(function (c) { return '<button type="button" class="chip add" data-k="' + q[0] + '" data-v="' + esc(c) + '">+ ' + esc(c) + '</button>'; }).join('') + '</div><textarea data-k="' + q[0] + '" aria-label="' + q[1] + '">' + esc(S.p4[q[0]] || '') + '</textarea></div>'; }).join('') + '</div>' +
      '<div class="task"><span class="tnum">Conclusion</span><p><b>Overall, why do places reject globalisation, and do they usually reject it or reform it?</b></p><textarea id="p4c">' + esc(S.p4c || '') + '</textarea></div>' +
      '<div class="row"><button type="button" class="btn ghost" id="p4m">👀 Show a model 4P</button></div><div id="p4mod"></div>' +
      '<div class="copybar"><button type="button" class="btn onenote" id="copy4P">Copy my 4P to OneNote</button></div>';
    el.querySelectorAll('textarea[data-k]').forEach(function (ta) { var t; ta.oninput = function () { S.p4[ta.dataset.k] = ta.value; clearTimeout(t); t = setTimeout(save, 300); }; });
    el.querySelectorAll('.chip.add').forEach(function (b) { b.onclick = function () { var ta = el.querySelector('textarea[data-k="' + b.dataset.k + '"]'); ta.value = (ta.value ? ta.value.replace(/\s*$/, '') + '\n' : '') + b.dataset.v + ': '; S.p4[b.dataset.k] = ta.value; save(); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }; });
    var t2; $('p4c').oninput = function (e) { S.p4c = e.target.value; clearTimeout(t2); t2 = setTimeout(save, 300); };
    $('p4m').onclick = function () {
      var n = FOURP.filter(function (q) { return (S.p4[q[0]] || '').trim().length > 20; }).length;
      if (!IS_T && n < 4) { toast('Write something in all four boxes first.'); return; }
      $('p4mod').innerHTML = '<div class="model">' + FOURP.map(function (q) { return '<p><b>' + q[1] + ':</b> ' + esc(q[4]) + '</p>'; }).join('') + '<p><b>Conclusion:</b> Places resist globalisation mainly when they feel a loss of control: over jobs and prices (economic), identity and language (cultural), borders and sovereignty (political) or the environment (ethical). Most responses aim to reform global flows, such as making TNC supply chains sustainable or protecting a language, rather than reject them, because the benefits of trade and connection are hard to give up. Outright rejection is most common for migration flows, where states have the legal power to restrict them.</p></div>';
    };
    $('copy4P').onclick = function () {
      var h = '<h2>4P: Why do places reject globalisation?</h2><table border="1" style="border-collapse:collapse"><tr><td style="padding:6px 10px;vertical-align:top;width:50%"><b>Places</b><br>' + esc(S.p4.places || '').replace(/\n/g, '<br>') + '</td><td style="padding:6px 10px;vertical-align:top"><b>Processes</b><br>' + esc(S.p4.processes || '').replace(/\n/g, '<br>') + '</td></tr><tr><td style="padding:6px 10px;vertical-align:top"><b>Power</b><br>' + esc(S.p4.power || '').replace(/\n/g, '<br>') + '</td><td style="padding:6px 10px;vertical-align:top"><b>Possibility</b><br>' + esc(S.p4.possibility || '').replace(/\n/g, '<br>') + '</td></tr></table><p><b>Conclusion:</b> ' + esc(S.p4c || '') + '</p>';
      copyNotes({ h: h, t: '4P\nPlaces: ' + (S.p4.places || '') + '\nProcesses: ' + (S.p4.processes || '') + '\nPower: ' + (S.p4.power || '') + '\nPossibility: ' + (S.p4.possibility || '') + '\nConclusion: ' + (S.p4c || '') });
    };
  }

  /* ================= EXPORT / NOTES ================= */
  function downloadSvg(svg, name) {
    var xml = new XMLSerializer().serializeToString(svg), vb = svg.viewBox.baseVal, sc = 2, img = new Image();
    img.onload = function () { var cv = document.createElement('canvas'); cv.width = vb.width * sc; cv.height = vb.height * sc; var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height); cv.toBlob(function (b) { var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('Picture saved: insert it into OneNote.'); }, 'image/png'); };
    img.onerror = function () { toast('Could not make the picture. Take a screenshot instead.'); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  }
  function notesAll() {
    var h = '<h2>Resistance Files: my case table</h2><table border="1" style="border-collapse:collapse"><tr>' + ['Example', 'Main cause', 'Secondary cause', 'Flow resisted', 'Reject or reform (1–5)', 'Why?'].map(function (x) { return '<th style="padding:4px 8px">' + x + '</th>'; }).join('') + '</tr>', t = 'RESISTANCE FILES\n';
    CASES.forEach(function (c) { var x = S.c[c.id] || {}; var row = [c.t, x.main || '', x.sec || '', (x.fl || []).join(', '), x.rr ? String(x.rr) : '', x.why || '']; h += '<tr>' + row.map(function (v) { return '<td style="padding:4px 8px">' + esc(v) + '</td>'; }).join('') + '</tr>'; t += row.join(' | ') + '\n'; });
    return { h: h + '</table>', t: t };
  }
  function copyNotes(n) {
    var html = '<div style="font-family:Calibri,Arial,sans-serif">' + n.h + '</div>', done = function () { toast('Copied. Paste it into OneNote with Ctrl+V.'); };
    var fallback = function () { var ta = document.createElement('textarea'); ta.value = n.t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Select and copy the text manually.'); } ta.remove(); };
    try { if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([n.t], { type: 'text/plain' }) })]).then(done, fallback); else fallback(); } catch (e) { fallback(); }
  }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600); }

  /* ================= TEACHER ================= */
  try { fetch('/api/session', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) { IS_T = !!(d && d.loggedIn && d.user && d.user.status === 'active' && (d.user.role === 'teacher' || d.user.role === 'admin')); if (IS_T) render(); }).catch(function () {}); } catch (e) {}
  window.SBL_TEACHER_ADAPTER = {
    key: function () {
      return '<h3>Model answers</h3><table><tr><th>Example</th><th>Main cause</th><th>Secondary cause</th><th>Flow resisted</th><th>Reject or reform?</th><th>Why?</th></tr>' +
        CASES.map(function (c) { return '<tr><td>' + esc(c.t) + '</td><td>' + esc(c.m.join(' / ')) + '</td><td>' + esc(c.s.join(' / ')) + '</td><td>' + esc(c.fl.join(', ')) + '</td><td>' + esc(c.rrT) + '</td><td>' + esc(c.why) + '</td></tr>'; }).join('') + '</table>' +
        '<p class="muted">Marking accepts any listed main or secondary cause; flows are correct when every chosen flow is in the list. Reject/reform and “why” are compared, not marked.</p>';
    }
  };

  render();
})();
