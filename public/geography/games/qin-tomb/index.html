<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tomb of the First Emperor — KS3 History Games — SBL</title>
<meta name="description" content="KS3 History Year 7 escape game: answer your way through seven chambers of Qin Shi Huang's tomb, from the unification of China to the fall of the Qin dynasty, and identify the consequences of his rule.">
<style>
  :root {
    --stone: #1c1714; --stone2: #2a221d; --stone3: #3a2f27; --sand: #f3e7d0; --sand2: #e6d3b0;
    --gold: #e0b443; --gold-dark: #a57a14; --cinnabar: #c2410c; --red: #dc2626; --jade: #0f9f74; --jade-soft: #d9f5ea;
    --ink: #241a12; --muted: #6b5a49; --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--ink); min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, #4a3a2c 0%, #1c1714 55%) fixed, #1c1714; }
  a { color: inherit; text-decoration: none; }
  button, textarea { font-family: inherit; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .top-bar { padding: 14px 16px; color: #fff; background: #120e0b; border-bottom: 1px solid rgba(224,180,67,.25); }
  .top-inner { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .back-link { font-size: .88rem; font-weight: 700; color: rgba(255,255,255,.8); }
  .back-link:hover { color: var(--gold); }
  .brand { font-weight: 900; color: #fff; } .brand span { color: var(--gold); }
  .hud { position: sticky; top: 0; z-index: 50; background: rgba(18,14,11,.97); color: #fff; padding: 8px 16px; border-bottom: 1px solid rgba(224,180,67,.2); }
  .hud-inner { max-width: 1000px; margin: 0 auto; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .hud b { color: var(--gold); }
  .torches { font-size: 1.15rem; letter-spacing: 2px; white-space: nowrap; }
  .torches .out { filter: grayscale(1); opacity: .3; }
  .hud .where { font-size: .85rem; font-weight: 700; color: rgba(255,255,255,.8); }
  .hud-btn { background: transparent; color: var(--gold); border: 1px solid rgba(224,180,67,.5); border-radius: 99px; padding: 4px 12px; font-weight: 700; font-size: .8rem; cursor: pointer; }
  main { max-width: 1000px; margin: 0 auto 60px; padding: 0 16px; }
  .panel { background: var(--sand); border-radius: var(--radius); padding: 24px; margin-top: 18px; box-shadow: 0 20px 40px rgba(0,0,0,.35); border: 2px solid var(--gold-dark); position: relative; }
  .hero { background: linear-gradient(160deg, #3a2a1c, #1f1712); color: #fff; border-color: var(--gold); text-align: center; padding: 34px 24px; }
  .hero .kicker, .kicker { display: inline-block; font-size: .72rem; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; color: #241a12; background: var(--gold); padding: 4px 11px; border-radius: 99px; }
  .hero h1 { font-size: clamp(1.7rem, 4.5vw, 2.6rem); font-weight: 900; margin: 14px 0 8px; color: #fff; }
  .hero p { max-width: 640px; margin: 10px auto; line-height: 1.6; color: rgba(255,255,255,.88); }
  .hero .li { background: rgba(224,180,67,.12); border: 1px solid rgba(224,180,67,.45); border-radius: 14px; padding: 12px 16px; max-width: 640px; margin: 16px auto; text-align: left; font-size: .93rem; line-height: 1.55; }
  .hero .li b { color: var(--gold); }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 99px; padding: 12px 22px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: transform .15s; }
  .btn:hover { transform: translateY(-1px); }
  .btn.gold { background: var(--gold); color: #241a12; }
  .btn.dark { background: var(--stone2); color: #fff; }
  .btn.ghost { background: transparent; border: 2px solid var(--gold-dark); color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  h2.room-title { font-size: clamp(1.25rem, 3vw, 1.6rem); font-weight: 900; margin: 6px 0 4px; }
  .room-sub { color: var(--muted); line-height: 1.55; margin-bottom: 14px; }
  .step-label { font-size: .76rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--cinnabar); margin-bottom: 6px; }
  .prompt { font-size: 1.08rem; font-weight: 700; line-height: 1.5; margin-bottom: 14px; }

  .door .n { flex: 0 0 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; background: var(--stone3); color: var(--gold); }
  .door .t { font-weight: 800; } .door .s { font-size: .82rem; color: rgba(255,255,255,.7); margin-top: 2px; }
  .door.done { border-color: var(--jade); } .door.done .n { background: var(--jade); color: #fff; }
  .door.next { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(224,180,67,.25); }
  .door.locked { opacity: .45; cursor: not-allowed; }
  .door .st { margin-left: auto; font-size: .8rem; font-weight: 800; white-space: nowrap; }
  /* options */
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; background: #fff; border: 2px solid var(--sand2); border-radius: 12px; padding: 12px 14px; font-size: 1rem; cursor: pointer; line-height: 1.4; color: var(--ink); }
  .opt:hover:not(:disabled) { border-color: var(--gold); }

  .opt.right { border-color: var(--jade); background: var(--jade-soft); }
  .opt.wrong { border-color: var(--red); background: #fdecec; }

  .sentence { font-size: 1.15rem; line-height: 2.4; background: #fff; border-radius: 12px; padding: 14px 16px; border: 2px dashed var(--sand2); }
  .slot { display: inline-block; min-width: 110px; padding: 2px 12px; margin: 0 4px; border-bottom: 3px solid var(--gold-dark); background: #fff8e1; border-radius: 6px; text-align: center; cursor: pointer; font-weight: 800; line-height: 1.6; }
  .slot.bad { border-color: var(--red); background: #fdecec; animation: shake .4s; }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  .tile:disabled { opacity: .25; cursor: default; }
  /* stones */
  .pit { background: radial-gradient(ellipse at center, #120e0b 0%, #2a221d 100%); border-radius: 16px; padding: 22px 14px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .stone { width: 128px; min-height: 92px; border-radius: 46% 54% 50% 50% / 55% 45% 55% 45%; background: linear-gradient(160deg, #8a7867, #5c4c3f); color: #fff; border: 3px solid #a89584; font-weight: 800; cursor: pointer; padding: 10px; font-size: .92rem; line-height: 1.3; box-shadow: 0 8px 0 #2a221d; transition: transform .15s; }
  .stone:hover:not(:disabled) { transform: translateY(-3px); }
  .stone.ok { background: linear-gradient(160deg, var(--jade), #0b6b50); border-color: #6ee7b7; cursor: default; }
  .stone.ok .ord { display: block; color: #fff; font-size: .75rem; }
  .stone .ord { display: none; }
  .stone.crumble { animation: crumble .7s; }
  .stone.wide { width: 200px; }
  .pit.mercury { background: linear-gradient(120deg, #9ca3af, #e5e7eb 30%, #6b7280 55%, #d1d5db 80%, #9ca3af); background-size: 300% 100%; animation: flow 8s linear infinite; }
  @keyframes flow { from { background-position: 0 0; } to { background-position: 300% 0; } }
  @keyframes crumble { 0% { transform: translateY(0) rotate(0); } 30% { transform: translateY(8px) rotate(-5deg); background: #7f1d1d; } 60% { transform: translateY(4px) rotate(3deg); background: #7f1d1d; } 100% { transform: translateY(0) rotate(0); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .scroll { background: linear-gradient(180deg, #f9eccb, #efd9a7); border: 2px solid #c8a35a; border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; font-size: .95rem; line-height: 1.6; box-shadow: inset 0 0 20px rgba(165,122,20,.2); }
  .scroll b { color: var(--cinnabar); }
  /* match */
  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .match .col { display: grid; gap: 8px; align-content: start; }
  .match .colh { font-size: .78rem; font-weight: 800; text-transform: uppercase; color: var(--muted); }
  .mcard { text-align: left; background: #fff; border: 2px solid var(--sand2); border-radius: 12px; padding: 10px 12px; cursor: pointer; font-size: .93rem; line-height: 1.35; color: var(--ink); }
  .mcard.sel { border-color: var(--gold-dark); background: #fff8e1; }
  .mcard.done { border-color: var(--jade); background: var(--jade-soft); cursor: default; }
  .mcard.bad { border-color: var(--red); animation: shake .4s; }
  .mcard .tag { display: inline-block; font-size: .7rem; font-weight: 900; background: var(--jade); color: #fff; border-radius: 99px; padding: 1px 7px; margin-right: 4px; }
  /* sort */
  .sortbox { text-align: center; }
  .card-now { background: #fff; border: 3px solid var(--gold-dark); border-radius: 14px; padding: 18px; font-size: 1.08rem; font-weight: 700; line-height: 1.45; max-width: 560px; margin: 0 auto 14px; min-height: 80px; display: grid; place-items: center; }
  .card-now.burning { animation: burn 1s infinite alternate; }
  @keyframes burn { from { box-shadow: 0 0 0 rgba(194,65,12,0); } to { box-shadow: 0 0 22px rgba(194,65,12,.7); } }
  .bins { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .bin { flex: 1 1 200px; max-width: 280px; border: 0; border-radius: 14px; padding: 16px 12px; font-weight: 900; font-size: 1.05rem; cursor: pointer; color: #fff; }
  .bin small { display: block; font-weight: 600; font-size: .78rem; opacity: .9; margin-top: 4px; }
  .bin.a { background: var(--jade); } .bin.b { background: var(--cinnabar); }
  .sorted { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; text-align: left; }
  .sorted .col { background: rgba(255,255,255,.6); border-radius: 12px; padding: 10px; min-height: 60px; }
  .sorted h4 { font-size: .8rem; text-transform: uppercase; margin-bottom: 6px; }
  .sorted .it { font-size: .85rem; padding: 6px 8px; background: #fff; border-radius: 8px; margin-bottom: 6px; line-height: 1.35; }
  .sorted .it.burnt { background: #3a2f27; color: #f3e7d0; text-decoration: line-through; }
  .timer { height: 12px; border-radius: 99px; background: rgba(0,0,0,.12); overflow: hidden; margin: 0 auto 12px; max-width: 560px; }
  .timer div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--cinnabar)); width: 100%; transition: width 1s linear; }
  .counter { font-size: .85rem; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
  /* multi */
  .torchwall { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .tw { display: flex; gap: 10px; align-items: flex-start; text-align: left; background: #fff; border: 2px solid var(--sand2); border-radius: 12px; padding: 12px; cursor: pointer; font-size: .95rem; line-height: 1.4; color: var(--ink); }
  .tw .fl { font-size: 1.3rem; filter: grayscale(1); opacity: .35; }
  .tw.sel { border-color: var(--gold-dark); background: #fff8e1; } .tw.sel .fl { filter: none; opacity: 1; }
  .tw.right { border-color: var(--jade); background: var(--jade-soft); } .tw.right .fl { filter: none; opacity: 1; }
  .tw.wrong { border-color: var(--red); background: #fdecec; }
  /* notes */
  .notes { background: #fff; border-left: 6px solid var(--jade); border-radius: 12px; padding: 14px 16px; margin-top: 16px; line-height: 1.6; font-size: .96rem; }
  .notes h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--jade); margin-bottom: 4px; }
  .msg { margin-top: 12px; font-weight: 700; min-height: 1.4em; }
  .msg.bad { color: var(--red); } .msg.good { color: var(--jade); }
  textarea { width: 100%; min-height: 110px; border: 2px solid var(--sand2); border-radius: 12px; padding: 12px; font-size: 1rem; line-height: 1.5; background: #fff; }
  .wc { font-size: .8rem; color: var(--muted); margin-top: 4px; }
  .starters { font-size: .86rem; color: var(--muted); margin: 6px 0 10px; line-height: 1.5; }
  /* overlays */
  .overlay { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: rgba(10,8,6,.85); padding: 16px; }
  .overlay[hidden] { display: none; }
  .ov-box { background: var(--sand); border: 3px solid var(--gold); border-radius: 20px; max-width: 460px; width: 100%; padding: 26px; text-align: center; }
  .ov-box .big { font-size: 3rem; }
  .ov-box h2 { margin: 8px 0; font-weight: 900; }
  .ov-box p { line-height: 1.55; color: var(--muted); }
  .doors-anim { position: fixed; inset: 0; z-index: 150; pointer-events: none; display: flex; }
  .doors-anim div { flex: 1; background: repeating-linear-gradient(90deg, #3a2f27 0 40px, #2f261f 40px 80px); border: 4px solid var(--gold-dark); transition: transform 1.1s ease-in; }
  .doors-anim.open div:first-child { transform: translateX(-100%); } .doors-anim.open div:last-child { transform: translateX(100%); }
  .bag { display: grid; gap: 8px; }
  .bag .ev { background: #fff; border-radius: 10px; padding: 8px 12px; font-size: .88rem; line-height: 1.4; border-left: 4px solid var(--gold); }
  .summary { background: #fff; border-radius: 12px; padding: 16px; line-height: 1.6; font-size: .95rem; white-space: pre-wrap; }
  .teacher { margin-top: 14px; font-size: .8rem; color: rgba(255,255,255,.6); }
  .teacher button { background: none; border: 0; color: rgba(255,255,255,.75); text-decoration: underline; cursor: pointer; font-size: .8rem; }
  @media (max-width: 600px) {
    .panel { padding: 18px 14px; }
    .match { grid-template-columns: 1fr; }
    .sorted { grid-template-columns: 1fr; }
    .stone { width: 46%; min-height: 80px; } .stone.wide { width: 100%; }
    .slot { min-width: 80px; }
  }
  .kbar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; margin-top: 18px; }
  .kroom { padding-top: 18px; }
  .kstep { border-top: 1px solid rgba(165,122,20,.35); padding-top: 14px; margin-top: 14px; }
  .kq { line-height: 1.55; margin: 6px 0 10px; font-weight: 600; }
  .klist { margin: 6px 0 8px 22px; line-height: 1.55; font-size: .95rem; }
  ul.klist { list-style: none; margin-left: 0; }
  .klist li { margin: 3px 0; }
  .kok { color: #065f46; font-weight: 700; }
  .kno { color: #6b5a49; padding-left: 26px; }
  .kwhy { color: #7c2d12; font-weight: 400; font-size: .88rem; }
  .kfill { background: #d9f5ea; color: #065f46; padding: 1px 8px; border-radius: 6px; margin: 0 3px; }
  .ktab { width: 100%; border-collapse: collapse; font-size: .92rem; background: #fff; border-radius: 10px; overflow: hidden; }
  .ktab th, .ktab td { border: 1px solid #e6d3b0; padding: 8px 10px; text-align: left; vertical-align: top; }
  .ktab th { background: #f9eccb; }
  .kbins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .kbins > div { background: #fff; border-radius: 10px; padding: 10px 12px; }
  .kbins h4 { font-size: .92rem; } .kbins small { font-weight: 500; color: #6b5a49; }
  .kmodel { background: #fff; border-left: 5px solid #e0b443; border-radius: 10px; padding: 10px 14px; line-height: 1.6; font-size: .94rem; }
  .kev { margin-top: 14px; font-size: .92rem; line-height: 1.5; background: rgba(224,180,67,.18); border-radius: 10px; padding: 8px 12px; }
  @media (max-width: 600px) { .kbins { grid-template-columns: 1fr; } }
  @media print {
    body { background: #fff !important; }
    .top-bar, .hud, .kbar, .overlay, .doors-anim { display: none !important; }
    .panel { box-shadow: none; border: 1px solid #ccc; break-inside: auto; }
    .hero { background: #fff !important; color: #000 !important; } .hero h1, .hero p { color: #000 !important; }
    .kstep { break-inside: avoid; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>
(function () {
  'use strict';
  var KEY = 'sbl-qin-tomb-v1';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ------------------------------------------------------------------
     ROOMS. Each room is a list of steps. Step types:
     slots, mcq, multi, order, match, sort (timed optional), text.
     Facts follow Sima Qian's Records of the Grand Historian (c.100 BCE),
     the main written source for Qin Shi Huang.
  ------------------------------------------------------------------ */
  var ROOMS = [
    {
      title: 'The Dynasty Gate',
      sub: 'A huge stone door, carved with words. Complete the carving to push it open.',
      evidence: 'A dynasty is a line of rulers from the same family. The Qin dynasty ruled a united China from 221 to 206 BCE.',
      steps: [
        { type: 'slots', label: 'Fill in the carving', prompt: 'Tap the words to complete the definition.',
          parts: ['A dynasty is a line of ', ' from the same ', ' who pass ', ' down through the ', '.'],
          answers: ['rulers', 'family', 'power', 'generations'],
          extra: ['soldiers', 'village', 'money', 'weeks'],
          notes: 'Exactly right. China was ruled by a series of dynasties for over 2,000 years. The <b>Qin</b> (say &ldquo;chin&rdquo;) dynasty was short, from 221 to 206 BCE, but it was the first to rule a <b>united</b> China.' },
        { type: 'mcq', label: 'The inscription', prompt: 'Above the door are the words &ldquo;Qin Shi Huang&rdquo;. What does this title mean?',
          options: [['First Emperor of Qin', ''], ['Great King of the Wall', 'No: the title is about being first, not about the Wall.'], ['Lord of the Six States', 'Close in spirit, but the title means something else.'], ['Son of the Dragon', 'Not this one.']],
          notes: 'His birth name was <b>Ying Zheng</b> (born 259 BCE). He became king of the state of Qin in 246 BCE, aged just 13. After unifying China he invented a brand-new title for himself: <b>Shi Huangdi, &ldquo;First Emperor&rdquo;</b>. He expected his family to rule for 10,000 generations.' }
      ]
    },
    {
      title: 'The Path of the Six States',
      sub: 'The floor has fallen away. Six stepping stones cross the pit, one for each rival state Qin conquered. Step on them in the right order, or the stone crumbles.',
      evidence: 'Qin conquered the six other Warring States one by one, from Han in 230 BCE to Qi in 221 BCE, unifying China.',
      steps: [
        { type: 'order', label: 'Cross the pit', prompt: 'Read the torn chronicle on the wall, then step on the states in the order Qin conquered them.',
          clue: '<b>A torn chronicle:</b> &hellip;the mighty southern state of <b>Chu</b> fell in 223 BCE &hellip; <b>Qi</b>, the last to stand, surrendered without a fight in 221 BCE &hellip; <b>Han</b>, the smallest neighbour, was first to fall in 230 BCE &hellip; <b>Wei</b>&rsquo;s capital was flooded by the Qin army in 225 BCE &hellip; <b>Zhao</b> fell in 228 BCE &hellip; <b>Yan</b>, whose prince had sent an assassin to kill Ying Zheng, fell in 222 BCE&hellip;',
          items: ['Han', 'Zhao', 'Wei', 'Chu', 'Yan', 'Qi'],
          notes: 'You crossed! In just <b>nine years</b> (230&ndash;221 BCE) Qin swallowed all six rival states. The <b>Warring States period</b> was over and China was united under one ruler for the first time.' },
        { type: 'multi', label: 'Why did Qin win?', prompt: 'Light a torch for each <b>real</b> reason Qin was able to conquer the other states. (There are 4.)',
          options: [
            ['A huge, disciplined army: soldiers were promoted and rewarded for success in battle', true],
            ['Strong weapons, including crossbows and bronze and iron weapons, made in large numbers', true],
            ['The other states were divided and fought each other instead of uniting against Qin', true],
            ['Qin used spies and bribes to weaken its enemies from the inside', true],
            ['Qin had the Great Wall to hide behind', false, 'The Great Wall was built <b>after</b> unification.'],
            ['The other states gave up because they wanted Qin to rule', false, 'They fought hard, but they lost one by one.']
          ],
          notes: 'These are the reasons for your essay: <b>army strength</b>, <b>weaknesses of the other states</b> and <b>Qin&rsquo;s leadership and strategy</b>. Remember to explain <i>why</i> each one helped: &ldquo;This helped Qin because&hellip;&rdquo;' },

  window.SBL_QIN_ROOMS = ROOMS;
  /* ---------------- state ---------------- */
  var S = { done: [], scores: {}, bag: [], answers: {}, teacher: false };
  function load() { try { var d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && Array.isArray(d.done)) S = Object.assign(S, d); } catch (e) {} }

  load();
  var cur = null; // { r, step, torches, score }

  function total() { var t = 0; for (var k in S.scores) t += S.scores[k]; return t + (cur ? cur.score : 0); }
  function hud() {

  }
  function overlay(icon, title, text, btns) {
    $('ovIcon').innerHTML = icon; $('ovTitle').innerHTML = title; $('ovText').innerHTML = text;
    var a = $('ovActions'); a.innerHTML = '';
    btns.forEach(function (b) { var el = document.createElement('button'); el.className = 'btn ' + (b.cls || 'gold'); el.type = 'button'; el.innerHTML = b.t; el.onclick = function () { $('ov').hidden = true; b.f && b.f(); }; a.appendChild(el); });
    $('ov').hidden = false; a.querySelector('button').focus();
  }

  function lose(msgEl, why) {
    cur.torches--; cur.score = Math.max(0, cur.score - 10); hud();

    if (cur.torches <= 0) {
      setTimeout(function () {
        overlay('&#128128;', 'Your torches have gone out!', 'The chamber falls dark. Don&rsquo;t worry: archaeologists never give up. Try this chamber again from the start.', [{ t: 'Relight the torches', f: function () { startRoom(cur.r, true); } }]);

  }

  function map() {
    cur = null; hud();
    var next = 0; while (S.done.indexOf(next) >= 0) next++;
    var h = '<section class="panel"><span class="kicker">The tomb map</span><h2 class="room-title">Choose your chamber</h2><p class="room-sub">Chambers open one at a time. Your progress is saved on this device.</p><div class="map">';
    ROOMS.forEach(function (r, i) {
      var done = S.done.indexOf(i) >= 0, open = done || i === next || S.teacher;
      h += '<button type="button" class="door ' + (done ? 'done' : (i === next ? 'next' : (open ? '' : 'locked'))) + '" data-r="' + i + '"' + (open ? '' : ' disabled') + '>' +
        '<span class="n">' + (done ? '&#10003;' : i + 1) + '</span><span><span class="t">' + esc(r.title) + '</span><span class="s">' + (done ? 'Score ' + (S.scores[i] || 0) : (open ? 'Open' : 'Locked')) + '</span></span>' +

  function startRoom(r, retry) {
    cur = { r: r, step: 0, torches: 3, score: retry ? 60 : 100 };
    hud(); renderStep();
  }

  function renderStep() {
    var room = ROOMS[cur.r], st = room.steps[cur.step];
    var h = '<section class="panel"><span class="kicker">Chamber ' + (cur.r + 1) + '</span><h2 class="room-title">' + esc(room.title) + '</h2>' +
      (cur.step === 0 ? '<p class="room-sub">' + room.sub + '</p>' : '') +
      '<div class="step-label">Step ' + (cur.step + 1) + ' of ' + room.steps.length + (st.label ? ' &middot; ' + st.label : '') + '</div><div id="stage"></div><div class="msg" id="msg" aria-live="polite"></div><div id="after"></div></section>';
    $('app').innerHTML = h;
    ({ slots: rSlots, mcq: rMcq, multi: rMulti, order: rOrder, match: rMatch, sort: rSort, text: rText, verdict: rVerdict })[st.type](st, $('stage'), $('msg'));
    window.scrollTo(0, 0);
  }

  function stepDone(st) {
    var a = $('after');
    a.innerHTML = (st.notes ? '<div class="notes"><h3>&#128220; Archaeologist&rsquo;s notes</h3>' + st.notes + '</div>' : '') +
      '<div class="actions"><button type="button" class="btn gold" id="nextBtn">' + (cur.step + 1 < ROOMS[cur.r].steps.length ? 'Continue &rarr;' : 'Open the door &rarr;') + '</button></div>';
    $('nextBtn').onclick = function () {
      if (cur.step + 1 < ROOMS[cur.r].steps.length) { cur.step++; renderStep(); } else roomDone();
    };
    $('nextBtn').focus({ preventScroll: true });
    a.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function roomDone() {
    var r = cur.r, room = ROOMS[r];
    S.scores[r] = Math.max(S.scores[r] || 0, cur.score);
    if (S.done.indexOf(r) < 0) S.done.push(r);
    if (room.evidence && S.bag.indexOf(room.evidence) < 0) S.bag.push(room.evidence);
    save();
    var sc = cur.score; cur = null;
    var d = document.createElement('div'); d.className = 'doors-anim'; d.innerHTML = '<div></div><div></div>'; document.body.appendChild(d);
    setTimeout(function () { d.classList.add('open'); }, 50);
    setTimeout(function () { d.remove(); }, 1300);
    hud();
    overlay('&#128682;', 'The door grinds open!', 'Chamber ' + (r + 1) + ' complete. You scored <b>' + sc + '</b>.' + (room.evidence ? '<br><br>&#127890; New evidence added to your bag:<br><i>' + esc(room.evidence) + '</i>' : ''),
      [{ t: r + 1 < ROOMS.length ? 'Enter the next chamber &rarr;' : 'Back to the map', f: function () { if (r + 1 < ROOMS.length) startRoom(r + 1); else map(); } }, { t: 'Tomb map', cls: 'ghost', f: map }]);
  }

  /* ---------------- step renderers ---------------- */
  function rSlots(st, el, msg) {

      st.parts.forEach(function (p, i) { s += esc(p); if (i < st.answers.length) s += '<span class="slot" role="button" tabindex="0" data-i="' + i + '">' + (filled[i] ? esc(filled[i]) : '&nbsp;') + '</span>'; });
      s += '</div><div class="tiles">' + tiles.map(function (t, i) { return '<button type="button" class="tile" data-t="' + i + '"' + (filled.indexOf(t) >= 0 ? ' disabled' : '') + '>' + esc(t) + '</button>'; }).join('') + '</div>' +
        '<div class="actions"><button type="button" class="btn dark" id="chk"' + (filled.indexOf(null) >= 0 ? ' disabled' : '') + '>Push the door</button></div>';

      [].forEach.call(el.querySelectorAll('.slot'), function (b) { b.onclick = b.onkeydown = function (e) { if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return; filled[+b.dataset.i] = null; draw(); }; });
      $('chk').onclick = function () {

        if (!bad.length) { el.querySelector('.actions').remove(); [].forEach.call(el.querySelectorAll('.tile'), function (t) { t.disabled = true; }); msg.className = 'msg good'; msg.textContent = 'The carving glows gold. The door shudders open!'; stepDone(st); return; }
        if (lose(msg, 'Some words are wrong: they have been removed.')) return;

  function rMcq(st, el, msg) {

  function rMulti(st, el, msg) {

    var need = opts.filter(function (o) { return o.ok; }).length, sel = {};
    el.innerHTML = '<p class="prompt">' + st.prompt + '</p><div class="torchwall">' + opts.map(function (o, i) { return '<button type="button" class="tw" aria-pressed="false" data-i="' + i + '"><span class="fl">&#128293;</span><span>' + o.t + '</span></button>'; }).join('') + '</div><div class="actions"><button type="button" class="btn dark" id="chk">Check my torches</button></div>';
    var btns = el.querySelectorAll('.tw');

  }

  function rOrder(st, el, msg) {
    var order = st.items.map(function (t, i) { return { t: t, i: i }; }), shown = shuffle(order), next = 0;
    el.innerHTML = '<p class="prompt">' + st.prompt + '</p>' + (st.clue ? '<div class="scroll">' + st.clue + '</div>' : '') +
      '<div class="pit' + (st.wide ? ' mercury' : '') + '">' + shown.map(function (o) { return '<button type="button" class="stone' + (st.wide ? ' wide' : '') + '" data-i="' + o.i + '"><span class="ord"></span>' + esc(o.t) + '</button>'; }).join('') + '</div>';
    [].forEach.call(el.querySelectorAll('.stone'), function (b) {
      b.onclick = function () {
        if (b.classList.contains('ok')) return;
        if (+b.dataset.i === next) {
          b.classList.add('ok'); b.querySelector('.ord').textContent = 'Step ' + (next + 1); next++;
          msg.className = 'msg good'; msg.textContent = next < st.items.length ? 'The stone holds! Keep going.' : '';
          if (next === st.items.length) { [].forEach.call(el.querySelectorAll('.stone'), function (x) { x.disabled = true; }); msg.textContent = 'You made it across!'; stepDone(st); }
        } else { b.classList.remove('crumble'); void b.offsetWidth; b.classList.add('crumble'); lose(msg, 'That stone crumbles beneath you.'); }
      };
    });
  }

  function rMatch(st, el, msg) {
    var L = shuffle(st.pairs.map(function (p, i) { return { t: p[0], i: i }; })), R = shuffle(st.pairs.map(function (p, i) { return { t: p[1], i: i }; }));
    var pick = null, n = 0;
    el.innerHTML = '<p class="prompt">' + st.prompt + '</p><div class="match"><div class="col"><div class="colh">' + esc(st.left) + '</div>' +
      L.map(function (o) { return '<button type="button" class="mcard" data-s="L" data-i="' + o.i + '">' + esc(o.t) + '</button>'; }).join('') + '</div><div class="col"><div class="colh">' + esc(st.right) + '</div>' +
      R.map(function (o) { return '<button type="button" class="mcard" data-s="R" data-i="' + o.i + '">' + esc(o.t) + '</button>'; }).join('') + '</div></div>';
    [].forEach.call(el.querySelectorAll('.mcard'), function (b) {
      b.onclick = function () {
        if (b.classList.contains('done')) return;
        if (!pick || pick.dataset.s === b.dataset.s) { if (pick) pick.classList.remove('sel'); pick = b; b.classList.add('sel'); return; }
        if (pick.dataset.i === b.dataset.i) {
          n++; [pick, b].forEach(function (x) { x.classList.remove('sel'); x.classList.add('done'); x.disabled = true; x.insertAdjacentHTML('afterbegin', '<span class="tag">' + n + '</span>'); });
          pick = null; msg.className = 'msg good'; msg.textContent = 'The scale tips a little further&hellip;'.replace('&hellip;', '…');
          if (n === st.pairs.length) { msg.textContent = 'The scale balances perfectly. Click!'; stepDone(st); }
        } else { var p = pick; pick = null; p.classList.remove('sel'); [p, b].forEach(function (x) { x.classList.remove('bad'); void x.offsetWidth; x.classList.add('bad'); }); lose(msg, 'That solution doesn’t fit that problem.'); }
      };
    });
  }

  function rSort(st, el, msg) {
    var cards = shuffle(st.cards.map(function (c) { return { t: c[0], b: c[1], why: c[2] }; })), k = 0, placed = [[], []], timer = null, left = st.timed || 0, over = false;
    function draw() {
      var c = cards[k];
      el.innerHTML = '<p class="prompt">' + st.prompt + '</p><div class="sortbox">' + (st.timed ? '<div class="timer"><div id="tbar"></div></div>' : '') +
        '<div class="counter">Card ' + Math.min(k + 1, cards.length) + ' of ' + cards.length + (st.timed ? ' &middot; <span id="tleft">' + left + '</span>s left' : '') + '</div>' +
        (c ? '<div class="card-now' + (st.timed ? ' burning' : '') + '">' + (st.timed ? '&#128220; ' : '') + esc(c.t) + '</div><div class="bins">' +
          st.bins.map(function (b, i) { return '<button type="button" class="bin ' + (i ? 'b' : 'a') + '" data-b="' + i + '">' + esc(b[0]) + '<small>' + esc(b[1]) + '</small></button>'; }).join('') + '</div>' : '') +
        '<div class="sorted">' + st.bins.map(function (b, i) { return '<div class="col"><h4>' + esc(b[0]) + '</h4>' + placed[i].map(function (p) { return '<div class="it' + (p.burnt ? ' burnt' : '') + '">' + esc(p.t) + (p.why && !p.burnt ? '<br><small>' + esc(p.why) + '</small>' : '') + '</div>'; }).join('') + '</div>'; }).join('') + '</div></div>';
      if (st.timed) $('tbar').style.width = (left / st.timed * 100) + '%';
      [].forEach.call(el.querySelectorAll('.bin'), function (b) {
        b.onclick = function () {
          var c = cards[k], i = +b.dataset.b;
          if (i === c.b) { placed[i].push(c); k++; msg.className = 'msg good'; msg.textContent = 'Correct!'; if (k === cards.length) finish(); else draw(); }
          else { if (lose(msg, c.why ? 'Think again: ' + c.why : 'Think again.')) { stop(); return; } }
        };
      });
    }
    function stop() { if (timer) { clearInterval(timer); timer = null; } }
    function finish() {
      stop(); over = true; draw();
      if (st.timed && k < cards.length) { /* not reached */ }
      stepDone(st);
    }
    if (st.timed) {
      timer = setInterval(function () {
        if (!document.body.contains(el)) { stop(); return; }
        left--; if ($('tleft')) $('tleft').textContent = left; if ($('tbar')) $('tbar').style.width = (left / st.timed * 100) + '%';
        if (left <= 0) {
          stop(); var burnt = 0;
          while (k < cards.length) { var c = cards[k++]; c.burnt = true; placed[c.b].push(c); burnt++; }
          cur.score = Math.max(0, cur.score - burnt * 5); hud(); over = true; draw();
          msg.className = 'msg bad'; msg.textContent = '🔥 Time’s up! ' + burnt + ' scroll' + (burnt === 1 ? '' : 's') + ' burned (shown crossed out, in the right column).';
          stepDone(st);
        }
      }, 1000);
    }
    draw();
  }

  function rText(st, el, msg) {
    var prev = (S.answers[st.save] || '');
    el.innerHTML = '<p class="prompt">' + st.prompt + '</p><p class="starters">' + st.starters + '</p><textarea id="ta" aria-label="Your answer">' + esc(prev) + '</textarea><div class="wc" id="wc"></div><div class="actions"><button type="button" class="btn dark" id="chk">Carve my answer into the wall</button></div>';
    function wc() { var v = $('ta').value.trim(); var n = v ? v.split(/\s+/).length : 0; $('wc').textContent = n + ' words (aim for at least ' + st.min + ')'; return n; }
    $('ta').oninput = function () { wc(); S.answers[st.save] = $('ta').value; save(); }; wc();
    $('chk').onclick = function () {
      if (wc() < st.min) { msg.className = 'msg bad'; msg.textContent = 'Write a little more: explain both sides, using “because”.'; return; }
      $('chk').parentNode.remove(); $('ta').readOnly = true; msg.className = 'msg good'; msg.textContent = 'Your answer is carved into the wall.'; stepDone(st);
    };
  }

  function rVerdict(st, el, msg) {
    var bag = S.bag.length ? S.bag : ROOMS.map(function (r) { return r.evidence; }).filter(Boolean);
    var v = S.answers.verdict || '', rs = S.answers.reason || '';
    el.innerHTML = '<p class="prompt">Your final judgement: was Qin Shi Huang a <b>GOAT</b> or a <b>TOAD</b>?</p>' +
      '<div class="bins" id="vb"><button type="button" class="bin a" data-v="GOAT">GOAT<small>overall a success</small></button><button type="button" class="bin b" data-v="TOAD">TOAD<small>overall a failure</small></button></div>' +
      '<p class="prompt" style="margin-top:18px">Pick your <b>strongest piece of evidence</b> from your bag:</p><div class="opts" id="ev">' + bag.map(function (e, i) { return '<button type="button" class="opt" data-i="' + i + '">' + esc(e) + '</button>'; }).join('') + '</div>' +
      '<p class="prompt" style="margin-top:18px">Explain your verdict. Use the evidence and a connective.</p><p class="starters">Try: &ldquo;Overall, Qin Shi Huang was a ___ because&hellip; For example&hellip; This meant that&hellip; However&hellip; In conclusion&hellip;&rdquo;</p>' +
      '<textarea id="ta" aria-label="Your verdict">' + esc(S.answers.verdictText || '') + '</textarea><div class="wc" id="wc"></div><div class="actions"><button type="button" class="btn gold" id="chk">Open the burial chamber</button></div>';
    function mark() {
      [].forEach.call(el.querySelectorAll('#vb .bin'), function (b) { b.style.outline = b.dataset.v === v ? '4px solid #241a12' : ''; b.setAttribute('aria-pressed', b.dataset.v === v); });
      [].forEach.call(el.querySelectorAll('#ev .opt'), function (b) { b.classList.toggle('sel', bag[+b.dataset.i] === rs); });
    }
    [].forEach.call(el.querySelectorAll('#vb .bin'), function (b) { b.onclick = function () { v = b.dataset.v; S.answers.verdict = v; save(); mark(); }; });
    [].forEach.call(el.querySelectorAll('#ev .opt'), function (b) { b.onclick = function () { rs = bag[+b.dataset.i]; S.answers.reason = rs; save(); mark(); }; });
    function wc() { var t = $('ta').value.trim(); var n = t ? t.split(/\s+/).length : 0; $('wc').textContent = n + ' words (aim for at least 30)'; return n; }
    $('ta').oninput = function () { wc(); S.answers.verdictText = $('ta').value; save(); }; wc(); mark();
    $('chk').onclick = function () {
      if (!v) { msg.className = 'msg bad'; msg.textContent = 'Choose GOAT or TOAD first.'; return; }
      if (!rs) { msg.className = 'msg bad'; msg.textContent = 'Pick your strongest piece of evidence.'; return; }
      if (wc() < 20) { msg.className = 'msg bad'; msg.textContent = 'Write a bit more: at least 20 words, explaining your evidence.'; return; }
      var r = cur.r; S.scores[r] = Math.max(S.scores[r] || 0, cur.score); if (S.done.indexOf(r) < 0) S.done.push(r); save(); cur = null; hud();
      finale();
    };
  }

  function finale() {
    var t = 0; for (var k in S.scores) t += S.scores[k];
    var sum = 'Tomb of the First Emperor: my expedition notes\n\nScore: ' + t + ' / 700\n\nMy verdict: Qin Shi Huang was a ' + (S.answers.verdict || '?') + '.\nMy strongest evidence: ' + (S.answers.reason || '') + '\n\nMy explanation:\n' + (S.answers.verdictText || '') +
      (S.answers.both ? '\n\nAn action that was both a GOAT and a TOAD:\n' + S.answers.both : '') + '\n\nEvidence I collected:\n- ' + S.bag.join('\n- ') +
      '\n\nExit ticket: name one consequence of Qin’s unification of China and say whether it was short-term or long-term.';
    $('app').innerHTML = '<section class="panel hero"><span class="kicker">Expedition complete</span><h1>&#127942; You reached the First Emperor&rsquo;s tomb!</h1>' +
      '<p>Total score: <b style="color:var(--gold);font-size:1.4rem">' + t + '</b> out of 700.</p><p>You judged Qin Shi Huang to be a <b>' + esc(S.answers.verdict || '') + '</b>. Historians still argue about this: he united China and created things that lasted 2,000 years, but his dynasty collapsed just 15 years after unification.</p></section>' +
      '<section class="panel"><h2 class="room-title">Your expedition notes</h2><p class="room-sub">Copy these into your OneNote or exercise book, then answer the exit ticket.</p><div class="summary" id="sum">' + esc(sum) + '</div>' +
      '<div class="actions"><button type="button" class="btn gold" id="copy">Copy my notes</button><button type="button" class="btn dark" id="again">Play again</button><a class="btn ghost" href="/geography/games#history">Back to Games</a></div><div class="msg" id="cmsg" aria-live="polite"></div></section>';
    $('copy').onclick = function () {
      var done = function () { $('cmsg').className = 'msg good'; $('cmsg').textContent = 'Copied! Paste it into OneNote.'; };
      try { navigator.clipboard.writeText(sum).then(done, function () { selectSum(); }); } catch (e) { selectSum(); }
    };
    function selectSum() { var r = document.createRange(); r.selectNodeContents($('sum')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); $('cmsg').className = 'msg'; $('cmsg').textContent = 'Your notes are selected: press Ctrl+C (or Cmd+C) to copy.'; }
    $('again').onclick = function () { S.done = []; S.scores = {}; S.bag = []; S.answers = {}; save(); intro(); };
    window.scrollTo(0, 0);
  }


  /* ================= TEACHER ANSWER KEY ================= */
  function showKey() {
    cur = null; $('hud').hidden = true;
    function ok(t, why) { return '<li class="kok">&#9989; ' + t + (why ? ' <span class="kwhy">&mdash; ' + why + '</span>' : '') + '</li>'; }
    function no(t, why) { return '<li class="kno">' + t + (why ? ' <span class="kwhy">&mdash; ' + why + '</span>' : '') + '</li>'; }
    var h = '<div class="kbar"><button type="button" class="btn dark" id="kBack">&larr; Back to the game</button><button type="button" class="btn gold" id="kPrint">&#128424;&#65039; Print or save as PDF</button></div>' +
      '<section class="panel hero"><span class="kicker">Teacher answer key</span><h1>Tomb of the First Emperor</h1><p>Every chamber with its answers. Students see options and stepping stones shuffled; here they are in the correct order. Wrong answers are shown with the feedback students get.</p></section>';
    ROOMS.forEach(function (room, r) {
      h += '<section class="panel kroom"><span class="kicker">Chamber ' + (r + 1) + '</span><h2 class="room-title">' + esc(room.title) + '</h2>';
      room.steps.forEach(function (st, i) {
        h += '<div class="kstep"><div class="step-label">Step ' + (i + 1) + (st.label ? ' &middot; ' + st.label : '') + '</div>';
        if (st.prompt) h += '<p class="kq">' + st.prompt + '</p>';
        if (st.type === 'slots') {
          var t = ''; st.parts.forEach(function (p, j) { t += esc(p); if (j < st.answers.length) t += '<b class="kfill">' + esc(st.answers[j]) + '</b>'; });
          h += '<p class="sentence">' + t + '</p><p class="kwhy">Distractor tiles: ' + st.extra.map(esc).join(', ') + '</p>';
        }
        if (st.type === 'mcq') h += '<ul class="klist">' + st.options.map(function (o, j) { return j === 0 ? ok(o[0]) : no(o[0], o[1]); }).join('') + '</ul>';
        if (st.type === 'multi') h += '<ul class="klist">' + st.options.map(function (o) { return o[1] ? ok(o[0]) : no(o[0], o[2]); }).join('') + '</ul>';
        if (st.type === 'order') h += (st.clue ? '<div class="scroll">' + st.clue + '</div>' : '') + '<p class="kwhy">Correct order:</p><ol class="klist">' + st.items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
        if (st.type === 'match') h += '<table class="ktab"><tr><th>' + esc(st.left) + '</th><th>' + esc(st.right) + '</th></tr>' + st.pairs.map(function (p) { return '<tr><td>' + esc(p[0]) + '</td><td>' + esc(p[1]) + '</td></tr>'; }).join('') + '</table>';
        if (st.type === 'sort') h += (st.timed ? '<p class="kwhy">Timed: ' + st.timed + ' seconds. Unsorted scrolls burn at the end (&minus;5 points each).</p>' : '') + '<div class="kbins">' + st.bins.map(function (b, j) { return '<div><h4>' + esc(b[0]) + ' <small>(' + esc(b[1]) + ')</small></h4><ul class="klist">' + st.cards.filter(function (c) { return c[1] === j; }).map(function (c) { return '<li>' + esc(c[0]) + (c[2] ? ' <span class="kwhy">&mdash; ' + esc(c[2]) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>'; }).join('') + '</div>';
        if (st.type === 'text') h += '<p class="kwhy">Open answer (not marked automatically; at least ' + st.min + ' words). Possible answer:</p><p class="kmodel">' + st.model + '</p>';
        if (st.type === 'verdict') h += '<p class="kq">Final judgement: GOAT or TOAD? Students pick one, choose their strongest piece of evidence from their bag and write at least 20 words.</p><p class="kmodel">' + st.model + '</p>';
        if (st.notes) h += '<div class="notes"><h3>Notes students see after this step</h3>' + st.notes + '</div>';
        h += '</div>';
      });
      if (room.evidence) h += '<p class="kev">&#127890; <b>Evidence card:</b> ' + esc(room.evidence) + '</p>';
      h += '</section>';
    });
    h += '<section class="panel"><h2 class="room-title">Scoring</h2><p class="kq">Each chamber starts at 100 points: &minus;10 for each wrong answer (and a torch lost), &minus;5 for each burned scroll in Chamber 5. Losing all three torches restarts the chamber at 60 points. Maximum score: 700.</p><p class="kq">Exit ticket on the final screen: <i>Name one consequence of Qin&rsquo;s unification of China and say whether it was short-term or long-term.</i></p></section>';
    $('app').innerHTML = h;
    $('kBack').onclick = intro;
    $('kPrint').onclick = function () { window.print(); };
    window.scrollTo(0, 0);
  }

  $('mapBtn').onclick = function () {
