<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Food and Health Quest — IB Geography Option F Food and Health Revision Game — SBL</title>
<meta name="description" content="IB Geography revision game for Option F Food and Health: 19 levels covering food and health indicators, the nutrition and epidemiological transitions, energy and water footprints, disease and agricultural diffusion, malaria in Kenya, cholera in the DRC, international organisations, TNCs, gender, famine, Yemen, solutions to food insecurity, contemporary food production, prevention and treatment, and Ebola, with past paper checkpoints and an IB Examiner boss.">
<style>
  :root {
    --navy: #0f3a5c; --deep: #071a2c; --teal: #00b8b0; --teal-dark: #007c82; --cyan: #20d7e2;
    --ink: #062033; --muted: #4a6272; --line: rgba(5,43,65,0.13);
    --green: #16a34a; --green-soft: #e7f7ed; --red: #dc2626; --red-soft: #fdecec; --amber: #d97706; --amber-soft: #fff4dc;
    --gold: #f59e0b; --purple: #7c3aed;
    --c1: #65a30d; --c2: #ea580c; --c3: #0284c7; --c4: #7c3aed;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-padding-top: 80px; }
  .panel { scroll-margin-top: 80px; }
  body { font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--ink); min-height: 100vh;
    background: radial-gradient(circle at 10% 0%, rgba(0,184,176,0.14), transparent 40%), radial-gradient(circle at 100% 20%, rgba(245,158,11,0.12), transparent 35%), linear-gradient(180deg, #f4fbfc, #e9f2f5); }
  a { color: inherit; text-decoration: none; }
  button, input { font-family: inherit; }
  button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .top-bar { padding: 16px 20px; color: #fff; background: linear-gradient(135deg, #011526, #02324e); }
  .top-inner { max-width: 1150px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; font-weight: 700; color: rgba(255,255,255,0.85); }
  .back-link:hover { color: var(--cyan); }
  .brand { font-weight: 900; } .brand span { color: var(--teal); }

  /* HUD */
  .hud { position: sticky; top: 0; z-index: 50; background: rgba(7,26,44,0.96); color: #fff; padding: 8px 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
  .hud-inner { max-width: 1150px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; }
  .hud .xp { font-weight: 900; font-size: 1rem; color: var(--gold); white-space: nowrap; }
  .hud .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .hud .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold)); transition: width .6s ease; }
  .hud .lv { font-size: 0.82rem; font-weight: 800; white-space: nowrap; color: rgba(255,255,255,0.85); }
  .hud .badges { font-size: 1.05rem; letter-spacing: 2px; white-space: nowrap; }
  .hud .badges .off { filter: grayscale(1); opacity: 0.3; }
  .xp-pop { position: fixed; z-index: 3000; font-weight: 900; color: var(--gold); font-size: 1.1rem; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,0.25); animation: xpPop 1.1s ease forwards; }
  @keyframes xpPop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-50px); } }

  main { max-width: 1150px; margin: 18px auto 60px; padding: 0 16px; }
  .hero { text-align: center; padding: 18px 10px 6px; }
  .kicker { display: inline-block; font-size: 0.74rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--teal), #0792a3); padding: 5px 12px; border-radius: 999px; margin-bottom: 10px; }
  h1 { font-size: clamp(1.5rem, 3.6vw, 2.4rem); font-weight: 900; color: var(--navy); line-height: 1.15; }
  .hero p { color: var(--muted); max-width: 760px; margin: 8px auto 0; line-height: 1.55; font-weight: 500; }

  /* level map */
  .map { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 18px; }
  .lvcard { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 16px; padding: 14px; cursor: pointer; position: relative; color: var(--ink); box-shadow: 0 8px 20px rgba(0,25,45,0.06); transition: transform .2s ease; min-height: 130px; }
  .lvcard:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--teal); }
  .lvcard .num { display: block; padding-right: 24px; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.07em; color: var(--teal-dark); text-transform: uppercase; }
  .lvcard .emo { font-size: 1.8rem; display: block; margin: 4px 0; }
  .lvcard b { display: block; font-size: 1rem; line-height: 1.25; }
  .lvcard small { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 4px; line-height: 1.35; }
  .lvcard .st { position: absolute; top: 12px; right: 12px; font-size: 1.1rem; }
  .lvcard:disabled { cursor: not-allowed; background: #f1f5f9; color: #94a3b8; box-shadow: none; }
  .lvcard:disabled .emo { filter: grayscale(1); opacity: 0.5; }
  .lvcard.done { border-color: rgba(22,163,74,0.45); background: linear-gradient(180deg, #fff, #f0fdf4); }
  .lvcard.next { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(245,158,11,0.18); }
  .shelf { margin-top: 18px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .shelf h2 { font-size: 1.05rem; color: var(--navy); margin-bottom: 8px; }
  .bdg-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .bdg { display: flex; gap: 10px; align-items: center; padding: 9px 11px; border-radius: 12px; background: #f8fafc; border: 1px solid var(--line); font-size: 0.82rem; }
  .bdg .i { font-size: 1.6rem; filter: grayscale(1); opacity: 0.35; }
  .bdg b { display: block; font-size: 0.9rem; }
  .bdg.on { background: #fffbeb; border-color: rgba(245,158,11,0.5); }
  .bdg.on .i { filter: none; opacity: 1; }
  .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 14px; font-size: 0.8rem; color: var(--muted); }
  .linkbtn { background: none; border: none; color: var(--teal-dark); font-weight: 800; cursor: pointer; font-size: 0.8rem; text-decoration: underline; }

  /* level screen */
  .lvhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .lvhead .emo { font-size: 2.2rem; }
  .lvhead h2 { font-size: 1.4rem; color: var(--navy); font-weight: 900; }
  .lvhead .tag { font-size: 0.72rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--teal-dark); }
  .lvhead .spacer { flex: 1; }
  .panel { background: rgba(255,255,255,0.97); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: 0 14px 34px rgba(0,25,45,0.07); margin-bottom: 14px; }
  .panel h3 { font-size: 1.05rem; font-weight: 900; color: var(--navy); margin-bottom: 6px; }
  .how { font-size: 0.93rem; color: var(--muted); line-height: 1.55; margin-bottom: 12px; }
  .how b { color: var(--ink); }
  .stage-tag { display: inline-block; font-size: 0.7rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; background: var(--amber-soft); color: #92400e; padding: 3px 9px; border-radius: 999px; margin-bottom: 6px; }
  .btn { border: none; border-radius: 12px; padding: 11px 18px; font-weight: 800; font-size: 0.93rem; cursor: pointer; transition: transform .2s ease; }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn.primary { color: #fff; background: linear-gradient(135deg, #00b8b0, #0392a2); box-shadow: 0 8px 20px rgba(0,184,176,0.28); }
  .btn.gold { color: #422006; background: linear-gradient(135deg, #fcd34d, #f59e0b); box-shadow: 0 8px 20px rgba(245,158,11,0.3); }
  .btn.ghost { background: #fff; color: var(--navy); border: 1px solid rgba(5,43,65,0.2); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .msg { font-weight: 750; font-size: 0.92rem; text-align: center; min-height: 1.3em; margin-top: 10px; }
  .msg.ok { color: var(--green); } .msg.no { color: var(--red); } .msg.info { color: var(--amber); }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* sort engine */
  .sg-tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; min-height: 54px; padding: 10px; border-radius: 14px; background: #fff; border: 1px dashed var(--line); }
  .sg-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 0.86rem; padding: 6px; }
  .sg-card { background: #fff; border: 2px solid rgba(5,43,65,0.16); border-radius: 12px; padding: 9px 11px; cursor: grab; user-select: none; touch-action: none; font-size: 0.88rem; line-height: 1.35; font-weight: 700; box-shadow: 0 3px 8px rgba(0,25,45,0.06); }
  .sg-card small { display: block; font-weight: 500; color: var(--muted); font-size: 0.76rem; }
  .sg-card.selected { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(0,184,176,0.25); }
  .sg-card.dragging { cursor: grabbing; box-shadow: 0 14px 28px rgba(0,0,0,0.22); }
  .sg-card.correct { border-color: var(--green); background: var(--green-soft); }
  .sg-card.incorrect { border-color: var(--red); background: var(--red-soft); }
  .sg-card .fb { display: none; margin-top: 4px; font-size: 0.74rem; font-weight: 700; color: #7f1d1d; }
  .sg-card.incorrect .fb { display: block; }
  .sg-card.correct .fb.alt { display: block; color: var(--teal-dark); }
  .sg-zones { display: grid; gap: 10px; margin-top: 12px; }
  .sg-zones.z2 { grid-template-columns: repeat(2, 1fr); } .sg-zones.z3 { grid-template-columns: repeat(3, 1fr); } .sg-zones.z4 { grid-template-columns: repeat(4, 1fr); }
  .sg-zone { border-radius: 16px; padding: 10px; min-height: 130px; border: 3px dashed #94a3b8; background: rgba(255,255,255,0.92); cursor: pointer; }
  .sg-zone.hover { background: #f0fbfa; }
  .sg-zone h4 { font-size: 0.95rem; font-weight: 900; margin-bottom: 2px; }
  .sg-zone .zsub { font-size: 0.74rem; color: var(--muted); margin-bottom: 6px; line-height: 1.35; }
  .sg-zone .zc { display: grid; gap: 6px; min-height: 40px; }
  .zc1 { border-color: var(--c1); } .zc1 h4 { color: var(--c1); }
  .zc2 { border-color: var(--c2); } .zc2 h4 { color: var(--c2); }
  .zc3 { border-color: var(--c3); } .zc3 h4 { color: var(--c3); }
  .zc4 { border-color: var(--c4); } .zc4 h4 { color: var(--c4); }
  .zg { border-color: var(--green); } .zg h4 { color: var(--green); }
  .zr { border-color: var(--red); } .zr h4 { color: var(--red); }

  /* choices / mcq */
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin: 8px 0; }
  .choice { text-align: left; padding: 11px 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-size: 0.9rem; font-weight: 700; color: var(--ink); line-height: 1.4; }
  .choice:hover:not(:disabled) { border-color: var(--teal); }
  .choice.right { border-color: var(--green); background: var(--green-soft); }
  .choice.wrong { border-color: var(--red); background: var(--red-soft); }
  .choice.sel { border-color: var(--navy); background: #e8f0f7; }
  .choice:disabled { cursor: default; }
  .fbk { display: none; margin-top: 8px; padding: 10px 12px; border-radius: 12px; font-size: 0.9rem; line-height: 1.5; }
  .fbk.show { display: block; } .fbk.good { background: var(--green-soft); border-left: 5px solid var(--green); } .fbk.bad { background: var(--red-soft); border-left: 5px solid var(--red); }
  .q { padding: 14px; border-radius: 14px; background: #f8fbfd; border: 1px solid var(--line); margin-bottom: 10px; }
  .q h4 { font-size: 0.98rem; font-weight: 850; line-height: 1.4; }

  /* order */
  .ord-pool, .ord-chain { display: grid; gap: 7px; }
  .ord-chain { counter-reset: s; min-height: 56px; padding: 10px; border-radius: 14px; border: 2px dashed #fcd34d; background: #fffdf5; margin-top: 10px; }
  .ord-item { padding: 10px 12px; border-radius: 11px; background: #fff; border: 2px solid rgba(5,43,65,0.16); cursor: pointer; font-size: 0.9rem; font-weight: 700; line-height: 1.4; text-align: left; color: var(--ink); }
  .ord-chain .ord-item { border-color: var(--gold); position: relative; padding-left: 42px; }
  .ord-chain .ord-item::before { counter-increment: s; content: counter(s); position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #422006; font-size: 0.78rem; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .ord-chain .ord-item.right { border-color: var(--green); background: var(--green-soft); }
  .ord-chain .ord-item.wrong { border-color: var(--red); background: var(--red-soft); }
  .ord-empty { color: var(--muted); font-size: 0.85rem; text-align: center; }
  .arrow { text-align: center; color: var(--gold); font-weight: 900; line-height: 0.7; }

  /* table */
  table.data { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; font-size: 0.92rem; margin: 6px 0 10px; }
  table.data th, table.data td { padding: 9px 10px; border-bottom: 1px solid rgba(5,43,65,0.08); text-align: center; }
  table.data th { background: #f1f5f9; font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  table.data td:first-child { font-weight: 900; }
  .cf-graph { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
  .cf-graph svg { display: block; width: 100%; height: auto; }
  .cf-line { stroke-dasharray: 100 100; stroke-dashoffset: 100; transition: stroke-dashoffset 2.4s ease; }
  .cf-graph.go .cf-line { stroke-dashoffset: 0; }
  .cf-mark { opacity: 0; transition: opacity .6s ease; }
  .cf-graph.go .cf-mark { opacity: 1; transition-delay: 2.4s; }

  /* escape room locks */
  .locks { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .lock { border-radius: 16px; padding: 14px; background: #fff; border: 2px solid var(--line); }
  .lock .lh { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .lock .lh .pad { font-size: 1.6rem; }
  .lock .lh b { font-size: 1rem; }
  .lock .lh small { display: block; color: var(--muted); font-size: 0.78rem; }
  .lock.open { border-color: var(--green); background: var(--green-soft); }
  .door { text-align: center; font-size: 3rem; margin-top: 10px; transition: transform .6s ease; }

  /* yes/no flash */
  .flash { text-align: center; padding: 20px; border-radius: 18px; background: linear-gradient(135deg, #0f3a5c, #155e75); color: #fff; }
  .flash .card { font-size: 1.4rem; font-weight: 900; margin: 10px 0 16px; min-height: 2.2em; display: flex; align-items: center; justify-content: center; }
  .flash .count { font-size: 0.8rem; opacity: 0.8; font-weight: 700; }
  .flash .yn { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .flash .yn button { min-width: 140px; padding: 14px 18px; border-radius: 14px; border: none; font-weight: 900; font-size: 1rem; cursor: pointer; }
  .flash .y { background: #4ade80; color: #052e16; } .flash .n { background: #fca5a5; color: #450a0a; }
  .flash .fb2 { min-height: 1.5em; margin-top: 12px; font-weight: 700; font-size: 0.92rem; }
  .flash .timer { font-size: 2rem; font-weight: 900; color: var(--gold); }
  .tbar { height: 8px; background: rgba(255,255,255,0.2); border-radius: 99px; overflow: hidden; margin: 6px auto 0; max-width: 420px; }
  .tbar div { height: 100%; background: var(--gold); transition: width 1s linear; }
  kbd { background: rgba(255,255,255,0.2); border-radius: 4px; padding: 0 5px; font-size: 0.78rem; }

  /* boss */
  .arena { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 12px; align-items: stretch; }
  .thinker { border-radius: 18px; padding: 14px; text-align: center; color: #fff; cursor: pointer; border: 3px solid transparent; transition: transform .2s; }
  .thinker:hover { transform: translateY(-2px); }
  .thinker.drop { border-color: var(--gold); }
  .thinker.hit { animation: hit .5s; }
  @keyframes hit { 30% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(74,222,128,0.6); } }
  .thinker .face { font-size: 3rem; }
  .thinker b { display: block; font-size: 1.1rem; }
  .thinker small { display: block; opacity: 0.85; font-size: 0.78rem; line-height: 1.35; margin-top: 4px; }
  .th-m { background: linear-gradient(160deg, #7f1d1d, #b91c1c); } .th-b { background: linear-gradient(160deg, #14532d, #15803d); }
  .centre { display: flex; flex-direction: column; gap: 10px; align-items: stretch; justify-content: center; }
  .hp { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 800; }
  .hpbar { height: 12px; border-radius: 99px; background: #e2e8f0; overflow: hidden; }
  .hpbar div { height: 100%; background: linear-gradient(90deg, #ef4444, #f97316); transition: width .4s; }
  .stmt { background: #fff; border: 3px solid var(--navy); border-radius: 16px; padding: 16px; font-weight: 850; font-size: 1.05rem; text-align: center; min-height: 100px; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; user-select: none; line-height: 1.35; }
  .stmt.dragging { position: fixed; z-index: 1000; box-shadow: 0 16px 32px rgba(0,0,0,0.3); cursor: grabbing; }
  .throws { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .throws button { padding: 10px; border-radius: 12px; border: none; color: #fff; font-weight: 900; cursor: pointer; font-size: 0.86rem; }
  .throws .tm { background: #b91c1c; } .throws .tb { background: #15803d; }
  .hearts { font-size: 1.2rem; letter-spacing: 3px; }

  /* energy */
  .country { border-radius: 16px; padding: 14px; background: linear-gradient(135deg, #0f3a5c, #134e4a); color: #fff; margin-bottom: 12px; }
  .country b { font-size: 1.1rem; } .country p { font-size: 0.9rem; opacity: 0.9; line-height: 1.5; margin-top: 4px; }
  .egrid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .srcs { display: grid; gap: 6px; }
  .src { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: #fff; border: 1px solid var(--line); }
  .src .ic { font-size: 1.4rem; text-align: center; }
  .src .nm { font-weight: 800; font-size: 0.9rem; }
  .src .nm small { display: block; font-weight: 500; font-size: 0.72rem; color: var(--muted); }
  .src .sb { height: 8px; border-radius: 99px; background: #e2e8f0; overflow: hidden; margin-top: 4px; }
  .src .sb div { height: 100%; transition: width .3s; }
  .src .ctl { display: flex; align-items: center; gap: 6px; }
  .src .ctl button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: #f8fafc; font-weight: 900; font-size: 1.1rem; cursor: pointer; }
  .src .ctl button:disabled { opacity: 0.35; cursor: not-allowed; }
  .src .ctl span { min-width: 40px; text-align: center; font-weight: 900; }
  .src.off { opacity: 0.55; }
  .meters { display: grid; gap: 8px; }
  .meter { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
  .meter .k { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 800; }
  .meter .b { height: 10px; border-radius: 99px; background: #e2e8f0; overflow: hidden; margin-top: 5px; }
  .meter .b div { height: 100%; transition: width .4s; border-radius: 99px; }
  .bigscore { text-align: center; padding: 14px; border-radius: 16px; background: linear-gradient(135deg, #fef3c7, #fde68a); border: 2px solid var(--gold); }
  .bigscore .v { font-size: 2.4rem; font-weight: 900; color: #78350f; }
  .bigscore small { display: block; font-weight: 700; color: #92400e; }
  .total { font-weight: 900; text-align: center; padding: 8px; border-radius: 10px; }
  .total.ok { background: var(--green-soft); color: var(--green); } .total.no { background: var(--amber-soft); color: #92400e; }
  .warns { font-size: 0.82rem; line-height: 1.5; color: #92400e; }

  /* carbon */
  .crow { margin-bottom: 10px; }
  .crow h4 { font-size: 0.9rem; font-weight: 900; margin-bottom: 6px; }
  .copts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .copt { text-align: left; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-size: 0.86rem; font-weight: 750; color: var(--ink); }
  .copt small { display: block; font-weight: 900; color: var(--muted); margin-top: 3px; }
  .copt.sel { border-color: var(--navy); background: #e8f0f7; }
  .copt.sel small { color: var(--navy); }

    };
    flash = function (el, cfg) {
      el.innerHTML = '<ul class="klist">' + cfg.items.map(function (x) { return '<li>' + esc(x.t) + ' → <b>' + (x.a ? cfg.yes : cfg.no) + '</b>' + why(x.why) + '</li>'; }).join('') + '</ul>';
    };
    orderGame = function (root, items) { root.innerHTML = '<p class="kwhy">Correct order:</p><ol class="klist">' + items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>'; };
    mcq = function (root, qs) {
      root.innerHTML = qs.map(function (q, i) { return '<div class="kq"><b>' + (i + 1) + '. ' + q.q + '</b>' + opts(q.o, q.c) + (q.f ? '<p class="kwhy">' + q.f + '</p>' : '') + '</div>'; }).join('');
    };
    dataGame = function (el, cfg) {
      el.innerHTML = '<figure class="dg-fig">' + cfg.chart + (cfg.cap ? '<figcaption>' + cfg.cap + '</figcaption>' : '') + '</figure>' + cfg.qs.map(function (q, i) {
        return '<div class="kq"><b>' + (i + 1) + '. ' + q.q + '</b>' + (q.type === 'num' ? '<p class="kok">✅ ' + q.ans + ' ' + (q.unit || '') + (q.tol ? ' (accept ±' + q.tol + ')' : '') + '</p>' : opts(q.o, q.c)) + (q.f ? '<p class="kwhy">' + q.f + '</p>' : '') + '</div>';
      }).join('');
    };
    labelGame = function (el, cfg) {
      var pins = cfg.pins.map(function (p) { return '<g class="ld-pin filled" transform="translate(' + p.x + ',' + p.y + ')"><circle r="15"/><text y="5" text-anchor="middle">' + p.n + '</text></g>'; }).join('');
      var ls = cfg.labels.filter(function (l) { return l.pin != null; }).sort(function (a, b) { return a.pin - b.pin; });
      var traps = cfg.labels.filter(function (l) { return l.pin == null; });
      el.innerHTML = '<div class="kld"><figure class="ld-fig">' + cfg.svg.replace('</svg>', pins + '</svg>') + (cfg.cap ? '<figcaption>' + cfg.cap + '</figcaption>' : '') + '</figure><div><ol class="klist">' +
        ls.map(function (l) { return '<li value="' + l.pin + '">' + esc(l.t) + '</li>'; }).join('') + '</ol>' + (traps.length ? '<p class="kwhy">Trap label' + (traps.length > 1 ? 's' : '') + ': ' + traps.map(function (l) { return esc(l.t); }).join('; ') + '</p>' : '') + '</div></div>';
    };
    function gateHtml(n) {
      var G = (typeof GATES !== 'undefined') && GATES[n]; if (!G || !G.length) return '';
      return '<div class="kgate"><h4>🔐 Checkpoint after Level ' + n + (G.length > 1 ? ' — one of these ' + G.length + ' is asked (they rotate)' : '') + '</h4>' + G.map(function (g, i) {
        var h = '<div class="kq"><div class="kmk">' + (g.src ? esc(g.src) + ' · ' : '') + (g.cmd ? g.cmd + ' · ' : '') + '[' + g.marks + ' mark' + (g.marks > 1 ? 's' : '') + ']</div><b>' + (G.length > 1 ? String.fromCharCode(65 + i) + '. ' : '') + esc(g.q) + '</b>';
        if (g.type === 'best') h += opts(g.o, g.c);
        if (g.type === 'multi') h += '<ul class="kopts">' + g.items.map(function (x) { return '<li class="' + (x.ok ? 'kok' : 'kno') + '">' + (x.ok ? '✅ ' : '') + esc(x.t) + '</li>'; }).join('') + '</ul>';
        if (g.type === 'num') h += '<p class="kok">✅ ' + g.ans + ' ' + (g.unit || '') + '</p>';
        return h + (g.ms ? '<p class="kms"><b>Mark scheme:</b> ' + g.ms + '</p>' : '') + '</div>';
      }).join('') + '</div>';
    }
    function bossHtml() {
      if (typeof EXQ === 'undefined') return '';
      return EXQ.map(function (Q, i) {
        return '<div class="kq"><div class="kmk">' + esc(Q.mk) + '</div><b>' + (i + 1) + '. ' + esc(Q.q) + '</b><ol class="klist">' +
          KEYSLOTS.map(function (s) { return '<li><b>' + s[1] + ':</b> ' + esc(Q[s[0]]) + '</li>'; }).join('') + '</ol><p class="kwhy">Traps: ' + Q.D.map(esc).join(' / ') + '</p></div>';
      }).join('');
    }
    $('app').innerHTML = '<div class="kbar"><button type="button" class="btn ghost" data-map="1">🗺️ Level map</button><button type="button" class="btn primary" id="kprint">🖨️ Print or save as PDF</button></div>' +
      '<div class="hero"><span class="kicker">Teacher answer key</span><h1>' + document.title.split(' — ')[0] + '</h1><p>Every activity with its answers, every past paper checkpoint (with mark schemes) and the final boss. Sort and order activities are shown in their correct groups and order; students see them shuffled.</p></div><div id="keyBody"></div>';
    var body = $('keyBody');
    try {
      LEVELS.forEach(function (L) {
        curN = L.n;
        var sec = document.createElement('section'); sec.className = 'klevel';
        sec.innerHTML = '<h2 style="border-left:6px solid ' + ZONES[L.z][2] + '">' + L.emo + ' Level ' + L.n + ' · ' + ZONES[L.z][1] + ': ' + esc(L.t) + '</h2>';
        body.appendChild(sec);
        if (L.z === 'X' && typeof EXQ !== 'undefined') { var b = document.createElement('div'); b.className = 'kstage'; b.innerHTML = '<h4>Final boss: build each answer from the cards</h4>' + bossHtml(); sec.appendChild(b); }
        else if (LV[L.n]) LV[L.n](sec);
        sec.insertAdjacentHTML('beforeend', gateHtml(L.n));
      });
    } finally {
      sortGame = R.sortGame; flash = R.flash; orderGame = R.orderGame; mcq = R.mcq; dataGame = R.dataGame; labelGame = R.labelGame; stages = R.stages;
    }
    $('kprint').addEventListener('click', function () { window.print(); });
    window.scrollTo(0, 0);
  }

  paintHud(); showMap();
  checkTeacher(function () { if (IS_T && document.querySelector('.foot') && !document.querySelector('.modal.on')) showMap(); });
})();
</script>

<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/js/sbl-feedback-widget.js"></script>
</body>
