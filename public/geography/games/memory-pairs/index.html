.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 10px; }
.bar h2 { margin: 0; font-size: 1.2rem; }
.stats { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.card { position: relative; aspect-ratio: 3 / 2; perspective: 900px; border: 0; padding: 0; background: none; cursor: pointer; font: inherit; color: inherit; transition: opacity .45s, transform .45s; }
.card .in { position: absolute; inset: 0; transition: transform .45s; transform-style: preserve-3d; }
.card.up .in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.back { background: linear-gradient(135deg, #0f766e, #2563eb); border: 2px solid #8fb8e8; }
.back svg { width: 44%; height: auto; }
.front { transform: rotateY(180deg); background: #fff; border: 2px solid #9fb6cc; padding: 8px 10px; text-align: center; font-size: clamp(.72rem, 1.25vw, .98rem); line-height: 1.25; }
.front.term { font-weight: 700; font-size: clamp(.9rem, 1.7vw, 1.25rem); color: var(--teal); }
.front.pic { padding: 4px; } .front.pic svg { width: 100%; height: 100%; }
.card:focus-visible .face { outline: 3px solid #f59e0b; outline-offset: 2px; }
.card.ok .front { border-color: #16a34a; box-shadow: 0 0 0 4px #bbf7d0; }
.card.no .front { border-color: #dc2626; box-shadow: 0 0 0 4px #fecaca; }
.card.gone { opacity: 0; transform: scale(.85); pointer-events: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
.btn { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; background: #d6ebee; color: #0b4f63; }
.btn.main { background: var(--teal); color: #fff; }
.done { display: none; margin-top: 18px; background: #fff; border-radius: 14px; border: 2px solid #16a34a; padding: 16px 18px; }
.done.show { display: block; }
.done h3 { margin: 0 0 6px; color: #15803d; }
.review { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px; margin-top: 10px; }
.rv { display: flex; gap: 10px; align-items: center; border: 1px solid #d5e1ea; border-radius: 10px; padding: 8px 10px; font-size: .92rem; }
.rv b { color: var(--teal); min-width: 9em; }
.rv svg { width: 120px; height: 78px; flex: none; }
.note { font-size: .8rem; color: var(--muted); margin-top: 14px; text-align: center; }
@media (max-width: 640px) { .board { gap: 7px; } .card { aspect-ratio: 1 / 1; } .front { font-size: .66rem; padding: 4px; } .front.term { font-size: .8rem; } }

  var KEY = 'sbl-memory-pairs-best';
  var best = {}; try { best = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var set, cards, open, moves, found, busy, t0;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function drawPicker() {
    $('picker').innerHTML = SETS.map(function (s, i) {
      return '<button type="button" class="pick" data-i="' + i + '" aria-pressed="' + (set === s) + '"><small>' + esc(s.group) + '</small><b>' + esc(s.title) + '</b>' +
        (best[s.id] ? '<span class="best">Best: ' + best[s.id] + ' moves</span>' : '') + '</button>';
    }).join('');
  }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function start(s) {
    set = s; open = []; moves = 0; found = 0; busy = false; t0 = Date.now();
    try { history.replaceState(null, '', '#' + s.id); } catch (e) {}
    cards = [];
    s.pairs.forEach(function (p, i) {
      cards.push({ pair: i, html: p[0], cls: 'term', label: p[0] });
      cards.push(s.kind === 'diagrams' ? { pair: i, html: D[p[1]], cls: 'pic', label: 'Diagram' } : { pair: i, html: esc(p[1]), cls: '', label: p[1] });
    });
    shuffle(cards);
    $('board').innerHTML = cards.map(function (c, i) {
      return '<button type="button" class="card" data-i="' + i + '" aria-label="Card ' + (i + 1) + ', face down"><span class="in"><span class="face back">' + GLOBE + '</span><span class="face front ' + c.cls + '">' + (c.cls === 'term' ? esc(c.html) : c.html) + '</span></span></button>';
    }).join('');
    $('setTitle').textContent = s.title;
    $('done').className = 'done'; $('done').innerHTML = '';
    drawPicker(); stats();
  }
  function stats() { $('stats').textContent = found + '/8 pairs · ' + moves + ' moves'; }
  function el(i) { return $('board').querySelector('[data-i="' + i + '"]'); }
  function flip(i) {
    if (busy || open.indexOf(i) > -1) return;
    var b = el(i); if (!b || b.classList.contains('gone')) return;
    b.classList.add('up'); b.setAttribute('aria-label', 'Card ' + (i + 1) + ': ' + cards[i].label);
    open.push(i);
    if (open.length < 2) return;
    moves++; busy = true;
    var a = open[0], c = open[1], ok = cards[a].pair === cards[c].pair;
    el(a).classList.add(ok ? 'ok' : 'no'); el(c).classList.add(ok ? 'ok' : 'no');
    setTimeout(function () {
      [a, c].forEach(function (k) {
        var e = el(k); e.classList.remove('ok', 'no');
        if (ok) { e.classList.add('gone'); e.setAttribute('aria-hidden', 'true'); e.tabIndex = -1; }
        else { e.classList.remove('up'); e.setAttribute('aria-label', 'Card ' + (k + 1) + ', face down'); }
      });
      if (ok) found++;
      open = []; busy = false; stats();
      if (found === 8) finish();
    }, ok ? 900 : 1300);
    stats();
  }
  function finish() {
    var secs = Math.round((Date.now() - t0) / 1000), prev = best[set.id], rec = !prev || moves < prev;
    if (rec) { best[set.id] = moves; try { localStorage.setItem(KEY, JSON.stringify(best)); } catch (e) {} }
    var rv = set.pairs.map(function (p) {
      return '<div class="rv"><b>' + esc(p[0]) + '</b>' + (set.kind === 'diagrams' ? D[p[1]] : '<span>' + esc(p[1]) + '</span>') + '</div>';
    }).join('');
    $('done').innerHTML = '<h3>All 8 pairs found!</h3><p>' + moves + ' moves in ' + Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s. ' +
      (rec ? (prev ? 'New best on this device (was ' + prev + ').' : 'That is your best so far on this device.') : 'Your best is ' + prev + ' moves. 8 moves is a perfect game.') +
      '</p><p><b>Review the pairs</b>, then copy any you found tricky into your notes.</p><div class="review">' + rv + '</div><div class="actions"><button type="button" class="btn main" id="again">Play again</button></div>';
    $('done').className = 'done show'; drawPicker();
    $('again').onclick = function () { start(set); window.scrollTo({ top: $('board').offsetTop - 80, behavior: 'smooth' }); };
  }
  $('board').addEventListener('click', function (e) { var b = e.target.closest('.card'); if (b) flip(+b.dataset.i); });
  $('picker').addEventListener('click', function (e) { var b = e.target.closest('.pick'); if (b) start(SETS[+b.dataset.i]); });
  $('reset').onclick = function () { start(set); };
  var h = location.hash.slice(1), first = SETS.filter(function (s) { return s.id === h; })[0] || SETS[0];
  start(first);
})();
