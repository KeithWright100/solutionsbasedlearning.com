<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>Japan: The Ageing Nation — IB Geography Games — SBL</title>
<meta name="description" content="IB Geography Changing Population game: analyse Japan's ageing population with real fertility data and population pyramids, sort causes and consequences, evaluate the policies Japan has actually used, then decide what you would do in charge of Japan. Copy your work to OneNote.">
<style>
  :root {
    --navy: #0f3a5c; --deep: #071a2c; --teal: #00b8b0; --teal-dark: #007c82; --cyan: #20d7e2;
    --ink: #062033; --muted: #4a6272; --line: rgba(5,43,65,0.13);
    --green: #16a34a; --green-soft: #e7f7ed; --red: #dc2626; --red-soft: #fdecec; --amber: #b45309; --amber-soft: #fff4dc;
    --gold: #f59e0b; --jp: #bc002d; --jp-soft: #fde8ec; --male: #0f6b8f; --female: #c2416b;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-padding-top: 80px; }
  body { font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--ink); min-height: 100vh;
    background: radial-gradient(circle at 92% 2%, rgba(188,0,45,0.10), transparent 32%), radial-gradient(circle at 5% 0%, rgba(0,184,176,0.12), transparent 40%), linear-gradient(180deg, #f6fafb, #edf3f6); }
  a { color: inherit; }
  button, input, textarea, select { font-family: inherit; font-size: inherit; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .top-bar { padding: 16px 20px; color: #fff; background: linear-gradient(135deg, #011526, #02324e); }
  .top-inner { max-width: 1150px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; font-weight: 700; color: rgba(255,255,255,0.85); text-decoration: none; }
  .back-link:hover { color: var(--cyan); }
  .brand { font-weight: 900; } .brand span { color: var(--teal); }

  .hud { position: sticky; top: 0; z-index: 50; background: rgba(7,26,44,0.96); color: #fff; padding: 8px 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
  .hud-inner { max-width: 1150px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
  .hud .xp { font-weight: 900; color: var(--gold); white-space: nowrap; }
  .hud .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .hud .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold)); transition: width .6s ease; }
  .hud .lv { font-size: 0.82rem; font-weight: 800; white-space: nowrap; color: rgba(255,255,255,0.85); }
  .xp-pop { position: fixed; z-index: 3000; font-weight: 900; color: var(--gold); font-size: 1.1rem; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,0.25); animation: xpPop 1.1s ease forwards; }
  @keyframes xpPop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-50px); } }

  main { max-width: 1150px; margin: 18px auto 60px; padding: 0 16px; display: flex; flex-direction: column; gap: 18px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: 0 10px 28px rgba(0,25,45,0.06); display: flex; flex-direction: column; gap: 16px; }
  .kicker { align-self: flex-start; display: inline-block; font-size: 0.74rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--jp), #8f0022); padding: 5px 12px; border-radius: 999px; }
  .kicker.teal { background: linear-gradient(135deg, var(--teal), #0792a3); }
  h1 { font-size: clamp(1.6rem, 3.8vw, 2.5rem); font-weight: 900; color: var(--navy); line-height: 1.12; }
  h2 { font-size: clamp(1.25rem, 2.6vw, 1.6rem); font-weight: 900; color: var(--navy); line-height: 1.2; }
  h3 { font-size: 1.08rem; font-weight: 850; color: var(--navy); }
  p { line-height: 1.55; }
  .muted { color: var(--muted); }
  .small { font-size: 0.86rem; }

  /* hero */
  .hero-grid { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap: 16px; }
  .box { border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .box.li { border: 3px solid #ea7a1c; }
  .box.sc { border: 3px solid #16a34a; }
  .box.syl { border: 3px solid #16a34a; }
  .box b.t { font-weight: 900; }
  .box ul { padding-left: 20px; line-height: 1.6; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .stat { background: #f6f9fb; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat b { display: block; font-size: 1.55rem; font-weight: 900; color: var(--jp); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 0.85rem; color: var(--muted); line-height: 1.35; display: block; }
  .stat em { font-style: normal; font-size: 0.72rem; color: #7b8d98; display: block; margin-top: 4px; }

  /* mission map */
  .map { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .mcard { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 16px; padding: 14px; cursor: pointer; position: relative; color: var(--ink); box-shadow: 0 8px 20px rgba(0,25,45,0.06); transition: transform .2s ease; display: flex; flex-direction: column; gap: 4px; }
  .mcard:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--teal); }
  .mcard .num { font-size: 0.72rem; font-weight: 900; letter-spacing: 0.07em; color: var(--teal-dark); text-transform: uppercase; }
  .mcard .emo { font-size: 1.7rem; }
  .mcard b { font-size: 1rem; line-height: 1.25; }
  .mcard small { color: var(--muted); font-size: 0.8rem; line-height: 1.35; }
  .mcard .st { position: absolute; top: 12px; right: 12px; font-size: 1rem; }
  .mcard.cur { border-color: var(--jp); }
  .mcard:disabled { cursor: not-allowed; background: #f1f5f9; color: #94a3b8; box-shadow: none; }
  .mcard:disabled .emo { filter: grayscale(1); opacity: 0.5; }

  /* tasks */
  .task { border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #fbfdfe; }
  .task.done { border-color: rgba(22,163,74,0.45); background: #f6fcf8; }
  .tnum { font-size: 0.72rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--teal-dark); }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 12px; padding: 9px 13px; font-weight: 650; cursor: pointer; text-align: left; line-height: 1.35; }
  .opt:hover:not(:disabled) { border-color: var(--teal); }
  .opt.sel { border-color: var(--navy); background: #eef5fa; }
  .opt.right { border-color: var(--green); background: var(--green-soft); }
  .opt.wrong { border-color: var(--red); background: var(--red-soft); }
  .opt:disabled { cursor: default; }
  .numrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .numrow input { width: 130px; padding: 9px 11px; border: 2px solid var(--line); border-radius: 10px; font-weight: 700; }
  .btn { border: 2px solid var(--navy); background: var(--navy); color: #fff; border-radius: 999px; padding: 9px 18px; font-weight: 800; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--navy); }
  .btn.jp { background: var(--jp); border-color: var(--jp); }
  .btn.on { background: var(--teal-dark); border-color: var(--teal-dark); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }
  .fb { font-weight: 650; line-height: 1.45; }
  .fb.ok { color: var(--green); } .fb.bad { color: var(--red); }
  .model { background: #f2f7fa; border-left: 5px solid var(--teal); border-radius: 10px; padding: 12px 14px; line-height: 1.55; }
  textarea { width: 100%; min-height: 96px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; line-height: 1.5; resize: vertical; background: #fff; color: var(--ink); }
  .hint { font-size: 0.86rem; color: var(--muted); }
  .two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 14px; }

  /* charts */
  .chart { width: 100%; overflow-x: auto; }
  .chart svg { display: block; width: 100%; height: auto; min-width: 560px; }
  .events { display: flex; flex-wrap: wrap; gap: 6px; }
  .ev { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 11px; font-size: 0.84rem; font-weight: 700; cursor: pointer; }
  .ev.on { background: var(--jp); color: #fff; border-color: var(--jp); }
  .evnote { background: var(--jp-soft); border-radius: 12px; padding: 10px 14px; line-height: 1.5; min-height: 48px; }
  .yrs { display: flex; gap: 8px; flex-wrap: wrap; }
  .pyr-wrap { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 16px; align-items: start; }
  .pyr svg { min-width: 420px; }
  #broad svg { min-width: 0; max-width: 460px; }
  .bar-hit { cursor: pointer; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
  .src { font-size: 0.76rem; color: #6b7f8b; line-height: 1.4; }

  /* sorter */
  .tray { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; padding: 10px; border: 2px dashed var(--line); border-radius: 14px; background: #fff; }
  .card { border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 8px 11px; font-weight: 700; font-size: 0.9rem; cursor: grab; text-align: left; line-height: 1.3; max-width: 260px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .card.sel { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,158,11,0.25); }
  .card.right { border-color: var(--green); background: var(--green-soft); cursor: default; }
  .card.wrong { border-color: var(--red); background: var(--red-soft); }
  .bins { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
  .bin { border: 2px solid var(--line); border-radius: 14px; padding: 10px; min-height: 170px; display: flex; flex-direction: column; gap: 8px; background: #f8fbfc; cursor: pointer; }
  .bin h4 { font-size: 0.92rem; font-weight: 900; }
  .bin .drop { display: flex; flex-direction: column; gap: 6px; }
  .bin.b1 { border-color: #7c3aed; } .bin.b1 h4 { color: #6d28d9; }
  .bin.b2 { border-color: var(--red); } .bin.b2 h4 { color: var(--red); }
  .bin.b3 { border-color: var(--green); } .bin.b3 h4 { color: var(--green); }
  .bin.b4 { border-color: var(--teal-dark); } .bin.b4 h4 { color: var(--teal-dark); }
  .bin.over { background: #fff8e8; }
  .ghost-drag { position: fixed; pointer-events: none; z-index: 4000; opacity: .92; box-shadow: 0 10px 24px rgba(0,0,0,.25); }

  /* sources */
  .stabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .stab { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 12px; font-weight: 800; cursor: pointer; text-align: left; font-size: 0.88rem; }
  .stab.on { border-color: var(--jp); background: var(--jp-soft); }
  .stab.done::after { content: " ✓"; color: var(--green); }
  .article { border: 1px solid #e4d9c4; background: #fffdf7; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .article .hd { font-family: Georgia, "Times New Roman", serif; font-size: 1.3rem; font-weight: 700; color: #1f2933; line-height: 1.25; }
  .article .by { font-size: 0.82rem; color: #6b7280; }
  .article p { font-family: Georgia, "Times New Roman", serif; font-size: 1.02rem; line-height: 1.6; color: #22303a; }
  .article .cite { font-family: inherit; font-size: 0.78rem; color: #6b7280; border-top: 1px solid #ece3d1; padding-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 750; font-size: 0.86rem; cursor: pointer; }
  .chip.sel { border-color: var(--navy); background: #eef5fa; }
  .chip.right { border-color: var(--green); background: var(--green-soft); }
  .chip.wrong { border-color: var(--red); background: var(--red-soft); }
  .rate { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .rate input[type=range] { width: 220px; accent-color: var(--jp); }
  .rate b { font-size: 1.1rem; min-width: 120px; }
  table.score { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  table.score th, table.score td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  table.score th { background: #eef4f7; }
  .tblwrap { overflow-x: auto; }

  /* PM decision */
  .pm-grid { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 16px; align-items: start; }
  .pols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .pol { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; color: var(--ink); }
  .pol.on { border-color: var(--jp); background: var(--jp-soft); }
  .pol .cost { font-size: 0.78rem; font-weight: 900; color: var(--amber); }
  .pol b { font-size: 0.98rem; }
  .pol small { color: var(--muted); line-height: 1.35; }
  .pol .grid-tag { font-size: 0.7rem; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; color: var(--teal-dark); }
  .dash { position: sticky; top: 70px; border: 2px solid var(--navy); border-radius: 16px; padding: 14px; background: #fff; display: flex; flex-direction: column; gap: 10px; }
  .budget { font-weight: 900; font-size: 1.05rem; }
  .meter { display: grid; grid-template-columns: 120px 1fr 64px; gap: 8px; align-items: center; font-size: 0.86rem; font-weight: 700; }
  .meter .trk { height: 12px; border-radius: 99px; background: #e6edf1; position: relative; overflow: hidden; }
  .meter .trk span { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; }
  .meter .trk::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: #94a3b8; }
  .meter .v { font-size: 0.78rem; color: var(--muted); text-align: right; }
  .cmp td:first-child { font-weight: 750; }

  .copybar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-top: 1px dashed var(--line); padding-top: 12px; }
  .btn.onenote { background: #7719aa; border-color: #7719aa; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--deep); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 750; z-index: 5000; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
  .teacher { font-size: 0.85rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .teacher button { background: none; border: 0; color: var(--teal-dark); font-weight: 800; text-decoration: underline; cursor: pointer; padding: 0; }
  .credits { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }
  .credits li { margin-left: 18px; }
  .navrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
  .key h3 { margin-top: 6px; }
  .key li { margin-left: 18px; line-height: 1.55; }

  @media (max-width: 860px) {
    .hero-grid, .pyr-wrap, .pm-grid, .two { grid-template-columns: minmax(0,1fr); }
    .bins { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    .dash { position: static; }
  }
  @media (max-width: 480px) { .bins { grid-template-columns: minmax(0,1fr); } .meter { grid-template-columns: 96px 1fr 56px; } }
  @media (prefers-reduced-motion: reduce) { .xp-pop { animation: none; } .mcard { transition: none; } .hud .bar div { transition: none; } }
</style>

<script>

  var TFR = [[1947,4.54],[1948,4.40],[1949,4.32],[1950,3.65],[1951,3.26],[1952,2.98],[1953,2.70],[1954,2.48],[1955,2.37],[1956,2.22],[1957,2.04],[1958,2.11],[1959,2.04],[1960,2.00],[1961,1.96],[1962,1.98],[1963,2.01],[1964,2.05],[1965,2.14],[1966,1.58],[1967,2.23],[1968,2.13],[1969,2.13],[1970,2.14],[1971,2.16],[1972,2.14],[1973,2.14],[1974,2.05],[1975,1.91],[1976,1.85],[1977,1.80],[1978,1.79],[1979,1.77],[1980,1.75],[1981,1.74],[1982,1.77],[1983,1.80],[1984,1.81],[1985,1.76],[1986,1.72],[1987,1.69],[1988,1.66],[1989,1.57],[1990,1.54],[1991,1.53],[1992,1.50],[1993,1.46],[1994,1.50],[1995,1.42],[1996,1.43],[1997,1.39],[1998,1.38],[1999,1.34],[2000,1.36],[2001,1.33],[2002,1.32],[2003,1.29],[2004,1.29],[2005,1.26],[2006,1.32],[2007,1.34],[2008,1.37],[2009,1.37],[2010,1.39],[2011,1.39],[2012,1.41],[2013,1.43],[2014,1.42],[2015,1.45],[2016,1.44],[2017,1.43],[2018,1.42],[2019,1.36],[2020,1.33],[2021,1.30],[2022,1.26],[2023,1.20],[2024,1.15],[2025,1.14]];
  var EVENTS = [
    { y: 1947, t: 'First baby boom (1947–49)', d: 'After the Second World War, about 2.5 million babies were born each year. The TFR was 4.54 in 1947.' },
    { y: 1957, t: 'Below replacement', d: 'The TFR dropped below the replacement level of 2.1 for the first time in 1957 (2.04).' },
    { y: 1966, t: 'Year of the Fire Horse', d: 'In 1966 the TFR fell to 1.58. A superstition said girls born in a Fire Horse (hinoeuma) year would be hot-tempered, so many couples delayed having children. Births were about 500,000 lower than in the years either side. 2026 is the next Fire Horse year.' },

    { id: 'A', tab: 'A · The Plus One policy (2009)', hd: 'Japan’s “Plus One” plan: one more child per family?', by: 'Adapted from Alastair Bonnett, “The Plus One policy”, New Statesman, 5 March 2009',
      url: 'https://www.newstatesman.com/long-reads/2009/03/japan-population-growth',
      p: ['Japan’s population is expected to fall from nearly 130 million towards 100 million by the middle of the century, one of the largest declines in the developed world. Japanese women have about 1.3 children each, far below the 2.1 needed to replace the population.',
          'The government’s answer is the “Plus One” proposal, which encourages every family to have one more child. It follows the earlier “Angel Plan” and “New Angel Plan”. It aims to make workplaces friendlier to parents and pays for 50,000 new day-care places.',

      url: 'https://www.bbc.com/news/business-36423218',
      p: ['Prime Minister Shinzo Abe delayed raising Japan’s sales (consumption) tax from 8% to 10% until late 2019. It was the second delay: the rise had first been planned for October 2015, then April 2017.',
          'The last increase, from 5% to 8% in April 2014, pushed Japan into a brief recession as shoppers cut back. Japan relies heavily on people spending, but its population is shrinking and ageing, so fewer people are contributing to the economy.',

    { id: 'D', tab: 'D · Immigration (2017)', hd: 'As its population ages, Japan quietly turns to immigration', by: 'Adapted from David Green, “As Its Population Ages, Japan Quietly Turns to Immigration”, Migration Policy Institute, 2017',

      p: ['More than a quarter of Japan’s population is aged 65 or over. To fill labour shortages, the government has turned to immigration since the 1990s, but in small numbers and with little public debate.',
          'From the 1980s, Japanese workers increasingly avoided “3-D” jobs: dirty, demanding and dangerous. In 1990 the government opened a route for workers of Japanese descent from South America, known as nikkeijin.',
          'The foreign share of the population rose from 0.7% in 1990 to 1.8% in 2016, about 2.3 million people. The foreign workforce grew by 40% between 2013 and 2017 alone.',

    { id: 'E', tab: 'E · Children’s Future Strategy (2024–26)', hd: 'Bigger child allowances, paid for by a new levy', by: 'Adapted from The Japan Times (19 April 2024), Nippon.com/Jiji Press (26 December 2025) and Newsweek (20 November 2025)',
      url: 'https://www.nippon.com/en/news/yjj2025122600378',
      p: ['In 2024 Japan passed a law to try to reverse the falling birth rate. From October 2024, child allowances were paid to all families with no income cap, extended to children of high-school age, and doubled for the third child and beyond.',
          'The package, about ¥3.6 trillion a year, is fully in place from 2026. It includes ¥100,000 for each pregnant woman and better parental-leave pay.',
          'To pay for it, a new “child and child-rearing support levy” was added to everyone’s health insurance from April 2026, raising ¥600 billion in its first year and ¥1 trillion a year from 2028. The average worker pays a few hundred yen a month. Critics have nicknamed it a “singles tax” because people without children also pay.',
          'So far the results are disappointing: births fell again to a record low of 671,236 in 2025, and the fertility rate dropped to 1.14.'],

      if (wrong) { fb.className = 'fb bad'; fb.textContent = wrong + ' in the wrong box (shown in red). Move them and check again.'; return; }
      S.ans.m3 = { ok: true }; save(); fb.className = 'fb ok'; fb.textContent = '✓ All 15 correct!'; award(40, $('chk'));
    };
    $('rs').onclick = function () { if (S.ans.m3 && S.ans.m3.ok) return; placed = {}; S.sort.placed = placed; save(); render(); $('sfb').textContent = ''; };
    mount(body, [
      mcq('m3b', 'Discuss', 'Some cards are “positive” consequences. Why might a geographer still question the card “Less money spent on schooling and natal medical care”?', ['Savings on schools are far smaller than the rising costs of pensions and care', 'Schools in Japan are free so there is no saving', 'Japan has more children than ever'], 0, 'Positives exist, but the savings from fewer children are outweighed by the growing costs of supporting older people.', 10),
      writeTask('m3w', 'Exam skill · Explain a chain (4 marks)', 'Explain how a low birth rate can lead to reduced tax income for the government.', 'Link three steps: cause → effect → consequence. Use “this means that…” and “as a result…”.',
        'A low birth rate means fewer children are born, and after about 15–20 years fewer young people enter the workforce. As a result, the number of economically active people paying income tax falls, while the number of retired people grows. This means the government collects less tax just as its spending on pensions and healthcare rises, so it may need to raise taxes, borrow more or cut services.',
        'a clear chain of at least three linked steps · the economically active population · a consequence for government finances')
    ]);
  }
  function dragify(container, sel, onDrop, onTap, zoneSel) {
    var drag = null;
    container.addEventListener('pointerdown', function (e) { var c = e.target.closest(sel); if (!c || c.classList.contains('right') || c.disabled) return; drag = { c: c, x: e.clientX, y: e.clientY, moved: false }; try { c.setPointerCapture(e.pointerId); } catch (x) {} });
    container.addEventListener('pointermove', function (e) {
      if (!drag) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) { drag.moved = true; var r = drag.c.getBoundingClientRect(); drag.g = drag.c.cloneNode(true); drag.g.classList.add('ghost-drag'); drag.g.style.width = r.width + 'px'; drag.ox = drag.x - r.left; drag.oy = drag.y - r.top; document.body.appendChild(drag.g); drag.c.style.opacity = '.35'; }
      if (drag.moved) { drag.g.style.left = (e.clientX - drag.ox) + 'px'; drag.g.style.top = (e.clientY - drag.oy) + 'px'; document.querySelectorAll(zoneSel).forEach(function (z) { z.classList.remove('over'); }); var el = document.elementFromPoint(e.clientX, e.clientY), z = el && el.closest(zoneSel); if (z) z.classList.add('over'); }
    });
    var end = function (e) { if (!drag) return; var d = drag; drag = null; document.querySelectorAll(zoneSel).forEach(function (z) { z.classList.remove('over'); }); if (d.moved) { d.g.remove(); d.c.style.opacity = ''; onDrop(d.c, document.elementFromPoint(e.clientX, e.clientY)); } else onTap(d.c); };
    container.addEventListener('pointerup', end);
    container.addEventListener('pointercancel', function () { if (drag) { if (drag.g) drag.g.remove(); drag.c.style.opacity = ''; drag = null; } });
  }

  /* ================= M4: SOURCES ================= */
  function m4(body) {
    var at = 0;
    body.insertAdjacentHTML('beforeend', '<p>Read each adapted source. For each one: tag the <b>type of policy</b>, answer the <b>evidence</b> question, then <b>rate how effective</b> you think it is and say why. Your ratings build a policy scorecard at the end.</p><div class="stabs" id="stabs"></div><div id="sbody" style="display:flex;flex-direction:column;gap:14px"></div><div id="scard"></div>');
    function tabs() { $('stabs').innerHTML = SOURCES.map(function (s, i) { var st = S.src[s.id] || {}; return '<button type="button" class="stab' + (i === at ? ' on' : '') + (st.q === true && st.types === true ? ' done' : '') + '" data-s="' + i + '">' + esc(s.tab) + '</button>'; }).join(''); }
    function show() {
      tabs(); var s = SOURCES[at], st = S.src[s.id] = S.src[s.id] || { tsel: [], rate: 3, why: '' };
      $('sbody').innerHTML =
        '<article class="article"><span class="by">Source ' + s.id + '</span><div class="hd">' + esc(s.hd) + '</div>' + s.p.map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('') + '<div class="cite">' + esc(s.by) + '. <a href="' + s.url + '" target="_blank" rel="noopener">Original</a></div></article>' +
        '<div class="task' + (st.types === true ? ' done' : '') + '" id="ttask"><span class="tnum">Step 1 · Tag the policy type</span><p><b>What type of policy does this source describe? Select all that apply, then check.</b></p><div class="chips">' +
          TYPES.map(function (t) { var on = st.tsel.indexOf(t) >= 0; var c = st.types === true ? (s.types.indexOf(t) >= 0 ? ' right' : '') : (on ? ' sel' : ''); return '<button type="button" class="chip' + c + '" data-t="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') +
          '</div><div class="row"><button type="button" class="btn" id="tchk"' + (st.types === true ? ' disabled' : '') + '>Check</button><span class="fb" id="tfb">' + (st.types === true ? '✓ Correct.' : '') + '</span></div></div>' +
        '<div class="task' + (st.q === true ? ' done' : '') + '" id="qtask"><span class="tnum">Step 2 · Use the evidence</span><p><b>' + esc(s.q) + '</b></p><div class="opts">' +
          s.o.map(function (o, k) { return '<button type="button" class="opt' + (st.q === true && k === s.a ? ' right' : '') + '" data-k="' + k + '"' + (st.q === true ? ' disabled' : '') + '>' + esc(o) + '</button>'; }).join('') +
          '</div><p class="fb' + (st.q === true ? ' ok' : '') + '" id="qfb">' + (st.q === true ? '✓ ' + esc(s.why) : '') + '</p></div>' +
        '<div class="task"><span class="tnum">Step 3 · Evaluate</span><p><b>How effective is this policy at reducing the impacts of Japan’s ageing population?</b></p><div class="rate"><input type="range" min="1" max="5" step="1" value="' + st.rate + '" id="rate" aria-label="Effectiveness rating from 1 to 5"><b id="rlab"></b></div>' +
          '<textarea id="rwhy" placeholder="It is effective / not very effective because… The evidence is… However…" aria-label="Why did you give this rating?">' + esc(st.why) + '</textarea></div>' +
        '<div class="navrow">' + (at > 0 ? '<button type="button" class="btn ghost" id="prev">← Source ' + SOURCES[at - 1].id + '</button>' : '<span></span>') + (at < SOURCES.length - 1 ? '<button type="button" class="btn" id="next">Source ' + SOURCES[at + 1].id + ' →</button>' : '') + '</div>';
      var lab = ['', 'Not effective', 'Slightly effective', 'Partly effective', 'Mostly effective', 'Very effective'];
      var rate = $('rate'); $('rlab').textContent = st.rate + ' · ' + lab[st.rate];
      rate.oninput = function () { st.rate = +rate.value; $('rlab').textContent = st.rate + ' · ' + lab[st.rate]; save(); score(); };
      var tt = null; $('rwhy').oninput = function (e) { st.why = e.target.value; clearTimeout(tt); tt = setTimeout(function () { save(); score(); }, 400); };
      document.querySelectorAll('#ttask .chip').forEach(function (c) { c.onclick = function () { if (st.types === true) return; var t = c.dataset.t, k = st.tsel.indexOf(t); if (k >= 0) st.tsel.splice(k, 1); else st.tsel.push(t); c.classList.toggle('sel'); save(); }; });
      $('tchk').onclick = function () {
        var ok = st.tsel.length === s.types.length && s.types.every(function (t) { return st.tsel.indexOf(t) >= 0; });
        if (ok) { st.types = true; save(); award(10, $('tchk')); show(); }
        else { $('tfb').className = 'fb bad'; $('tfb').textContent = st.tsel.length < s.types.length ? 'There is more than that. Read the source again.' : 'Not quite. One of your tags does not fit this source.'; }
      };
      document.querySelectorAll('#qtask .opt').forEach(function (b) { b.onclick = function () {
        if (st.q === true) return;
        if (+b.dataset.k === s.a) { st.q = true; save(); award(10, b); show(); }
        else { b.classList.add('wrong'); $('qfb').className = 'fb bad'; $('qfb').textContent = 'Not the best evidence. Look for a limitation in the source.'; setTimeout(function () { b.classList.remove('wrong'); }, 900); }
      }; });
      if ($('prev')) $('prev').onclick = function () { at--; show(); };
      if ($('next')) $('next').onclick = function () { at++; show(); window.scrollTo({ top: body.offsetTop - 70, behavior: 'smooth' }); };
      $('stabs').onclick = function (e) { var b = e.target.closest('[data-s]'); if (b) { at = +b.dataset.s; show(); } };
      score();
    }
    function score() {
      if (!$('scard')) return;
      $('scard').innerHTML = '<h3>My policy scorecard</h3><div class="tblwrap"><table class="score"><tr><th>Source</th><th>Policy type</th><th>My rating (1–5)</th><th>My reason</th></tr>' +
        SOURCES.map(function (s) { var st = S.src[s.id] || {}; return '<tr><td>' + s.id + '</td><td>' + esc(s.types.join(', ')) + '</td><td>' + (st.rate || 3) + '</td><td>' + esc(st.why || '') + '</td></tr>'; }).join('') + '</table></div>';
    }
    show();
  }

  /* ================= M5: IN CHARGE ================= */
  function m5(body) {
    body.insertAdjacentHTML('beforeend',
      '<p>It is 2026 and you are advising Prime Minister Takaichi. You have a budget of <b>' + BUDGET + ' points</b>. Choose at least three policies. The first five come from the class grid; the others come from the sources. Watch the dashboard, then compare your plan with what the government is actually doing.</p>' +
      '<div class="pm-grid"><div class="pols" id="pols"></div><aside class="dash" aria-live="polite"><div class="budget" id="bud"></div><div id="meters" style="display:flex;flex-direction:column;gap:8px"></div><p class="src">A simplified model for discussion: real effects are debated and take years.</p></aside></div>' +
      '<div id="cmp"></div>');
    function spent() { return S.pm.reduce(function (a, id) { return a + POLS.filter(function (p) { return p.id === id; })[0].cost; }, 0); }
    function draw() {
      $('pols').innerHTML = POLS.map(function (p) { var on = S.pm.indexOf(p.id) >= 0; return '<button type="button" class="pol' + (on ? ' on' : '') + '" data-p="' + p.id + '" aria-pressed="' + on + '"><span class="grid-tag">' + esc(p.grid) + '</span><b>' + esc(p.name) + '</b><span class="cost">Cost: ' + p.cost + ' point' + (p.cost === 1 ? '' : 's') + '</span></button>'; }).join('');
      var sp = spent(); $('bud').textContent = 'Budget used: ' + sp + ' / ' + BUDGET + ' points · ' + S.pm.length + ' policies chosen';
      var tot = { work: 0, births: 0, support: 0, money: 0 };
      S.pm.forEach(function (id) { var p = POLS.filter(function (q) { return q.id === id; })[0]; for (var k in tot) tot[k] += p.e[k]; });
      $('meters').innerHTML = METERS.map(function (m) { var v = Math.max(-6, Math.min(6, tot[m[0]])), w = Math.abs(v) / 6 * 50, col = v >= 0 ? '#16a34a' : '#dc2626'; return '<div class="meter"><span>' + m[1] + '</span><span class="trk"><span style="' + (v >= 0 ? 'left:50%' : 'left:' + (50 - w) + '%') + ';width:' + w + '%;background:' + col + '"></span></span><span class="v">' + (v > 0 ? 'Better +' + v : v < 0 ? 'Worse ' + v : 'No change') + '</span></div>'; }).join('');
      $('cmp').innerHTML = S.pm.length ? '<h3>Your plan compared with the Takaichi government</h3><div class="tblwrap"><table class="score cmp"><tr><th>Your policy</th><th>What the government is doing (2025–26)</th></tr>' + S.pm.map(function (id) { var p = POLS.filter(function (q) { return q.id === id; })[0]; return '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.gov) + '</td></tr>'; }).join('') + '</table></div>' : '';
      $('pols').querySelectorAll('.pol').forEach(function (b) { b.onclick = function () {
        var id = b.dataset.p, k = S.pm.indexOf(id), p = POLS.filter(function (q) { return q.id === id; })[0];
        if (k >= 0) S.pm.splice(k, 1); else { if (spent() + p.cost > BUDGET) { toast('Over budget: drop a policy first.'); return; } S.pm.push(id); }
        save(); draw();
      }; });
    }
    draw();
    mount(body, [
      writeTask('pm1', 'Your decision', 'As Prime Minister’s advisor, which policies would you choose and why?', 'Frame: “I would… because… The evidence from Source … shows… This is similar to / different from the Takaichi government, which… The biggest risk of my plan is…”', null,
        'at least three policies · evidence from the sources or data · a direct comparison with the current government · one risk or limitation'),
      writeTask('pm2', 'Exam-style question (10 marks)', 'Examine the effectiveness of the policies Japan has used to manage its ageing population.', 'Plan: introduction with data → pro-natalist policies (Sources A, E) → immigration (D, F) → technology (B) → tax and spending (C, E) → conclusion: which is most effective, for whom, and over what timescale?', null,
        'data (TFR 1.14, 29.5% aged 65+, dependency ratios) · at least three policy types · strengths and limitations of each · a judgement in the conclusion · the current Takaichi government')
    ]);
  }

  /* ================= ONENOTE ================= */
  function notesFor(i) {
    var h = '', t = '';
    var H = function (x) { h += '<h2>' + esc(x) + '</h2>'; t += '\n' + x.toUpperCase() + '\n'; };
    var P = function (lbl, v) { h += '<p><b>' + esc(lbl) + '</b> ' + esc(v || '(not answered yet)').replace(/\n/g, '<br>') + '</p>'; t += lbl + ' ' + (v || '(not answered yet)') + '\n'; };
    H('Briefing ' + (i + 1) + ': ' + MISSIONS[i].t);
    if (i === 0) {
      P('Key data:', 'TFR 4.54 (1947) → 2.04 (1957, first below replacement) → 1.58 (1966, Fire Horse) → 1.57 (1989, “1.57 shock”) → 1.26 (2005) → 1.45 (2015) → 1.14 (2025, record low).');
      P('Percentage change 1947–2025:', '−74.9%');
      P('Describe the trend (my answer):', S.notes.m1w);
    } else if (i === 1) {
      P('Age structure:', '65+ was 17.3% in 2000, 28.7% in 2020 and is projected to be 34.8% in 2040 (IPSS).');
      P('Total dependency ratio 2020:', '68.6');
      P('Old-age dependency ratio 2040 (projected):', '63.2');
      P('Two consequences (my answer):', S.notes.m2w);
    } else if (i === 2) {
      h += '<table border="1" style="border-collapse:collapse"><tr>' + BINS.map(function (b) { return '<th style="padding:4px 8px">' + b[1] + '</th>'; }).join('') + '</tr><tr>' + BINS.map(function (b) { return '<td style="padding:4px 8px;vertical-align:top">' + CARDS.filter(function (c) { return c.a === b[0]; }).map(function (c) { return esc(c.t); }).join('<br>') + '</td>'; }).join('') + '</tr></table>';
      BINS.forEach(function (b) { t += b[1] + ': ' + CARDS.filter(function (c) { return c.a === b[0]; }).map(function (c) { return c.t; }).join('; ') + '\n'; });
      P('Low birth rate → reduced tax income (my answer):', S.notes.m3w);
    } else if (i === 3) {
      h += '<table border="1" style="border-collapse:collapse"><tr><th style="padding:4px 8px">Source</th><th style="padding:4px 8px">Policy type</th><th style="padding:4px 8px">Rating (1–5)</th><th style="padding:4px 8px">My reason</th></tr>' +
        SOURCES.map(function (s) { var st = S.src[s.id] || {}; t += 'Source ' + s.id + ' (' + s.types.join(', ') + '): ' + (st.rate || 3) + '/5 – ' + (st.why || '') + '\n'; return '<tr><td style="padding:4px 8px">' + s.id + ': ' + esc(s.hd) + '</td><td style="padding:4px 8px">' + esc(s.types.join(', ')) + '</td><td style="padding:4px 8px">' + (st.rate || 3) + '</td><td style="padding:4px 8px">' + esc(st.why || '') + '</td></tr>'; }).join('') + '</table>';
    } else {
      P('Policies I chose:', S.pm.map(function (id) { return POLS.filter(function (p) { return p.id === id; })[0].name; }).join('; '));
      h += '<table border="1" style="border-collapse:collapse"><tr><th style="padding:4px 8px">My policy</th><th style="padding:4px 8px">The Takaichi government (2025–26)</th></tr>' + S.pm.map(function (id) { var p = POLS.filter(function (q) { return q.id === id; })[0]; t += '- ' + p.name + ' | Government: ' + p.gov + '\n'; return '<tr><td style="padding:4px 8px">' + esc(p.name) + '</td><td style="padding:4px 8px">' + esc(p.gov) + '</td></tr>'; }).join('') + '</table>';
      P('My decision:', S.notes.pm1);
      P('Exam-style answer:', S.notes.pm2);
    }
    return { h: h, t: t };
  }
  function allNotes() {
    var h = '<h1>Japan: The Ageing Nation · my case file</h1><p><i>Learning intention: to engage with issues that have local and global significance.</i></p>', t = 'JAPAN: THE AGEING NATION · MY CASE FILE\n';
    for (var i = 0; i < 5; i++) { var n = notesFor(i); h += n.h; t += n.t; }
    h += '<p><small>From SBL · Japan: The Ageing Nation</small></p>';
    return { h: h, t: t };
  }
  function copyNotes(n) {
    var html = '<div style="font-family:Calibri,Arial,sans-serif">' + n.h + '</div>';
    var done = function () { toast('Copied. Paste it into OneNote with Ctrl+V.'); };
    var fallback = function () {
      var ta = document.createElement('textarea'); ta.value = n.t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('Select and copy the text manually.'); } ta.remove();
    };
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([n.t], { type: 'text/plain' }) })]).then(done, function () {
          if (navigator.clipboard.writeText) navigator.clipboard.writeText(n.t).then(done, fallback); else fallback();
        });
      } else if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(n.t).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  /* ================= TEACHER ================= */
  function checkTeacher() {
    try {
      fetch('/api/session', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
        IS_T = !!(d && d.loggedIn && d.user && d.user.status === 'active' && (d.user.role === 'teacher' || d.user.role === 'admin'));
        if (IS_T && cur === -1 && $('tRow')) $('tRow').hidden = false;
      }).catch(function () {});
    } catch (e) {}
  }
  function answerKey() {
    if (!IS_T) return;
    cur = -2;
    var li = function (a) { return '<ul>' + a.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>'; };
    $('app').innerHTML = '<section class="panel key"><span class="kicker teal">Teacher answer key</span><h2>Japan: The Ageing Nation</h2>' +
      '<h3>Briefing 1 · The fertility story</h3>' + li(['Q1: 4.54', 'Q2: 1974 (first dipped below 2.1 in 1957, back above in the late 1960s)', 'Q3: (1.14 − 4.54) ÷ 4.54 × 100 = −74.9%', 'Q4: the Fire Horse (hinoeuma) superstition', 'Describe: overall fall 4.54 → 1.14; below replacement since 1974; anomaly 1966; recovery 2005–15 (1.26 → 1.45) then fall']) +
      '<h3>Briefing 2 · Changing pyramids</h3>' + li(['Task 1: 50–54 in 2000; 70–74 in 2020', 'Task 2: base narrowed and top widened (top-heavy)', 'Task 3: (15.08 + 36.12) ÷ 74.64 × 100 = 68.6', 'Task 4: 39.28 ÷ 62.13 × 100 = 63.2', '65+ share: 17.3% (2000), 28.7% (2020), 34.8% (2040 projected)']) +
      '<h3>Briefing 3 · Sort</h3>' + BINS.map(function (b) { return '<p><b>' + b[1] + ':</b> ' + CARDS.filter(function (c) { return c.a === b[0]; }).map(function (c) { return esc(c.t); }).join('; ') + '</p>'; }).join('') + li(['Discuss: savings from fewer children are much smaller than rising pension and care costs']) +
      '<h3>Briefing 4 · Sources</h3>' + li(SOURCES.map(function (s) { return '<b>' + s.id + '</b> (' + esc(s.types.join(', ')) + '): ' + esc(s.o[s.a]) + '. ' + esc(s.why); })) +
      '<h3>Briefing 5 · In charge of Japan</h3>' + li(POLS.map(function (p) { return '<b>' + esc(p.name) + '</b> (cost ' + p.cost + '): ' + esc(p.gov); })) +
      '<p class="muted">Open answers are marked by the teacher. Model answers appear to students only after they write their own.</p>' +
      '<button type="button" class="btn ghost" id="kBack" style="align-self:flex-start">← Back</button></section>';
    $('kBack').onclick = home; window.scrollTo(0, 0);
  }

  hud(); home(); checkTeacher();
})();
</script>
