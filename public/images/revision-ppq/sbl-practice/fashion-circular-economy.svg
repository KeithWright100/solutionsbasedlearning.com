"middle" font-size="12.5" >4</text><rect x="330" y="510" width="100" height="30" fill="#fff" stroke="#14532d"/><text x="380" y="530" text-anchor="middle" font-size="12.5" >18</text><rect x="430" y="510" width="100" height="30" fill="#fff" stroke="#14532d"/><text x="480" y="530" text-anchor="middle" font-size="12.5" >15</text><rect x="530" y="510" width="100" height="30" fill="#fff" stroke="#14532d"/><text x="580" y="530" text-anchor="middle" font-size="12.5" >35</text><rect x="630" y="510" width="100" height="30" fill="#fff" stroke="#14532d"/><text x="680" y="530" text-anchor="middle" font-size="12.5" >32</text><text x="380" y="572" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Percentage of people surveyed who support sustainable fashion</text><line x1="80" y1="620" x2="680" y2="620" stroke="#94a3b8" stroke-width="6"/><text x="110" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">City A</text><circle cx="110" cy="620" r="18" fill="#fff" stroke="#94a3b8" stroke-width="3"/><circle cx="110" cy="620" r="13.4" fill="#7c3aed"/><text x="110" y="656" text-anchor="middle" font-size="14" font-weight="700">74%</text><text x="245" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">City B</text><circle cx="245" cy="620" r="18" fill="#fff" stroke="#94a3b8" stroke-width="3"/><circle cx="245" cy="620" r="11.2" fill="#b91c1c"/><text x="245" y="656" text-anchor="middle" font-size="14" font-weight="700">52%</text><text x="380" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">City C</text><circle cx="380" cy="620" r="18" fill="#fff" stroke="#94a3b8" stroke-width="3"/><circle cx="380" cy="620" r="11.8" fill="#a16207"/><text x="380" y="656" text-anchor="middle" font-size="14" font-weight="700">58%</text><text x="515" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">City D</text><circle cx="515" cy="620" r="18" fill="#fff" stroke="#94a3b8" stroke-width="3"/><circle cx="515" cy="620" r="14.6" fill="#111827"/><text x="515" y="656" text-anchor="middle" font-size="14" font-weight="700">86%</text><text x="650" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#0284c7">City E</text><circle cx="650" cy="620" r="18" fill="#fff" stroke="#94a3b8" stroke-width="3"/><circle cx="650" cy="620" r="10.7" fill="#0284c7"/><text x="650" y="656" text-anchor="middle" font-size="14" font-weight="700">47%</text><text x="380" y="676" text-anchor="middle" font-size="11.5" fill="#475569">Online survey of 300 people aged 16–35 in each city</text><rect x="30" y="692" width="700" height="168" rx="12" fill="#fee2e2" stroke="#b91c1c"/><text x="48" y="720" font-size="15" font-weight="800" fill="#7f1d1d">Fast fashion: garment industry in Country Y</text><text x="56" y="746" font-size="13.5">• Garment exports earn 60% of the country’s export income.</text><text x="56" y="770" font-size="13.5">• The industry employs about 700,000 people; 85% are women.</text><text x="56" y="794" font-size="13.5">• Most workers are internal migrants from rural areas.</text><text x="56" y="818" font-size="13.5">• Workers send about 35% of their wages home to their families.</text><text x="56" y="842" font-size="13.5">• Clothing brands could cut water use by up to 25% by making clothes that last longer.</text><text x="380" y="886" text-anchor="middle" font-size="11.5" fill="#6b7280">SBL practice infographic: all figures are illustrative practice data based on real trends, not real statistics.</text></svg>