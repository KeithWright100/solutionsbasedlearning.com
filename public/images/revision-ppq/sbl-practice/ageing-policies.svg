ge</text><rect x="639.0" y="298.4" width="54" height="81.6" fill="#9ca3af"/><circle cx="666.0" cy="169.2" r="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><circle cx="666.0" cy="312.0" r="8" fill="#0f766e" stroke="#fff" stroke-width="1.5"/><circle cx="666.0" cy="366.4" r="8" fill="#7c3aed" stroke="#fff" stroke-width="1.5"/><text x="666.0" y="398" text-anchor="middle" font-size="12.5" fill="#13284b">Encourage</text><text x="666.0" y="413" text-anchor="middle" font-size="12.5" fill="#13284b">older workers</text><line x1="90" y1="380" x2="730" y2="380" stroke="#333"/><line x1="90" y1="40" x2="90" y2="380" stroke="#333"/><rect x="40" y="440" width="22" height="14" fill="#9ca3af"/><text x="70" y="452" font-size="13">Global average</text><circle cx="190" cy="447" r="8" fill="#f59e0b"/><text x="204" y="452" font-size="13">Europe and North America</text><circle cx="385" cy="447" r="8" fill="#0f766e"/><text x="399" y="452" font-size="13">East and South-East Asia</text><circle cx="580" cy="447" r="8" fill="#7c3aed"/><text x="594" y="452" font-size="13">Sub-Saharan Africa</text><text x="380" y="505" text-anchor="middle" font-size="11.5" fill="#6b7280">SBL practice data (illustrative, based on real global patterns). Not real survey results.</text></svg>