<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Solutions Based Learning</title>
<meta name="description" content="Log in to Solutions Based Learning.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/sbl-theme.css">
<link rel="stylesheet" href="/css/sbl-auth.css">
</head>
<body>
<div class="sbl-contours" aria-hidden="true"></div>
<div class="sbl-auth-shell">
  <a href="/" class="sbl-auth-brand">
    <span class="sbl-auth-brand__mark">SBL</span>
    <span class="sbl-auth-brand__name">Solutions <strong>Based</strong> Learning</span>
  </a>

  <div class="sbl-auth-card">
    <h1>Login to Solutions Based Learning</h1>
    <p class="sbl-auth-card__lead">Access is by application only. If you don't have an account yet, request access below.</p>

    <div class="sbl-alert sbl-alert--error" id="loginError" role="alert"></div>
    <div class="sbl-alert sbl-alert--success" id="loginNotice" role="status"></div>

    <form id="loginForm" novalidate>
      <div class="sbl-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="sbl-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <div class="sbl-auth-actions">
        <button type="submit" class="sbl-btn sbl-btn--primary" id="loginBtn">LOGIN</button>
        <a href="/register/" class="sbl-btn sbl-btn--secondary">REQUEST ACCESS</a>
      </div>
    </form>

    <div class="sbl-auth-notice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16v-4M12 8h.01"/><circle cx="12" cy="12" r="9"/></svg>
      <span>Can't log in? <a href="/forgot-password/">Request a password reset</a> and we'll email you a link to set a new one.</span>
    </div>
  </div>
</div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  // With no explicit ?redirect= (e.g. someone lands here directly, or via
  // a bookmark) default to the Humanities Hub rather than back to this
  // public marketing site's homepage — landing an already-logged-in
  // visitor back on '/' looked exactly like login had silently failed,
  // since '/' shows the same "Log in" link either way and gives no sign
  // anything happened.
  var redirectTo = params.get('redirect') || '/humanities-hub';

  // If already logged in, just go straight to the redirect target.
  fetch('/api/session').then(function (r) { return r.json(); }).then(function (data) {
    if (data.loggedIn) window.location.href = redirectTo;
  }).catch(function () {});

  var form = document.getElementById('loginForm');
  var btn = document.getElementById('loginBtn');
  var errorBox = document.getElementById('loginError');
  var noticeBox = document.getElementById('loginNotice');

  if (params.get('activated') === '1') {
    noticeBox.textContent = 'Your account is active. You can log in now.';
    noticeBox.classList.add('is-visible');
  }
  if (params.get('reset') === '1') {
    noticeBox.textContent = 'Your password has been reset. You can log in now.';
    noticeBox.classList.add('is-visible');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorBox.classList.remove('is-visible');
    btn.disabled = true;
    btn.textContent = 'LOGGING IN…';

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) {
          errorBox.textContent = result.data.error || 'Could not log in. Please try again.';
          errorBox.classList.add('is-visible');
          btn.disabled = false;
          btn.textContent = 'LOGIN';
          return;
        }
        window.location.href = redirectTo;
      })
      .catch(function () {
        errorBox.textContent = 'Could not reach the server. Please check your connection and try again.';
        errorBox.classList.add('is-visible');
        btn.disabled = false;
        btn.textContent = 'LOGIN';
      });
  });
})();
</script>
</body>
</html>
